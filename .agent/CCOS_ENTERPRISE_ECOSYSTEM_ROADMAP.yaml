    contract: docs/GOVERNED_MEMORY_STORE_CONTRACT.md
    owns:
      - exclusive_cooperating_writer_lock_on_a_stable_separate_file
      - explicit_provisioning_vs_mandatory_existing_authority_startup
      - expected_tenant_validation_before_provider_dispatch
      - immutable_acknowledged_projection_and_validated_replacement
      - blocked_reads_and_writes_after_uncertain_publication
    caller_requirements:
      - trusted_directory_and_cooperating_writers
      - no_direct_low_level_save_while_an_owner_is_live
