agent_operating_protocol:
  must_read_this_file:
    - at_start_of_every_agent_session
    - before_Core_sync_auth_RBAC_tenancy_backup_or_gateway_changes
    - before_external_adapter_or_agent_runtime_integration
    - before_PR_or_merge_decisions
  must_update_this_file:
    - when_Core_lineage_changes
    - when_security_or_governance_contract_changes
    - when_external_adapter_status_changes
  fail_closed: >-
    If this roadmap cannot be read, do not make major Core-sync, authorization,
    tenancy, governance, external-adapter, or merge decisions. Read-only diagnosis
    is allowed.
