name: Apply delete-cell accounting repair

on:
  push:
    branches:
      - fix/runtime-delete-cell-accounting
    paths:
      - .github/workflows/apply-delete-cell-accounting-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-delete-cell-accounting
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch accounting and add focused regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ccos-enterprise-runtime/src/lib.rs')
          text = path.read_text()

          start_marker = '    fn delete_cell(&mut self, tenant: &str, key: &str) -> bool {'
          end_marker = '\n\n    /// Delete a cell directly.'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''    fn delete_cell(&mut self, tenant: &str, key: &str) -> bool {
              let Some(cells) = self.store.get_mut(tenant) else {
                  return false;
              };
              let before = Self::map_bytes(cells);
              if cells.remove(key).is_none() {
                  return false;
              }
              let after = Self::map_bytes(cells);
              let empty = cells.is_empty();
              self.store_bytes = self.store_bytes.saturating_sub(before - after);
              if empty {
                  // Drop the empty per-tenant map after releasing the exact bytes
                  // that the removed final cell contributed to the global budget.
                  self.store.remove(tenant);
              }
              true
          }'''
          text = text[:start] + replacement + text[end:]

          test_anchor = '#[cfg(test)]\nmod tests {\n    use super::*;\n'
          if test_anchor not in text:
              raise SystemExit('runtime unit-test module anchor not found')
          tests = r'''

              #[test]
              fn deleting_last_cell_releases_incremental_storage_accounting() {
                  let mut d = Deployment::new();
                  let mut tenant = TenantState::new(0);
                  tenant.allow_model("model");
                  assert!(d.add_tenant("org", "tenant", tenant));

                  let scope = ccos_enterprise_tenancy::TenantScope::new(
                      ccos_enterprise_tenancy::TenantId("tenant".into()),
                      "key".to_string(),
                  );
                  assert!(d.put(&scope, "value"));
                  assert!(d.store_bytes > 0);
                  assert_eq!(d.store_bytes, d.total_cell_bytes());

                  assert!(d.remove(&scope));
                  assert_eq!(d.cell_count("tenant"), 0);
                  assert_eq!(d.store_bytes, 0);
                  assert_eq!(d.store_bytes, d.total_cell_bytes());
              }

              #[test]
              fn deleting_one_of_multiple_cells_keeps_storage_accounting_exact() {
                  let mut d = Deployment::new();
                  let mut tenant = TenantState::new(0);
                  tenant.allow_model("model");
                  assert!(d.add_tenant("org", "tenant", tenant));

                  let first = ccos_enterprise_tenancy::TenantScope::new(
                      ccos_enterprise_tenancy::TenantId("tenant".into()),
                      "first".to_string(),
                  );
                  let second = ccos_enterprise_tenancy::TenantScope::new(
                      ccos_enterprise_tenancy::TenantId("tenant".into()),
                      "second".to_string(),
                  );
                  assert!(d.put(&first, "longer-value"));
                  assert!(d.put(&second, "kept"));
                  let before = d.store_bytes;
                  assert_eq!(before, d.total_cell_bytes());

                  assert!(d.remove(&first));
                  assert_eq!(d.get(&second), Some("kept"));
                  assert!(d.store_bytes < before);
                  assert_eq!(d.store_bytes, d.total_cell_bytes());
              }
          '''
          if 'fn deleting_last_cell_releases_incremental_storage_accounting()' not in text:
              text = text.replace(test_anchor, test_anchor + tests, 1)

          path.write_text(text)
          PY
          cargo fmt --all
      - name: Focused runtime regressions
        run: cargo test -p ccos-enterprise-runtime --lib storage_accounting
      - name: Existing storage overwrite regression
        run: cargo test -p ccos-enterprise-conformance --release --test storage_overwrite_regression
      - name: Existing concurrency invariant
        run: cargo test -p ccos-enterprise-conformance --release --test stress_concurrency_chaos chaos_storm_thirty_two_threads_holds_every_global_invariant
      - name: Commit validated repair
        run: |
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add crates/ccos-enterprise-runtime/src/lib.rs
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix(storage): release bytes when deleting final cell"
          git push origin HEAD:fix/runtime-delete-cell-accounting
