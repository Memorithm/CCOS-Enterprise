          helpers = r'''fn canonical_dsh_turn(value: &str) -> Result<u64, String> {
    let turn = value
        .parse::<u64>()
        .map_err(|_| "DSH turn_id for skill tracking must be a decimal integer".to_string())?;
    if turn.to_string() != value {
        return Err("DSH turn_id for skill tracking is not canonical".into());
    }
    Ok(turn)
}

fn canonical_skill_id(value: &str) -> bool {
    let Some(fingerprint) = value.strip_prefix("skill-v1-") else {
        return false;
    };
    fingerprint.len() == 64
        && fingerprint
            .bytes()
            .all(|byte| matches!(byte, b'0'..=b'9' | b'a'..=b'f'))
}

fn skill_trial_exposure_from_result(
    meta: &Meta,
    value: &Value,
) -> Result<SkillTrialExposureRecord, String> {
    let structured = value
        .get("structuredContent")
        .and_then(Value::as_object)
        .ok_or_else(|| "skill read returned no structuredContent".to_string())?;
    let skills = structured
        .get("skills")
        .and_then(Value::as_array)
        .ok_or_else(|| "skill read returned no skills array".to_string())?;
    if skills.len() > MAX_SKILL_READ_LIMIT {
        return Err("skill read exceeded the bounded result limit".into());
    }
    let returned = structured
        .get("returned")
        .and_then(Value::as_u64)
        .ok_or_else(|| "skill read returned no bounded result count".to_string())?;
    if returned != skills.len() as u64 {
        return Err("skill read result count does not match skills array".into());
    }
    let mut seen = BTreeSet::new();
    let mut skill_ids = Vec::with_capacity(skills.len());
    for skill in skills {
        let id = skill
            .get("id")
            .and_then(Value::as_str)
            .ok_or_else(|| "skill read returned an entry without id".to_string())?;
        if !canonical_skill_id(id) || !seen.insert(id.to_string()) {
            return Err("skill read returned a non-canonical or duplicate skill id".into());
        }
        skill_ids.push(id.to_string());
    }
    let turn = canonical_dsh_turn(&meta.turn_id)?;
    Ok(SkillTrialExposureRecord {
        turn_key: trial_turn_key(&meta.host_session_id, turn),
        skill_ids,
    })
}

fn recovered_skill_trial_exposure(
    effect: &EffectRecord,
) -> Result<Option<SkillTrialExposureRecord>, String> {
    if effect.skill_trial_tracking && effect.tool != SKILL_READ_TOOL {
        return Err("durable effect marker tracks a trial for a non-skill-read tool".into());
    }
    if effect.skill_trial_exposure.is_some()
        && (!effect.skill_trial_tracking
            || effect.tool != SKILL_READ_TOOL
            || effect.state != EffectState::Succeeded)
    {
        return Err("durable skill-trial exposure metadata is inconsistent".into());
    }
    if effect.skill_trial_tracking && effect.state == EffectState::Succeeded {
        return effect
            .skill_trial_exposure
            .clone()
            .map(Some)
            .ok_or_else(|| "tracked successful skill read is missing exposure metadata".into());
    }
    Ok(None)
}

