            assert_eq!(trial.status, ccos_enterprise_skills::SkillTrialStatus::Pending);
            assert_eq!(trial.turn_key, trial_turn_key("test-session", 44));
            assert_eq!(
                read_effect(&effect_path(&root)).unwrap().unwrap().state,
                EffectState::Settled
            );
        }
        cleanup(&root);
    }

