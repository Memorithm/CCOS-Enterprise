                        call_id: format!("fixture-call-{turn}"),
                        outcome: ToolOutcome::Succeeded,
                    }],
                })
                .unwrap();
        }
        let id = registry.active().next().unwrap().id.clone();
        server.skill_store.save(registry.snapshot()).unwrap();
        id
    }

