name: CI (fast)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.89.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Keep the repository's pinned formatting/lint baseline explicit.
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Actual pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Workspace lockfile is current before any graph operation
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          git diff --exit-code HEAD -- Cargo.lock
      - name: CI guard regressions
        run: |
          python3 scripts/test-ci-guards.py
          python3 scripts/test-author-policy.py
      - name: Author policy (single human contributor)
        env:
          EVENT_KIND: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_KIND" = "pull_request" ]; then
            scripts/check-author-policy.sh "$BASE_SHA..$HEAD_SHA"
          elif [ "$EVENT_KIND" = "push" ]; then
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              scripts/check-author-policy.sh "$PUSH_BEFORE..$PUSH_AFTER"
            else
              scripts/check-author-policy.sh "$PUSH_AFTER"
            fi
          else
            scripts/check-author-policy.sh HEAD
          fi
      - name: "Enterprise boundary: no RSI/Forge/Research-Lab dependency"
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-guards.sh
          require_no_matches grep -RniE 'ccos-rsi|forge-core|ccos-forge|ccos-research-lab|self_improvement|self_modify' \
            --include='Cargo.toml' crates tools Cargo.toml
          require_clean_output 'ccos-rsi|forge|research-lab|octacore' \
            cargo tree --locked --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features --color never
          # A failed manifest scan is not an empty allowlist. Preserve both paths.
          manifest_list="$RUNNER_TEMP/ccos-octasoma-manifests"
          grep -Rli 'octasoma' --include='Cargo.toml' crates tools Cargo.toml > "$manifest_list"
          sort -o "$manifest_list" "$manifest_list"
          mapfile -t OCTA_MANIFESTS < "$manifest_list"
          printf '%s\n' "${OCTA_MANIFESTS[@]}" | grep -qx 'Cargo.toml'
          printf '%s\n' "${OCTA_MANIFESTS[@]}" | grep -qx 'crates/ccos-enterprise-octasoma/Cargo.toml'
          test "${#OCTA_MANIFESTS[@]}" -eq 2
      - run: cargo fmt --all -- --check
      # Sweep Enterprise features, not unrelated optional features of Core.
      # Core remains a dependency and is also tested in the default workspace suite.
      - run: cargo check --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features --locked
      - run: cargo clippy --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features --locked -- -D warnings
      - name: Enterprise all-features release tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features --release --locked \
            2>&1 | tee "$RUNNER_TEMP/ccos-fast-release-tests.log"
      - name: Upload release-test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccos-fast-release-tests-${{ github.sha }}
          path: ${{ runner.temp }}/ccos-fast-release-tests.log
          if-no-files-found: ignore
          retention-days: 3
      - run: cargo test --workspace --locked
      # Exercise non-default identity mechanisms, including the empty combination.
      - name: identity verifier (non-default features)
        run: |
          FEATS=token-auth,mtls-auth,oidc-auth,test-identities
          cargo test -p ccos-enterprise-auth --features "$FEATS" --locked
          cargo clippy -p ccos-enterprise-auth --features "$FEATS" --locked \
            --all-targets -- -D warnings
          for f in "" token-auth mtls-auth oidc-auth test-identities \
                   token-auth,mtls-auth token-auth,oidc-auth mtls-auth,oidc-auth \
                   token-auth,test-identities token-auth,mtls-auth,oidc-auth; do
            echo "::group::clippy features=[$f]"
            cargo clippy -p ccos-enterprise-auth ${f:+--features "$f"} --locked \
              --all-targets -- -D warnings
            echo "::endgroup::"
          done
      - name: No implicit lockfile repair
        if: always()
        run: git diff --exit-code HEAD -- Cargo.lock

  current-stable:
    name: Current stable build and memory composition tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Actual current stable toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Validate committed lockfile first
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Enterprise all-features compilation on current stable
        run: cargo check --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features --locked
      - name: Memory and MCP composition on current stable
        run: cargo test -p ccos-enterprise-memory -p ccos-enterprise-mcp --all-features --locked
      - name: No implicit lockfile repair
        if: always()
        run: git diff --exit-code HEAD -- Cargo.lock
