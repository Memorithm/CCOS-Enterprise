name: CI (fast)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The workspace depends on ccos-core by PATH during development.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Author policy (single human contributor)
        run: |
          # On pull_request events HEAD is GitHub's synthetic merge ref,
          # whose fabricated merge commit (author = triggering account,
          # committer = web-flow) can never satisfy the policy — check the
          # range up to the PR's real head instead.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check-author-policy.sh "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
          else
            scripts/check-author-policy.sh HEAD
          fi
      - name: "Enterprise boundary: no RSI/Forge/Research-Lab dependency"
        run: |
          ! grep -RniE 'ccos-rsi|forge-core|ccos-forge|ccos-research-lab|self_improvement|self_modify' \
            --include='Cargo.toml' crates tools Cargo.toml
          ! cargo tree --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features 2>/dev/null | grep -iE 'ccos-rsi|forge|research-lab|octacore'
          # OctaSoma and its targeted SciRust dependencies are now an explicit
          # Enterprise capability, but direct declaration is confined to the
          # workspace pin plus the governed adapter crate.
          mapfile -t OCTA_MANIFESTS < <(grep -Rli 'octasoma' --include='Cargo.toml' crates tools Cargo.toml | sort)
          printf '%s\n' "${OCTA_MANIFESTS[@]}" | grep -qx 'Cargo.toml'
          printf '%s\n' "${OCTA_MANIFESTS[@]}" | grep -qx 'crates/ccos-enterprise-octasoma/Cargo.toml'
          test "${#OCTA_MANIFESTS[@]}" -eq 2
      - name: Workspace lockfile is current
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - run: cargo fmt --all -- --check
      # NOT `--all-features` across the whole workspace. Core is a member now
      # and carries opt-in features of its own. Enterprise enables semantic
      # memory through `ccos-enterprise-octasoma`, not by sweeping Core's
      # unrelated optional feature matrix. Core packages are excluded from
      # *selection*, so they still build as dependencies with precisely the
      # features Enterprise asks for (`default-features = false`); only
      # Enterprise's own feature matrix is swept here.
      - run: cargo check --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features
      - run: cargo clippy --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features -- -D warnings
      - run: cargo test --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features --release
      # Excluding Core from the feature sweep must not mean Core stops being
      # tested — that would trade a boundary risk for a coverage hole. Its own
      # suite runs at default features, which is what Enterprise ships. This
      # covers Core and Enterprise in one command, the thing two repositories
      # could never do.
      - run: cargo test --workspace
      # The identity verifier and the fixtures that drive the gates live behind
      # non-default features, so `--workspace` compiles neither. Without this
      # step the 18 adversarial tests in `ccos-enterprise-auth` would be exactly
      # the failure that crate was written to remove: a security mechanism no
      # build compiles and no run exercises, passing CI by being absent.
      - name: identity verifier (non-default features)
        run: |
          FEATS=token-auth,mtls-auth,oidc-auth,test-identities
          cargo test -p ccos-enterprise-auth --features "$FEATS"
          cargo clippy -p ccos-enterprise-auth --features "$FEATS" \
            --all-targets -- -D warnings
          # Every combination, including the empty one. The features gate a
          # verifier, its issuer map and the constructor the mechanisms share,
          # so a symbol can be live in one combination and dead in another —
          # and `-D warnings` is right to say so. This loop exists because a
          # push once went red on exactly the combination nobody had run: no
          # features at all, which is what a deployment that has configured no
          # authenticator compiles.
          for f in "" token-auth mtls-auth oidc-auth test-identities \
                   token-auth,mtls-auth token-auth,oidc-auth mtls-auth,oidc-auth \
                   token-auth,test-identities token-auth,mtls-auth,oidc-auth; do
            echo "::group::clippy features=[$f]"
            cargo clippy -p ccos-enterprise-auth ${f:+--features "$f"} \
              --all-targets -- -D warnings
            echo "::endgroup::"
          done
