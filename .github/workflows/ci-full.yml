name: CI (full)

on:
  push:
    branches: [fix/runtime-true-idempotent-replay]
  pull_request:

permissions:
  contents: read

jobs:
  budget_replay_fix:
    name: repair replay billing conformance
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-true-idempotent-replay
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Patch and execute the replay billing guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/ccos-enterprise-conformance/tests/stress_budget_property.rs')
          s = p.read_text()
          fn = 'fn a_replayed_request_id_is_billed_once() {'
          fn_pos = s.index(fn)

          old_doc = '/// A decided `(tenant, request_id)` is now Forwarded without being charged.\n/// The scenario is kept verbatim — the same ten replays of one id, at the same\n/// 100 tokens each — with the opposite expectation: billed once.\n'
          new_doc = '/// A decided `(tenant, request_id)` is now returned as explicit `Replayed`\n/// without being charged or becoming eligible to execute again. The scenario is\n/// kept verbatim — ten attempts of one id, at 100 tokens each — with the opposite\n/// expectation: one `Forwarded`, nine `Replayed`, billed once.\n'
          if s.count(old_doc) != 1:
              raise SystemExit(f'expected one stale replay doc block, found {s.count(old_doc)}')
          s = s.replace(old_doc, new_doc, 1)
          fn_pos = s.index(fn)

          loop_start = s.index('    for i in 0..10 {', fn_pos)
          after_loop = s.index('    assert_eq!(\n        d.spent("acme"),', loop_start)
          replacement = '''    assert_eq!(
              d.admit(Call {
                  actor: &alice,
                  request: &req,
                  model: "claude-opus",
                  cost_tokens: 100,
                  variant: None,
                  justification: None,
              }),
              Outcome::Forwarded,
              "the first request is the one execution"
          );
          for i in 1..10 {
              assert_eq!(
                  d.admit(Call {
                      actor: &alice,
                      request: &req,
                      model: "claude-opus",
                      cost_tokens: 100,
                      variant: None,
                      justification: None,
                  }),
                  Outcome::Replayed,
                  "replay {i} is acknowledged without a second execution"
              );
          }
          '''
          s = s[:loop_start] + replacement + s[after_loop:]

          trail_marker = '''    assert!(
              trail.iter().all(|r| r.request_id == "the-same-request"),
              "…under the id the client sent…"
          );
          '''
          trail_pos = s.index(trail_marker, fn_pos) + len(trail_marker)
          trail_guard = '''    assert_eq!(trail[0].outcome, Outcome::Forwarded);
          assert!(
              trail[1..].iter().all(|r| r.outcome.is_replayed()),
              "…and every duplicate is recorded explicitly as Replayed"
          );
          '''
          s = s[:trail_pos] + trail_guard + s[trail_pos:]
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test -p ccos-enterprise-conformance --test stress_budget_property a_replayed_request_id_is_billed_once --release -- --exact
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add tests/ccos-enterprise-conformance/tests/stress_budget_property.rs
          git diff --cached --quiet && exit 0
          git commit -m 'test(runtime): expect explicit replay in billing guard'
          git push origin HEAD:fix/runtime-true-idempotent-replay
