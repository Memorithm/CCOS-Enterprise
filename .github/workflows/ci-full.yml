name: CI (full)

on:
  push:
    branches: [fix/runtime-true-idempotent-replay]
  pull_request:

permissions:
  contents: read

jobs:
  qpage_replay_fix:
    name: repair Q-Page replay conformance
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-true-idempotent-replay
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Update and execute the Q-Page replay guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/ccos-enterprise-conformance/tests/stress_qpages_exhaustive.rs')
          s = p.read_text()
          old_doc = '''/// A `(tenant, request_id)` already decided now returns its prior outcome
          /// without charging again. This test is the regression guard: same inputs —
          /// one id, five calls — opposite expectation.
          '''
          new_doc = '''/// A `(tenant, request_id)` already decided now returns explicit `Replayed`
          /// without charging or becoming eligible to execute again. This test is the
          /// regression guard: same inputs — one id, five attempts — one `Forwarded`,
          /// four `Replayed`, one charge.
          '''
          if s.count(old_doc) != 1:
              raise SystemExit(f'expected one stale Q-Page replay doc block, found {s.count(old_doc)}')
          s = s.replace(old_doc, new_doc, 1)

          old_loop = '''    for attempt in 0..5 {
              let out = d.admit(Call {
                  actor: &a,
                  request: &req,
                  model: "claude-opus",
                  cost_tokens: 1,
                  variant: Some(AdvancedQPageVariant::ExperimentalBridge),
                  justification: None,
              });
              assert!(
                  out.is_forwarded(),
                  "attempt {attempt}: a replay returns the prior outcome, not a refusal: {out:?}"
              );
          }
          '''
          new_loop = '''    let first = d.admit(Call {
              actor: &a,
              request: &req,
              model: "claude-opus",
              cost_tokens: 1,
              variant: Some(AdvancedQPageVariant::ExperimentalBridge),
              justification: None,
          });
          assert_eq!(first, Outcome::Forwarded, "the first attempt executes");
          for attempt in 1..5 {
              let out = d.admit(Call {
                  actor: &a,
                  request: &req,
                  model: "claude-opus",
                  cost_tokens: 1,
                  variant: Some(AdvancedQPageVariant::ExperimentalBridge),
                  justification: None,
              });
              assert_eq!(
                  out,
                  Outcome::Replayed,
                  "attempt {attempt}: a duplicate id is acknowledged without another execution"
              );
          }
          '''
          if s.count(old_loop) != 1:
              raise SystemExit(f'expected one stale Q-Page replay loop, found {s.count(old_loop)}')
          s = s.replace(old_loop, new_loop, 1)

          old_journal = '''    assert_eq!(d.audit().count(), 5, "every attempt is still journaled");
              let costs: Vec<u64> = d.audit().map(|r| r.cost).collect();
          '''
          new_journal = '''    assert_eq!(d.audit().count(), 5, "every attempt is still journaled");
              let outcomes: Vec<Outcome> = d.audit().map(|r| r.outcome.clone()).collect();
              assert_eq!(outcomes[0], Outcome::Forwarded);
              assert!(outcomes[1..].iter().all(Outcome::is_replayed));
              let costs: Vec<u64> = d.audit().map(|r| r.cost).collect();
          '''
          if s.count(old_journal) != 1:
              raise SystemExit(f'expected one Q-Page journal block, found {s.count(old_journal)}')
          s = s.replace(old_journal, new_journal, 1)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test -p ccos-enterprise-conformance --test stress_qpages_exhaustive a_replayed_request_id_is_never_billed_twice --release -- --exact
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add tests/ccos-enterprise-conformance/tests/stress_qpages_exhaustive.rs
          git diff --cached --quiet && exit 0
          git commit -m 'test(runtime): expect explicit Q-Page replays'
          git push origin HEAD:fix/runtime-true-idempotent-replay
