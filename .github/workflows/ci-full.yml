name: CI (full)

on:
  push:
    branches: [fix/runtime-true-idempotent-replay]
  pull_request:

permissions:
  contents: read

jobs:
  concurrent_replay_fix:
    name: repair concurrent replay conformance
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-true-idempotent-replay
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Update and execute the identical concurrent-call guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/ccos-enterprise-conformance/tests/stress_concurrency_chaos.rs')
          s = p.read_text()
          old_doc = '''/// The same 32 threads, the same byte-identical call, the opposite
          /// expectation. `AuditRecord::sequence` makes the records pairwise distinct
          /// and totally ordered; replay suppression charges the request **once**. The
          /// 31 replays are still forwarded — a retry gets its prior outcome, not a
          /// refusal — and still journaled, each carrying `cost: 0`, so the trail shows
          /// that the calls happened *and* that they were free.
          '''
          new_doc = '''/// The same 32 threads, the same byte-identical call, the opposite
          /// expectation. `AuditRecord::sequence` makes the records pairwise distinct
          /// and totally ordered; replay suppression charges and executes the request
          /// **once**. The other 31 attempts are explicit `Replayed` outcomes: journaled,
          /// zero-cost, and ineligible to execute the effect again.
          '''
          if s.count(old_doc) != 1:
              raise SystemExit(f'expected one stale concurrent replay doc block, found {s.count(old_doc)}')
          s = s.replace(old_doc, new_doc, 1)

          old_assert = '''    // Billed once: the record that decided first carries the charge, and the
              // {THREADS}-1 suppressed replays carry a zero the operator can read.
              assert!(trail.iter().all(|r| r.outcome.is_forwarded()));
              assert_eq!(first.cost, 1, "the first decision is the one that pays");
              assert!(trail[1..].iter().all(|r| r.cost == 0), "a replay is free");
          '''
          new_assert = '''    // Executed and billed once: the record that won the lock first is the
              // single Forwarded decision; every duplicate id after it is an explicit,
              // zero-cost replay and cannot execute the effect again.
              assert_eq!(first.outcome, Outcome::Forwarded);
              assert!(
                  trail[1..].iter().all(|r| r.outcome.is_replayed()),
                  "every concurrent duplicate after the winner must be Replayed"
              );
              assert_eq!(first.cost, 1, "the first decision is the one that pays");
              assert!(trail[1..].iter().all(|r| r.cost == 0), "a replay is free");
              assert_eq!(
                  trail.iter().filter(|r| r.outcome.is_forwarded()).count(),
                  1,
                  "exactly one concurrent attempt may execute"
              );
              assert_eq!(
                  trail.iter().filter(|r| r.outcome.is_replayed()).count(),
                  THREADS - 1,
                  "all remaining identical attempts are replays"
              );
          '''
          if s.count(old_assert) != 1:
              raise SystemExit(f'expected one stale concurrent replay assertion block, found {s.count(old_assert)}')
          s = s.replace(old_assert, new_assert, 1)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test -p ccos-enterprise-conformance --test stress_concurrency_chaos identical_concurrent_calls_are_ordered_and_billed_exactly_once --release -- --exact
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add tests/ccos-enterprise-conformance/tests/stress_concurrency_chaos.rs
          git diff --cached --quiet && exit 0
          git commit -m 'test(runtime): expect explicit concurrent replays'
          git push origin HEAD:fix/runtime-true-idempotent-replay
