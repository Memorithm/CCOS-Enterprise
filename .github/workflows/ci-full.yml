name: CI (full)

on:
  push:
    branches: [fix/runtime-true-idempotent-replay]
  pull_request:

permissions:
  contents: read

jobs:
  tenant_dispatch_fix:
    name: repair tenant dispatch replay collision
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-true-idempotent-replay
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Replace and execute the tenant routing guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ccos-enterprise-mcp/src/server.rs')
          s = p.read_text()
          start_marker = '    #[test]\n    fn each_tenant_is_dispatched_under_its_own_name() {'
          start = s.index(start_marker)
          end = s.index('    #[test]\n    fn every_advertised_capability_is_actually_callable()', start)
          replacement = r'''    #[test]
          fn each_tenant_is_dispatched_under_its_own_name() {
              let mut mcp = front_door();
              let a = actor("memorithm", "alice", AuthStrength::Token);
              for (index, tenant) in ["acme", "globex", "acme"].into_iter().enumerate() {
                  let req = request(
                      tenant,
                      "alice",
                      "memory.recall",
                      &format!("r-{tenant}-{index}"),
                  );
                  let out = mcp.call(
                      Call {
                          actor: &a,
                          request: &req,
                          model: "claude-opus",
                          cost_tokens: 1,
                          variant: None,
                          justification: None,
                      },
                      &json!({}),
                  );
                  assert!(matches!(out, McpOutcome::Ok(_)), "{tenant}: {out:?}");
              }
              let tenants: Vec<&str> = mcp
                  .backend()
                  .calls
                  .iter()
                  .map(|(t, _)| t.as_str())
                  .collect();
              assert_eq!(tenants, vec!["acme", "globex", "acme"]);
          }

          '''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          cargo fmt --all
          cargo test -p ccos-enterprise-mcp each_tenant_is_dispatched_under_its_own_name --release -- --exact
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add crates/ccos-enterprise-mcp/src/server.rs
          git diff --cached --quiet && exit 0
          git commit -m 'test(mcp): use unique ids in tenant routing guard'
          git push origin HEAD:fix/runtime-true-idempotent-replay
