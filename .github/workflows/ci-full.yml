name: CI (full)

on:
  push:
    branches: [fix/runtime-true-idempotent-replay]
  pull_request:

permissions:
  contents: read

jobs:
  qpage_replay_fix:
    name: repair Q-Page replay conformance
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-true-idempotent-replay
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Replace and execute the complete Q-Page replay guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/ccos-enterprise-conformance/tests/stress_qpages_exhaustive.rs')
          s = p.read_text()
          start_marker = '/// REPAIRED (was an aside in the F2 test above, asserting the defect): the\n'
          end_marker = '/// FINDING F3 (spec-violation), still open:'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          replacement = r'''/// REPAIRED (was an aside in the F2 test above, asserting the defect): the
          /// `request_id` is documented as an "idempotency/correlation key" and nothing
          /// read it, so **the same id was charged on every retry** — a client whose
          /// connection dropped mid-call paid twice for one decision, and a retry loop
          /// could drain a tenant's budget without ever presenting a new request.
          ///
          /// A `(tenant, request_id)` already decided now returns explicit `Replayed`
          /// without charging or becoming eligible to execute again. This test is the
          /// regression guard: same inputs — one id, five attempts — one `Forwarded`,
          /// four `Replayed`, one charge.
          #[test]
          fn a_replayed_request_id_is_never_billed_twice() {
              let mut d = deployment_activating(SUBSETS - 1);
              let a = actor(ORG, "alice", AuthStrength::Token);
              let req = request("acme", "alice", "memory.recall", "same-id");

              let first = d.admit(Call {
                  actor: &a,
                  request: &req,
                  model: "claude-opus",
                  cost_tokens: 1,
                  variant: Some(AdvancedQPageVariant::ExperimentalBridge),
                  justification: None,
              });
              assert_eq!(first, Outcome::Forwarded, "the first attempt executes");

              for attempt in 1..5 {
                  let out = d.admit(Call {
                      actor: &a,
                      request: &req,
                      model: "claude-opus",
                      cost_tokens: 1,
                      variant: Some(AdvancedQPageVariant::ExperimentalBridge),
                      justification: None,
                  });
                  assert_eq!(
                      out,
                      Outcome::Replayed,
                      "attempt {attempt}: a duplicate id is acknowledged without another execution"
                  );
              }

              assert_eq!(
                  d.spent("acme"),
                  Some(1),
                  "billed once, replayed four times: the same request_id is not a new call"
              );

              // Suppression is observable, not silence: all attempts are journaled,
              // with exactly one executable/charged decision and four zero-cost replays.
              let trail: Vec<_> = d.audit().collect();
              assert_eq!(trail.len(), 5, "every attempt is still journaled");
              assert_eq!(trail[0].outcome, Outcome::Forwarded);
              assert!(trail[1..].iter().all(|r| r.outcome.is_replayed()));
              let costs: Vec<u64> = trail.iter().map(|r| r.cost).collect();
              assert_eq!(costs, vec![1, 0, 0, 0, 0]);
              let billed: u64 = costs.iter().sum();
              assert_eq!(Some(billed), d.spent("acme"), "the journal reconciles");

              let replayed = d
                  .metrics()
                  .into_iter()
                  .find(|(k, _)| k == "gateway.replayed")
                  .map(|(_, v)| v);
              assert_eq!(replayed, Some(4), "and the suppression is observable");
          }

          '''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          cargo fmt --all
          cargo test -p ccos-enterprise-conformance --test stress_qpages_exhaustive a_replayed_request_id_is_never_billed_twice --release -- --exact
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add tests/ccos-enterprise-conformance/tests/stress_qpages_exhaustive.rs
          git diff --cached --quiet && exit 0
          git commit -m 'test(runtime): expect explicit Q-Page replays'
          git push origin HEAD:fix/runtime-true-idempotent-replay
