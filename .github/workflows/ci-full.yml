name: CI (full)

on:
  push:
    branches: [main, fix/runtime-true-idempotent-replay]
  pull_request:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  contract:
    name: boundary + contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: gateway namespace contract (Hermes/OpenClaw surface)
        run: cargo test -p ccos-enterprise-gateway --release
      - name: Knowledge Plane P0 conformance
        run: |
          cargo test -p ccos-enterprise-knowledge-model -p ccos-enterprise-knowledge -p ccos-enterprise-knowledge-store --release
          cargo test -p ccos-knowledge-conformance --test p0 --release
      - name: Knowledge Plane P1 local ingestion
        run: |
          cargo test -p ccos-enterprise-ingest --release
          cargo test -p ccos-knowledge-conformance --test p1_local_ingest --release
      - name: Knowledge Plane P1 normalization
        run: |
          cargo test -p ccos-enterprise-normalize --release
          cargo test -p ccos-knowledge-conformance --test p1_normalize --release
      - name: Knowledge Plane P1 source-span parsing
        run: |
          cargo test -p ccos-enterprise-parse --release
          cargo test -p ccos-knowledge-conformance --test p1_parse --release
      - name: Knowledge Plane P2 structural extraction
        run: |
          cargo test -p ccos-enterprise-extract --release
          cargo test -p ccos-knowledge-conformance --test p2_extract --release
      - name: Knowledge Plane P2 exact-key resolution
        run: |
          cargo test -p ccos-enterprise-resolution --release
          cargo test -p ccos-knowledge-conformance --test p2_resolution --release
      - name: Knowledge Plane P3 canonical graph view
        run: |
          cargo test -p ccos-enterprise-kg --release
          cargo test -p ccos-knowledge-conformance --test p3_graph --release
      - name: Knowledge Plane P4 ontology validation
        run: |
          cargo test -p ccos-enterprise-ontology --release
          cargo test -p ccos-knowledge-conformance --test p4_ontology --release
      - name: Knowledge Plane P4 typed canonical promotion
        run: |
          cargo test -p ccos-enterprise-promotion --release
          cargo test -p ccos-knowledge-conformance --test p4_promotion --release
      - name: Knowledge Plane P4 reversible ontology migration
        run: |
          cargo test -p ccos-enterprise-ontology-migration --release
          cargo test -p ccos-knowledge-conformance --test p4_migration --release
      - name: Knowledge Plane P4 semantic interoperability
        run: |
          cargo test -p ccos-enterprise-semantic --release
          cargo test -p ccos-knowledge-conformance --test p4_semantic --release
      - name: Knowledge Plane P5 Decision Intelligence
        run: |
          cargo test -p ccos-enterprise-decision --release
          cargo test -p ccos-knowledge-conformance --test p5_decision --release
      - name: RBAC + tenancy + policy contracts
        run: cargo test -p ccos-enterprise-rbac -p ccos-enterprise-tenancy -p ccos-enterprise-policy --release
      - name: governance wire formats (claim, manifest, revocation)
        run: cargo test -p ccos-enterprise-governance --all-features --release
      - name: license server integration
        run: cargo test -p ccos-license-server --release
      - name: Hermes/OpenClaw tool-catalogue contract
        run: cargo test -p ccos-enterprise-conformance --test boundary_contract --release
      - name: governed request path (identity → tenancy → authz → policy → boundary → audit)
        run: cargo test -p ccos-enterprise-conformance --test governed_path --release
      - name: tenant isolation + cross-tenant leakage + concurrency
        run: cargo test -p ccos-enterprise-conformance --test isolation --release
      - name: adversarial (escalation, quota abuse, forged restore, admin trail)
        run: cargo test -p ccos-enterprise-conformance --test adversarial --release

  replay_patch:
    name: apply typed replay fix
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-true-idempotent-replay
          fetch-depth: 0
      - name: Patch runtime and governed front door
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(s.replace(old, new, 1))

          runtime = 'crates/ccos-enterprise-runtime/src/lib.rs'
          replace_once(runtime,
          '''pub enum Outcome {
              Forwarded,
              Refused(Refusal),
          }

          impl Outcome {
              pub fn is_forwarded(&self) -> bool {
                  matches!(self, Outcome::Forwarded)
              }

              pub fn refusal(&self) -> Option<&Refusal> {
                  match self {
                      Outcome::Refused(r) => Some(r),
                      Outcome::Forwarded => None,
                  }
              }
          }
          ''',
          '''pub enum Outcome {
              /// The call passed every gate and its effect may execute exactly once.
              Forwarded,
              /// This tenant/request_id was already forwarded earlier. The replay is
              /// journaled at zero cost but MUST NOT execute the effect again.
              Replayed,
              Refused(Refusal),
          }

          impl Outcome {
              /// True only for the first admitted execution, never for a replay.
              pub fn is_forwarded(&self) -> bool {
                  matches!(self, Outcome::Forwarded)
              }

              pub fn is_replayed(&self) -> bool {
                  matches!(self, Outcome::Replayed)
              }

              pub fn refusal(&self) -> Option<&Refusal> {
                  match self {
                      Outcome::Refused(r) => Some(r),
                      Outcome::Forwarded | Outcome::Replayed => None,
                  }
              }
          }
          ''')

          replace_once(runtime,
          '''        match &outcome {
                      Outcome::Forwarded => self.metrics.inc("gateway.forwarded", 1),
                      Outcome::Refused(r) => {
                          self.metrics.inc("gateway.refused", 1);
                          self.metrics.inc(&format!("gateway.refused.{}", tag(r)), 1);
                      }
                  }
          ''',
          '''        match &outcome {
                      Outcome::Forwarded => self.metrics.inc("gateway.forwarded", 1),
                      Outcome::Replayed => self.metrics.inc("gateway.replayed", 1),
                      Outcome::Refused(r) => {
                          self.metrics.inc("gateway.refused", 1);
                          self.metrics.inc(&format!("gateway.refused.{}", tag(r)), 1);
                      }
                  }
          ''')

          replace_once(runtime,
          '''        if self.decided.contains(&key) {
                      self.metrics.inc("gateway.replayed", 1);
                      return (Outcome::Forwarded, 0);
                  }
          ''',
          '''        if self.decided.contains(&key) {
                      return (Outcome::Replayed, 0);
                  }
          ''')

          replace_once(runtime,
          '''            match &record.outcome {
                          Outcome::Forwarded => d.metrics.inc("gateway.forwarded", 1),
                          Outcome::Refused(r) => {
                              d.metrics.inc("gateway.refused", 1);
                              d.metrics.inc(&format!("gateway.refused.{}", tag(r)), 1);
                          }
                      }
          ''',
          '''            match &record.outcome {
                          Outcome::Forwarded => d.metrics.inc("gateway.forwarded", 1),
                          Outcome::Replayed => d.metrics.inc("gateway.replayed", 1),
                          Outcome::Refused(r) => {
                              d.metrics.inc("gateway.refused", 1);
                              d.metrics.inc(&format!("gateway.refused.{}", tag(r)), 1);
                          }
                      }
          ''')

          replace_once(runtime,
          '''    #[test]
              fn a_replayed_request_id_is_not_billed_twice() {
                  let mut d = two_tenant_deployment();
                  let alice = actor("memorithm", "alice", AuthStrength::Token);
                  let req = request("acme", "alice", "memory.ingest", "r-same");
                  for _ in 0..5 {
                      assert_eq!(
                          d.admit(Call {
                              actor: &alice,
                              request: &req,
                              model: "claude-opus",
                              cost_tokens: 100,
                              variant: None,
                              justification: None,
                          }),
                          Outcome::Forwarded
                      );
                  }
                  assert_eq!(
                      d.spent("acme"),
                      Some(100),
                      "billed once, replayed four times"
                  );
              }
          ''',
          '''    #[test]
              fn a_replayed_request_id_is_explicit_and_not_billed_twice() {
                  let mut d = two_tenant_deployment();
                  let alice = actor("memorithm", "alice", AuthStrength::Token);
                  let req = request("acme", "alice", "memory.ingest", "r-same");
                  assert_eq!(
                      d.admit(Call {
                          actor: &alice,
                          request: &req,
                          model: "claude-opus",
                          cost_tokens: 100,
                          variant: None,
                          justification: None,
                      }),
                      Outcome::Forwarded
                  );
                  for _ in 0..4 {
                      assert_eq!(
                          d.admit(Call {
                              actor: &alice,
                              request: &req,
                              model: "claude-opus",
                              cost_tokens: 100,
                              variant: None,
                              justification: None,
                          }),
                          Outcome::Replayed
                      );
                  }
                  assert_eq!(
                      d.spent("acme"),
                      Some(100),
                      "billed once, replayed four times"
                  );
                  let trail: Vec<_> = d.audit_of("acme");
                  assert_eq!(trail.len(), 5);
                  assert_eq!(trail[0].outcome, Outcome::Forwarded);
                  assert!(trail[1..].iter().all(|r| r.outcome.is_replayed()));
                  assert!(trail[1..].iter().all(|r| r.cost == 0));
              }
          ''')

          mcp = 'crates/ccos-enterprise-mcp/src/server.rs'
          replace_once(mcp,
          '''    /// Admitted, executed, and the backend failed. The distinction matters: a
              /// governance refusal and a backend fault are different incidents, and
              /// collapsing them hides one behind the other.
              BackendError(String),
              /// Refused by the admission path. Never reached the backend.
              Refused(Refusal),
          ''',
          '''    /// Admitted, executed, and the backend failed. The distinction matters: a
              /// governance refusal and a backend fault are different incidents, and
              /// collapsing them hides one behind the other.
              BackendError(String),
              /// The request_id was already forwarded earlier. The backend is deliberately
              /// not called again; callers can correlate this acknowledgement to the
              /// original request without duplicating its effect.
              Replayed,
              /// Refused by the admission path. Never reached the backend.
              Refused(Refusal),
          ''')

          replace_once(mcp,
          '''        let outcome = self.deployment.admit(call);
                  if let Outcome::Refused(r) = outcome {
                      return McpOutcome::Refused(r);
                  }

                  let Some(core_tool) = to_core(&tool) else {
          ''',
          '''        match self.deployment.admit(call) {
                      Outcome::Refused(r) => return McpOutcome::Refused(r),
                      Outcome::Replayed => return McpOutcome::Replayed,
                      Outcome::Forwarded => {}
                  }

                  let Some(core_tool) = to_core(&tool) else {
          ''')

          marker = '''    /// The property the whole crate exists for: nothing reaches Core unless
              /// the admission path said yes. Every gate is exercised, and after all of
              /// them the recorder is still empty.
          '''
          test = '''    #[test]
              fn a_replayed_call_never_dispatches_the_backend_twice() {
                  let mut mcp = front_door();
                  let a = actor("memorithm", "alice", AuthStrength::Token);
                  let req = request("acme", "alice", "memory.ingest", "r-idempotent");

                  let first = mcp.call(
                      Call {
                          actor: &a,
                          request: &req,
                          model: "claude-opus",
                          cost_tokens: 10,
                          variant: None,
                          justification: None,
                      },
                      &json!({}),
                  );
                  assert!(matches!(first, McpOutcome::Ok(_)), "{first:?}");

                  let replay = mcp.call(
                      Call {
                          actor: &a,
                          request: &req,
                          model: "claude-opus",
                          cost_tokens: 10,
                          variant: None,
                          justification: None,
                      },
                      &json!({}),
                  );
                  assert_eq!(replay, McpOutcome::Replayed);
                  assert_eq!(
                      mcp.backend().calls,
                      vec![("acme".to_string(), "ingest".to_string())],
                      "a replay must not duplicate the backend effect"
                  );
                  assert_eq!(mcp.deployment().spent("acme"), Some(10));
              }

          '''
          replace_once(mcp, marker, test + marker)

          conformance = 'tests/ccos-enterprise-conformance/tests/governed_path.rs'
          marker = '''/// The load-bearing accounting rule: the budget is charged last, so a call
          '''
          test = '''#[test]
          fn replay_is_an_explicit_zero_cost_non_execution_outcome() {
              let mut d = two_tenant_deployment();
              let alice = actor("memorithm", "alice", AuthStrength::Token);
              let req = request("acme", "alice", "memory.recall", "r-replay");

              let call = || Call {
                  actor: &alice,
                  request: &req,
                  model: "claude-opus",
                  cost_tokens: 120,
                  variant: None,
                  justification: None,
              };
              assert_eq!(d.admit(call()), Outcome::Forwarded);
              assert_eq!(d.admit(call()), Outcome::Replayed);
              assert_eq!(d.spent("acme"), Some(120));

              let trail = d.audit_of("acme");
              assert_eq!(trail.len(), 2);
              assert_eq!(trail[0].outcome, Outcome::Forwarded);
              assert_eq!(trail[1].outcome, Outcome::Replayed);
              assert_eq!(trail[1].cost, 0);
          }

          '''
          replace_once(conformance, marker, test + marker)
          PY
          cargo fmt --all
          git diff --quiet -- crates/ccos-enterprise-runtime/src/lib.rs crates/ccos-enterprise-mcp/src/server.rs tests/ccos-enterprise-conformance/tests/governed_path.rs && exit 0
          git config user.name 'ZEKRITI Tarek'
          git config user.email 'contact@checkupauto.fr'
          git add crates/ccos-enterprise-runtime/src/lib.rs crates/ccos-enterprise-mcp/src/server.rs tests/ccos-enterprise-conformance/tests/governed_path.rs
          git commit -m 'fix(runtime): prevent backend re-execution on replay'
          git push origin HEAD:fix/runtime-true-idempotent-replay

  conformance:
    name: Core dependency conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exactly one Core in the tree (never a copy)
        run: |
          test "$(cargo metadata --no-deps --format-version 1 \
                  | python3 -c 'import json,sys; print(sum(1 for p in json.load(sys.stdin)["packages"] if p["name"]=="ccos-core"))')" = 1
          ! find crates tools -name '*.rs' | xargs grep -l 'pub fn qbelief' | grep -v target
          echo "one Core, referenced not duplicated"
      - name: "Enterprise boundary (§4.2): no Research-Lab in the product graph"
        run: |
          for p in $(cargo metadata --no-deps --format-version 1 \
                     | python3 -c 'import json,sys; [print(p["name"]) for p in json.load(sys.stdin)["packages"] if p["name"].startswith("ccos-enterprise")]'); do
            cargo tree -p "$p" --edges normal --prefix none 2>/dev/null \
              | grep -qiE 'research-lab|ccos-forge|ccos-rsi' \
              && { echo "BOUNDARY VIOLATION: $p reaches a forbidden crate"; exit 1; }
          done
          echo "no Enterprise crate reaches Research-Lab, Forge or RSI"

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features
