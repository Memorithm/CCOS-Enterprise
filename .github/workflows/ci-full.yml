name: Replay persistence verifier

on:
  push:
    branches: [fix/runtime-true-idempotent-replay]
  pull_request:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-true-idempotent-replay
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Update persisted replay expectation and execute it
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ccos-enterprise-store/src/lib.rs')
          s = p.read_text()
          marker = 'fn a_replayed_request_id_is_still_suppressed_after_a_restart() {'
          start = s.index(marker)
          end = s.index('\n    #[test]', start + len(marker)) if '\n    #[test]' in s[start + len(marker):] else len(s)
          block = s[start:end]
          old = '            Outcome::Forwarded\n'
          if block.count(old) != 1:
              raise SystemExit(f'expected one stale restore replay expectation, found {block.count(old)}')
          block = block.replace(old, '            Outcome::Replayed\n', 1)
          old_msg = '            "the retry after a restart must not be billed twice"\n'
          new_msg = '            "the retry after a restart is an explicit replay and must not be billed twice"\n'
          if block.count(old_msg) != 1:
              raise SystemExit(f'expected one stale restore replay message, found {block.count(old_msg)}')
          block = block.replace(old_msg, new_msg, 1)
          p.write_text(s[:start] + block + s[end:])
          PY
          cargo fmt --all
          cargo test -p ccos-enterprise-store a_replayed_request_id_is_still_suppressed_after_a_restart --release -- --exact
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add crates/ccos-enterprise-store/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m 'test(store): expect explicit replay after restart'
          git push origin HEAD:fix/runtime-true-idempotent-replay
