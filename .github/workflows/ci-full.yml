name: CI (full)

on:
  push:
    branches: [fix/runtime-true-idempotent-replay]
  pull_request:

permissions:
  contents: read

jobs:
  tenant_dispatch_fix:
    name: repair tenant dispatch replay collision
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-true-idempotent-replay
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Make routing test request ids unique and execute it
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ccos-enterprise-mcp/src/server.rs')
          s = p.read_text()
          old = '''        for tenant in ["acme", "globex", "acme"] {
              let req = request(tenant, "alice", "memory.recall", &format!("r-{tenant}-x"));
              let _ = mcp.call(
          '''
          new = '''        for (index, tenant) in ["acme", "globex", "acme"].into_iter().enumerate() {
              let req = request(
                  tenant,
                  "alice",
                  "memory.recall",
                  &format!("r-{tenant}-{index}"),
              );
              let out = mcp.call(
          '''
          if s.count(old) != 1:
              raise SystemExit(f'expected one tenant dispatch loop, found {s.count(old)}')
          s = s.replace(old, new, 1)
          old_tail = '''                &json!({}),
              );
          }
          let tenants: Vec<&str> = mcp
          '''
          new_tail = '''                &json!({}),
              );
              assert!(matches!(out, McpOutcome::Ok(_)), "{tenant}: {out:?}");
          }
          let tenants: Vec<&str> = mcp
          '''
          start = s.index('    fn each_tenant_is_dispatched_under_its_own_name()')
          tail_pos = s.index(old_tail, start)
          s = s[:tail_pos] + s[tail_pos:].replace(old_tail, new_tail, 1)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test -p ccos-enterprise-mcp each_tenant_is_dispatched_under_its_own_name --release -- --exact
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add crates/ccos-enterprise-mcp/src/server.rs
          git diff --cached --quiet && exit 0
          git commit -m 'test(mcp): use unique ids in tenant routing guard'
          git push origin HEAD:fix/runtime-true-idempotent-replay
