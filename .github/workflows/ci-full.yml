name: CI (full)

on:
  push:
    branches: [main, fix/runtime-true-idempotent-replay]
  pull_request:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  contract:
    name: boundary + contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: gateway namespace contract (Hermes/OpenClaw surface)
        run: cargo test -p ccos-enterprise-gateway --release
      - name: Knowledge Plane P0 conformance
        run: |
          cargo test -p ccos-enterprise-knowledge-model -p ccos-enterprise-knowledge -p ccos-enterprise-knowledge-store --release
          cargo test -p ccos-knowledge-conformance --test p0 --release
      - name: Knowledge Plane P1 local ingestion
        run: |
          cargo test -p ccos-enterprise-ingest --release
          cargo test -p ccos-knowledge-conformance --test p1_local_ingest --release
      - name: Knowledge Plane P1 normalization
        run: |
          cargo test -p ccos-enterprise-normalize --release
          cargo test -p ccos-knowledge-conformance --test p1_normalize --release
      - name: Knowledge Plane P1 source-span parsing
        run: |
          cargo test -p ccos-enterprise-parse --release
          cargo test -p ccos-knowledge-conformance --test p1_parse --release
      - name: Knowledge Plane P2 structural extraction
        run: |
          cargo test -p ccos-enterprise-extract --release
          cargo test -p ccos-knowledge-conformance --test p2_extract --release
      - name: Knowledge Plane P2 exact-key resolution
        run: |
          cargo test -p ccos-enterprise-resolution --release
          cargo test -p ccos-knowledge-conformance --test p2_resolution --release
      - name: Knowledge Plane P3 canonical graph view
        run: |
          cargo test -p ccos-enterprise-kg --release
          cargo test -p ccos-knowledge-conformance --test p3_graph --release
      - name: Knowledge Plane P4 ontology validation
        run: |
          cargo test -p ccos-enterprise-ontology --release
          cargo test -p ccos-knowledge-conformance --test p4_ontology --release
      - name: Knowledge Plane P4 typed canonical promotion
        run: |
          cargo test -p ccos-enterprise-promotion --release
          cargo test -p ccos-knowledge-conformance --test p4_promotion --release
      - name: Knowledge Plane P4 reversible ontology migration
        run: |
          cargo test -p ccos-enterprise-ontology-migration --release
          cargo test -p ccos-knowledge-conformance --test p4_migration --release
      - name: Knowledge Plane P4 semantic interoperability
        run: |
          cargo test -p ccos-enterprise-semantic --release
          cargo test -p ccos-knowledge-conformance --test p4_semantic --release
      - name: Knowledge Plane P5 Decision Intelligence
        run: |
          cargo test -p ccos-enterprise-decision --release
          cargo test -p ccos-knowledge-conformance --test p5_decision --release
      - name: RBAC + tenancy + policy contracts
        run: cargo test -p ccos-enterprise-rbac -p ccos-enterprise-tenancy -p ccos-enterprise-policy --release
      - name: governance wire formats (claim, manifest, revocation)
        run: cargo test -p ccos-enterprise-governance --all-features --release
      - name: license server integration
        run: cargo test -p ccos-license-server --release
      - name: Hermes/OpenClaw tool-catalogue contract
        run: cargo test -p ccos-enterprise-conformance --test boundary_contract --release
      - name: governed request path (identity → tenancy → authz → policy → boundary → audit)
        run: cargo test -p ccos-enterprise-conformance --test governed_path --release
      - name: tenant isolation + cross-tenant leakage + concurrency
        run: cargo test -p ccos-enterprise-conformance --test isolation --release
      - name: adversarial (escalation, quota abuse, forged restore, admin trail)
        run: cargo test -p ccos-enterprise-conformance --test adversarial --release

  replay_cleanup:
    name: align replay contract text
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-true-idempotent-replay
          fetch-depth: 0
      - name: Patch stale replay assertions and docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {n}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'crates/ccos-enterprise-runtime/src/lib.rs',
              '''//! 8. **replay** — a `request_id` already decided returns its prior outcome
          //!    rather than being billed twice;
          ''',
              '''//! 8. **replay** — a `request_id` already forwarded yields explicit
          //!    [`Outcome::Replayed`], is journaled at zero cost, and no effect may
          //!    execute again;
          ''',
          )

          replace_once(
              'tests/ccos-enterprise-conformance/tests/governed_path.rs',
              '''    // 11. Replay suppression sits ahead of the budget: a request id already
              //     decided returns its prior outcome and is NOT charged again, even
              //     when the retry's cost could no longer be afforded.
          ''',
              '''    // 11. Replay suppression sits ahead of the budget: a request id already
              //     forwarded returns explicit `Replayed`, performs no second effect and is
              //     NOT charged again, even when the retry's cost could no longer be afforded.
          ''',
          )
          replace_once(
              'tests/ccos-enterprise-conformance/tests/governed_path.rs',
              '''    assert_eq!(
                  d.admit(call(600)),
                  Outcome::Forwarded,
                  "a decided request id replays its outcome"
              );
          ''',
              '''    assert_eq!(
                  d.admit(call(600)),
                  Outcome::Replayed,
                  "a decided request id is acknowledged without a second execution"
              );
          ''',
          )
          PY
          cargo fmt --all
          git diff --quiet -- crates/ccos-enterprise-runtime/src/lib.rs tests/ccos-enterprise-conformance/tests/governed_path.rs && exit 0
          git config user.name 'ZEKRITI Tarek'
          git config user.email 'contact@checkupauto.fr'
          git add crates/ccos-enterprise-runtime/src/lib.rs tests/ccos-enterprise-conformance/tests/governed_path.rs
          git commit -m 'test(runtime): align replay guard with non-execution semantics'
          git push origin HEAD:fix/runtime-true-idempotent-replay

  conformance:
    name: Core dependency conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exactly one Core in the tree (never a copy)
        run: |
          test "$(cargo metadata --no-deps --format-version 1 \
                  | python3 -c 'import json,sys; print(sum(1 for p in json.load(sys.stdin)["packages"] if p["name"]=="ccos-core"))')" = 1
          ! find crates tools -name '*.rs' | xargs grep -l 'pub fn qbelief' | grep -v target
          echo "one Core, referenced not duplicated"
      - name: "Enterprise boundary (§4.2): no Research-Lab in the product graph"
        run: |
          for p in $(cargo metadata --no-deps --format-version 1 \
                     | python3 -c 'import json,sys; [print(p["name"]) for p in json.load(sys.stdin)["packages"] if p["name"].startswith("ccos-enterprise")]'); do
            cargo tree -p "$p" --edges normal --prefix none 2>/dev/null \
              | grep -qiE 'research-lab|ccos-forge|ccos-rsi' \
              && { echo "BOUNDARY VIOLATION: $p reaches a forbidden crate"; exit 1; }
          done
          echo "no Enterprise crate reaches Research-Lab, Forge or RSI"

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features
