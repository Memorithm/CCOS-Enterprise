name: CI (nightly)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: [self-hosted, Linux, X64, memorithm-ci, dell-general, ci-light, trusted-main]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: full workspace tests
        run: cargo test --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features --release
      - name: author policy over full history
        run: scripts/check-author-policy.sh HEAD
      - name: docs build
        run: cargo doc --workspace --exclude ccos-core --exclude ccos-memory-runtime --no-deps --all-features
