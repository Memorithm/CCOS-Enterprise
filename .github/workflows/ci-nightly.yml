name: CI (nightly)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sibling CCOS-Core checkout (dev path dependency)
        uses: actions/checkout@v4
        with:
          repository: Memorithm/CCOS-Core
          path: .ccos-core-sibling
      - name: Link the sibling where ../CCOS-Core resolves
        run: ln -sfn "$GITHUB_WORKSPACE/.ccos-core-sibling" ../CCOS-Core
      - uses: dtolnay/rust-toolchain@stable
      - name: full workspace tests
        run: cargo test --workspace --all-features --release
      - name: author policy over full history
        run: scripts/check-author-policy.sh main
      - name: docs build
        run: cargo doc --workspace --no-deps --all-features
