name: Semantic extraction holdout contract
on:
  pull_request:
    paths:
      - 'scripts/check-semantic-extraction-holdout.py'
      - 'scripts/test-semantic-extraction-holdout.py'
      - 'scripts/score-semantic-extraction-holdout.py'
      - 'scripts/test-semantic-extraction-scoring.py'
      - 'scripts/score-semantic-entity-linking.py'
      - 'scripts/test-semantic-entity-linking.py'
      - '.github/workflows/ci-semantic-eval.yml'
permissions:
  contents: read
jobs:
  semantic-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-semantic-extraction-holdout.py
      - run: python3 scripts/test-semantic-extraction-scoring.py
      - run: python3 scripts/test-semantic-entity-linking.py
