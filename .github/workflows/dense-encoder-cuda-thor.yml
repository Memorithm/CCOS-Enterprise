name: Dense encoder CUDA parity (Thor, manual)

# Manual-only physical-GPU job for `ccos-dense-encoder --features gpu-cuda`.
# Not a required check: hosted CI stays CPU. Needs a self-hosted Jetson Thor
# runner with these labels registered for this repository, plus the model
# directories pre-provisioned on the runner (no network model fetch here).
on:
  workflow_dispatch:
    inputs:
      minilm_dir:
        description: "Runner-local all-MiniLM-L6-v2 dir (CCOS_DENSE_MODEL_DIR)"
        required: true
        default: "/opt/ccos/models/all-MiniLM-L6-v2"
      multi_dir:
        description: "Optional runner-local paraphrase-multilingual-MiniLM-L12-v2 dir"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: thor-gpu-dense-encoder
  cancel-in-progress: false

jobs:
  cuda-parity:
    name: CUDA encoder parity (Jetson Thor)
    runs-on: [self-hosted, Linux, ARM64, jetson-thor, internal]
    timeout-minutes: 60
    env:
      CCOS_ENCODER_BACKEND: cuda
      CCOS_DENSE_MODEL_DIR: ${{ inputs.minilm_dir }}
      # Same SciRust revision as crates/ccos-dense-encoder/Cargo.toml (scirust-cuda pin).
      SCIRUST_SHA: "9943fd881861e6e33a62319997536473e0ee6e1b"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned thor_gpu_guard.py
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/Memorithm/scirust/${SCIRUST_SHA}/scripts/thor_gpu_guard.py" \
            -o "$RUNNER_TEMP/thor_gpu_guard.py"
      - name: Report device
        shell: bash
        run: nvidia-smi --query-gpu=name,driver_version --format=csv,noheader || true
      - name: Build (gpu-cuda)
        run: cargo build --release --locked -p ccos-dense-encoder --features gpu-cuda --example cuda_parity --tests
      - name: CUDA oracle test + parity probe under GPU guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.multi_dir }}" ]]; then export CCOS_DENSE_MULTI_MODEL_DIR="${{ inputs.multi_dir }}"; fi
          python3 "$RUNNER_TEMP/thor_gpu_guard.py" -- bash -c '
            cargo test --release --locked -p ccos-dense-encoder --features gpu-cuda cuda_ -- --nocapture &&
            cargo run --release --locked -p ccos-dense-encoder --features gpu-cuda --example cuda_parity'
