name: Fix generation rustfmt once

on:
  push:
    branches: [feat/provider-generation-transaction-v2]
    paths: [.github/workflows/fix-generation-rustfmt-once.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - name: Apply exact workspace formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.89.0 fmt --all
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'crates/ccos-enterprise-octasoma/src/generation.rs'
          cargo +1.89.0 fmt --all -- --check
          git diff --exit-code -- Cargo.lock
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZEKRITI Tarek'
          git config user.email contact@checkupauto.fr
          git add crates/ccos-enterprise-octasoma/src/generation.rs
          git diff --cached --quiet && exit 1
          git commit -m 'style(memory): format generation retry path'
          git push origin HEAD:feat/provider-generation-transaction-v2
