name: Format strict BEIR qrels import

on:
  push:
    branches:
      - audit/strict-beir-qrels
    paths:
      - .github/workflows/format-strict-beir-qrels.yml

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/strict-beir-qrels
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Validate BEIR example tests
        run: cargo test -p ccos-core --example beir_eval
      - name: Validate BEIR example clippy
        run: cargo clippy -p ccos-core --example beir_eval -- -D warnings
      - name: Commit formatted source
        run: |
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add core/examples/beir_eval.rs
          git diff --cached --exit-code && exit 1 || true
          git commit -m "style(eval): format strict BEIR qrels import"
          git push origin HEAD:audit/strict-beir-qrels
