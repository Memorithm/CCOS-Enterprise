name: forward-port memory governance

on:
  push:
    branches: [ fix/forward-port-memory-governance ]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/forward-port-memory-governance
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ccos-enterprise-memory/src/lib.rs')
          text = p.read_text()
          marker = '''pub use loadout_policy::{
              MemoryLoadoutBinding, MemoryLoadoutPlan, MemoryLoadoutPlanError, MemoryUsageMode,
              MAX_MEMORY_LOADOUT_BINDINGS,
          };
          '''
          addition = marker + '''
          mod recall_budget;
          pub use recall_budget::{
              BudgetedMemoryRecall, MemoryRecallBudget, MemoryRecallBudgetError, SemanticMemoryProviderExt,
              MAX_MEMORY_RECALL_ITEMS, MAX_MEMORY_RECALL_PAYLOAD_BYTES, MAX_MEMORY_RECALL_SHORTLIST,
          };

          mod trust;
          pub use trust::{MemoryTrustError, MemoryTrustMetadata, MemoryValidationState};
          '''
          assert marker in text
          assert 'mod recall_budget;' not in text
          assert 'mod trust;' not in text
          p.write_text(text.replace(marker, addition, 1))
          PY
          cargo fmt --all
      - name: Validate
        run: |
          cargo check -p ccos-enterprise-memory
          cargo clippy -p ccos-enterprise-memory -- -D warnings
          cargo test -p ccos-enterprise-memory
      - name: Commit
        shell: bash
        run: |
          git config user.name MEMOPERF
          git config user.email memoperf@users.noreply.github.com
          git add crates/ccos-enterprise-memory/src/lib.rs crates/ccos-enterprise-memory/src/recall_budget.rs crates/ccos-enterprise-memory/src/trust.rs
          git commit -m 'fix(memory): forward-port merged governance slices'
          git fetch origin fix/forward-port-memory-governance
          git rebase origin/fix/forward-port-memory-governance
          git push origin HEAD:fix/forward-port-memory-governance
