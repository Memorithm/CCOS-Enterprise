name: memory contract lock repair

on:
  push:
    branches: [feat/memory-contract]

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-contract
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate lockfile from manifests
        run: cargo generate-lockfile
      - name: Commit repaired lockfile
        run: |
          git diff --exit-code -- Cargo.lock && exit 0
          git config user.name 'MEMOPERF'
          git config user.email 'memoperf@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore(memory): synchronize workspace lockfile'
          git push origin HEAD:feat/memory-contract
