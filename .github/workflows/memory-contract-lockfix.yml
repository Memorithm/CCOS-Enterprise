name: memory contract lock repair

# Temporary branch-only workflow used to synchronize Cargo.lock minimally.
on:
  push:
    branches: [feat/memory-contract]

permissions:
  contents: write

jobs:
  minimize-lock:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-contract
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Rebuild lock from base without dependency upgrades
        run: |
          git show origin/main:Cargo.lock > Cargo.lock
          cargo metadata --format-version 1 >/dev/null
      - name: Commit minimal lockfile
        run: |
          git config user.name 'MEMOPERF'
          git config user.email 'memoperf@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore(memory): minimize workspace lock update'
          git push origin HEAD:feat/memory-contract
