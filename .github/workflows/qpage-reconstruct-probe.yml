name: QPage reconstruction probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qpage-reconstruct-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Three-way reconstruct historical Q-Page product diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CCOS CI Probe'
          git config user.email 'noreply@github.com'
          git fetch origin 27cb6663c6b25841603e916c83c821c149e94dc8
          set +e
          git merge --no-commit --no-ff 27cb6663c6b25841603e916c83c821c149e94dc8
          rc=$?
          set -e
          echo "merge_rc=$rc"
          echo '--- STATUS ---'
          git status --short
          echo '--- CONFLICT FILES ---'
          git diff --name-only --diff-filter=U || true
          echo '--- RUNTIME CONFLICT MARKERS ---'
          if git diff --name-only --diff-filter=U | grep -qx 'crates/ccos-enterprise-runtime/src/lib.rs'; then
            grep -n -B12 -A24 -E '^(<<<<<<<|=======|>>>>>>>)' crates/ccos-enterprise-runtime/src/lib.rs || true
          fi
          echo '--- CARGO CONFLICT MARKERS ---'
          if git diff --name-only --diff-filter=U | grep -qx 'crates/ccos-enterprise-runtime/Cargo.toml'; then
            cat crates/ccos-enterprise-runtime/Cargo.toml
          fi
          exit "$rc"
