name: QPage reconstruction probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qpage-reconstruct-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/qpage-replacement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate and publish final Q-Page hardening
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d23ab26da837207e269b0379c1e1f890b2c9caa0"

          git show 92ac0d53af130d482e8bdd7af6c94bee909596ff:.github/workflows/qpage-final-probe.yml > /tmp/previous.yml
          python3 - <<'PY'
          from pathlib import Path

          text = Path('/tmp/previous.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n\n          cargo fmt --all\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          program = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          old = '''    let mut policy = ccos_enterprise_qpages::policy::VariantPolicy::default();
    policy.schema_version = 0;
    policy
'''
          new = '''    ccos_enterprise_qpages::policy::VariantPolicy {
        schema_version: 0,
        ..Default::default()
    }
'''
          if program.count(old) != 1:
              raise SystemExit(f'legacy initializer anchor count={program.count(old)}')
          Path('/tmp/qpage_patch.py').write_text(program.replace(old, new, 1))
          PY
          python3 /tmp/qpage_patch.py

          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features
          cargo clippy --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features -- -D warnings
          cargo test -p ccos-enterprise-qpages
          cargo test -p ccos-enterprise-runtime
          cargo test -p ccos-enterprise-conformance --test stress_endurance --release
          cargo test --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features --release

          git status --short
          test "$(git status --porcelain=v1 | wc -l)" -eq 3
          git add crates/ccos-enterprise-qpages/src/policy.rs \
                  crates/ccos-enterprise-runtime/src/lib.rs \
                  tests/ccos-enterprise-conformance/tests/stress_endurance.rs
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git commit -m 'fix(qpages): close final CI and approval policy gaps'
          git push origin HEAD:fix/qpage-replacement
