name: QPage reconstruction probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qpage-reconstruct-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Apply historical Q-Page transformation without delivery commands
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 27cb6663c6b25841603e916c83c821c149e94dc8
          mkdir -p .ci
          git show 27cb6663c6b25841603e916c83c821c149e94dc8:.ci/autonomous-patch.sh > .ci/autonomous-patch.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.ci/autonomous-patch.sh')
          s = p.read_text()
          # Historical validator typos: repair only malformed Python string labels;
          # this does not alter the intended product transformation.
          s = s.replace("\ndrop after policy')", "\n'drop after policy')")
          s = s.replace("\nadmission qpage policy')", "\n'admission qpage policy')")
          marker = "git config user.name 'MEMOPERF'"
          if marker not in s:
              raise SystemExit('delivery marker missing')
          s = s.split(marker, 1)[0]
          if 'git push ' in s or 'git commit ' in s:
              raise SystemExit('delivery command remained in executable validator')
          p.write_text(s)
          PY
          chmod +x .ci/autonomous-patch.sh
          .ci/autonomous-patch.sh
          test ! -e .ci/autonomous-patch.sh
          echo '--- PRODUCT DIFF ---'
          git status --short
          if git status --short | grep -E '(^| )\.ci/|(^| )\.github/workflows/'; then
            echo 'temporary validator artifact leaked into product diff' >&2
            exit 1
          fi
