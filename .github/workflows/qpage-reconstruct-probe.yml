name: QPage reconstruction probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qpage-reconstruct-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/qpage-replacement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate and publish final Q-Page hardening
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d23ab26da837207e269b0379c1e1f890b2c9caa0"
          git show 92ac0d53af130d482e8bdd7af6c94bee909596ff:.github/workflows/qpage-final-probe.yml > /tmp/previous.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/previous.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n\n          cargo fmt --all\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          program = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/qpage_patch.py').write_text(program)
          PY
          python3 /tmp/qpage_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ccos-enterprise-runtime/src/lib.rs')
          s = p.read_text()
          old = "    let mut policy = ccos_enterprise_qpages::policy::VariantPolicy::default();\n    policy.schema_version = 0;\n    policy\n"
          new = "    ccos_enterprise_qpages::policy::VariantPolicy {\n        schema_version: 0,\n        ..Default::default()\n    }\n"
          if s.count(old) != 1:
              raise SystemExit(f'generated legacy initializer anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/ccos-enterprise-conformance/tests/stress_concurrency_chaos.rs')
          s = p.read_text()
          old1 = "        let mut st = TenantState::new(limit);\n        st.allow_model(BASE_MODEL)\n            .activate(AdvancedQPageVariant::Hierarchical);\n        // Every tenant is owned by `HOME_ORG`; nothing in the storm can move\n        // one, so the org gate's input is fixed before any thread starts.\n        assert!(\n            d.add_tenant(HOME_ORG, name, st),\n            \"{name} is provisioned exactly once\"\n        );\n"
          new1 = "        let mut st = TenantState::new(limit);\n        st.allow_model(BASE_MODEL);\n        // Every tenant is owned by `HOME_ORG`; nothing in the storm can move\n        // one, so the org gate's input is fixed before any thread starts.\n        assert!(\n            d.add_tenant(HOME_ORG, name, st),\n            \"{name} is provisioned exactly once\"\n        );\n        {\n            let mut rules = d.tenant_mut(name).expect(\"tenant was just provisioned\");\n            assert!(rules.permit_variant(AdvancedQPageVariant::Hierarchical));\n        }\n        d.activate_variant_governed(\n            &TenantId(name.to_string()),\n            AdvancedQPageVariant::Hierarchical,\n            None,\n            0,\n        )\n        .expect(\"permitted non-approval Q-Page activation\");\n"
          if s.count(old1) != 1:
              raise SystemExit(f'storm fixture activation anchor count={s.count(old1)}')
          s = s.replace(old1, new1, 1)
          old2 = "            Op::Activate { tenant, variant } => {\n                let mut d = guard(deployment);\n                let rules = d.tenant_mut(tenant);\n                match rules {\n                    Some(mut st) => {\n                        st.activate(*variant);\n                    }\n                    None => report.problems.push(format!(\"tenant {tenant} vanished\")),\n                }\n            }\n"
          new2 = "            Op::Activate { tenant, variant } => {\n                let mut d = guard(deployment);\n                let rules = d.tenant_mut(tenant);\n                let present = match rules {\n                    Some(mut rules) => {\n                        rules.permit_variant(*variant);\n                        true\n                    }\n                    None => false,\n                };\n                if present {\n                    if let Err(err) = d.activate_variant_governed(\n                        &TenantId(tenant.to_string()),\n                        *variant,\n                        None,\n                        0,\n                    ) {\n                        report.problems.push(format!(\n                            \"tenant {tenant} governed activation of {variant:?} failed: {err:?}\"\n                        ));\n                    }\n                } else {\n                    report.problems.push(format!(\"tenant {tenant} vanished\"));\n                }\n            }\n"
          if s.count(old2) != 1:
              raise SystemExit(f'chaos activation anchor count={s.count(old2)}')
          p.write_text(s.replace(old2, new2, 1))
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features
          cargo clippy --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features -- -D warnings
          cargo test -p ccos-enterprise-qpages
          cargo test -p ccos-enterprise-runtime --features test-fixtures
          cargo test -p ccos-enterprise-conformance --test stress_endurance --release
          cargo test -p ccos-enterprise-conformance --test stress_concurrency_chaos --release
          cargo test --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features --release
          git status --short
          test "$(git status --porcelain=v1 | wc -l)" -eq 4
          git add crates/ccos-enterprise-qpages/src/policy.rs crates/ccos-enterprise-runtime/src/lib.rs tests/ccos-enterprise-conformance/tests/stress_endurance.rs tests/ccos-enterprise-conformance/tests/stress_concurrency_chaos.rs
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git commit -m 'fix(qpages): close final CI and approval policy gaps'
          git push origin HEAD:fix/qpage-replacement
