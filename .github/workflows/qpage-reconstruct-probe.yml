name: QPage reconstruction probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qpage-reconstruct-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Reconstruct historical Q-Page product diff on current main
        id: reconstruct
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/qpage-probe.log) 2>&1
          git fetch origin 5caf265945d4d6f9667878796deecd8273e45390 27cb6663c6b25841603e916c83c821c149e94dc8
          git diff --binary 5caf265945d4d6f9667878796deecd8273e45390 27cb6663c6b25841603e916c83c821c149e94dc8 -- \
            crates/ccos-enterprise-qpages/src/lib.rs \
            crates/ccos-enterprise-qpages/src/policy.rs \
            crates/ccos-enterprise-runtime/Cargo.toml \
            crates/ccos-enterprise-runtime/src/lib.rs \
            > /tmp/qpage-product.patch
          set +e
          git apply --3way /tmp/qpage-product.patch
          apply_rc=$?
          set -e
          if [ "$apply_rc" -ne 0 ]; then
            cp crates/ccos-enterprise-runtime/Cargo.toml /tmp/qpage-conflict-Cargo.toml || true
            cp crates/ccos-enterprise-runtime/src/lib.rs /tmp/qpage-conflict-lib.rs || true
            python3 - <<'PY'
          from pathlib import Path
          def one(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {text.count(old)}')
              return text.replace(old, new, 1)
          cargo = Path('crates/ccos-enterprise-runtime/Cargo.toml')
          c = cargo.read_text()
          c = one(c, "<<<<<<< ours\nserde_json.workspace = true\n=======\n>>>>>>> theirs\nsha2.workspace = true\n", "serde_json.workspace = true\nsha2.workspace = true\n", 'Cargo dependencies')
          cargo.write_text(c)
          p = Path('crates/ccos-enterprise-runtime/src/lib.rs')
          s = p.read_text()
          s = one(s, "<<<<<<< ours\n    active_model: Option<String>,\n}\n\n#[derive(Clone)]\npub(crate) struct ModelSwitchCheckpoint {\n    state: TenantState,\n    cells: Option<BTreeMap<String, String>>,\n=======\n    /// The per-tenant variant activation policy: which advanced variants may\n    /// be activated, and whether the experimental bridge demands approval.\n    variant_policy: ccos_enterprise_qpages::policy::VariantPolicy,\n>>>>>>> theirs\n}\n", "    active_model: Option<String>,\n    /// The per-tenant variant activation policy: which advanced variants may\n    /// be activated, and whether the experimental bridge demands approval.\n    variant_policy: ccos_enterprise_qpages::policy::VariantPolicy,\n}\n\n#[derive(Clone)]\npub(crate) struct ModelSwitchCheckpoint {\n    state: TenantState,\n    cells: Option<BTreeMap<String, String>>,\n}\n", 'TenantState fields')
          s = one(s, "<<<<<<< ours\n            active_model: None,\n=======\n            variant_policy: ccos_enterprise_qpages::policy::VariantPolicy::default(),\n>>>>>>> theirs\n", "            active_model: None,\n            variant_policy: ccos_enterprise_qpages::policy::VariantPolicy::default(),\n", 'TenantState init')
          s = one(s, "<<<<<<< ours\n    #[serde(default)]\n    pub active_model: Option<String>,\n=======\n    /// The variant activation policy. Empty by default so older snapshots\n    /// load; a policy with an unsupported schema is refused on restore.\n    #[serde(default)]\n    pub variant_policy: ccos_enterprise_qpages::policy::VariantPolicy,\n>>>>>>> theirs\n", "    #[serde(default)]\n    pub active_model: Option<String>,\n    /// The variant activation policy. Empty by default so older snapshots\n    /// load; a policy with an unsupported schema is refused on restore.\n    #[serde(default)]\n    pub variant_policy: ccos_enterprise_qpages::policy::VariantPolicy,\n", 'snapshot fields')
          s = one(s, "<<<<<<< ours\n    /// The selected model is missing, ambiguous, or not in the tenant's\n    /// allowlist. Restore refuses rather than guessing a provider.\n    ActiveModelInvalid {\n        tenant: String,\n        active_model: Option<String>,\n    },\n=======\n    /// A tenant's variant activation policy has an unsupported schema.\n    /// Refused: a policy the build cannot interpret must not be carried\n    /// silently.\n    VariantPolicyCorrupt { tenant: String, detail: String },\n>>>>>>> theirs\n", "    /// The selected model is missing, ambiguous, or not in the tenant's\n    /// allowlist. Restore refuses rather than guessing a provider.\n    ActiveModelInvalid {\n        tenant: String,\n        active_model: Option<String>,\n    },\n    /// A tenant's variant activation policy has an unsupported schema.\n    /// Refused: a policy the build cannot interpret must not be carried\n    /// silently.\n    VariantPolicyCorrupt { tenant: String, detail: String },\n", 'restore errors')
          s = one(s, "<<<<<<< ours\n            Self::ActiveModelInvalid {\n                tenant,\n                active_model,\n            } => write!(\n                f,\n                \"tenant {tenant:?} has invalid or ambiguous active model {active_model:?}\"\n            ),\n=======\n            Self::VariantPolicyCorrupt { tenant, detail } => {\n                write!(f, \"tenant {tenant:?} variant policy is corrupt: {detail}\")\n            }\n>>>>>>> theirs\n", "            Self::ActiveModelInvalid {\n                tenant,\n                active_model,\n            } => write!(\n                f,\n                \"tenant {tenant:?} has invalid or ambiguous active model {active_model:?}\"\n            ),\n            Self::VariantPolicyCorrupt { tenant, detail } => {\n                write!(f, \"tenant {tenant:?} variant policy is corrupt: {detail}\")\n            }\n", 'restore display')
          s = one(s, "<<<<<<< ours\n                            active_model: state.active_model.clone(),\n=======\n                            variant_policy: state.variant_policy.clone(),\n>>>>>>> theirs\n", "                            active_model: state.active_model.clone(),\n                            variant_policy: state.variant_policy.clone(),\n", 'snapshot write')
          s = one(s, "<<<<<<< ours\n                    active_model,\n=======\n                    variant_policy: t.variant_policy,\n>>>>>>> theirs\n", "                    active_model,\n                    variant_policy: t.variant_policy,\n", 'restore state')
          s = one(s, ".activate(AdvancedQPageVariant::Hierarchical);", ".activate_raw(AdvancedQPageVariant::Hierarchical);", 'internal provisioning activation')
          if '<<<<<<<' in s or '>>>>>>>' in s or '\n=======\n' in s:
              raise SystemExit('unresolved runtime conflict')
          p.write_text(s)
          PY
            git add crates/ccos-enterprise-runtime/Cargo.toml crates/ccos-enterprise-runtime/src/lib.rs
          fi
          mkdir -p .ci
          git show 27cb6663c6b25841603e916c83c821c149e94dc8:.ci/autonomous-patch.sh > .ci/autonomous-patch.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.ci/autonomous-patch.sh')
          s = p.read_text()
          for label in ('drop after policy', 'admission qpage policy', 'snapshot activation approvals', 'snapshot write approvals'):
              s = s.replace(f"\n{label}')", f"\n'{label}')")
          current = "if let Some(variant) = call.variant {\\n            if !state.qpages.is_active(variant) {"
          historical = "if let Some(v) = call.variant {\\n            if !state.qpages.is_active(v) {"
          if s.count(historical) < 1:
              raise SystemExit('historical admission anchor missing from hardening script')
          s = s.replace(historical, current, 1)
          snap_old = "qpages: state.qpages.clone(),\\n                            variant_policy: state.variant_policy.clone(),\\n''',"
          snap_old_current = "qpages: state.qpages.clone(),\\n                            active_model: state.active_model.clone(),\\n                            variant_policy: state.variant_policy.clone(),\\n''',"
          snap_new = "qpages: state.qpages.clone(),\\n                            variant_policy: state.variant_policy.clone(),\\n                            variant_approvals: state.variant_approvals.clone(),\\n''',"
          snap_new_current = "qpages: state.qpages.clone(),\\n                            active_model: state.active_model.clone(),\\n                            variant_policy: state.variant_policy.clone(),\\n                            variant_approvals: state.variant_approvals.clone(),\\n''',"
          if s.count(snap_old) != 1 or s.count(snap_new) != 1:
              raise SystemExit('historical snapshot anchors missing')
          s = s.replace(snap_old, snap_old_current, 1).replace(snap_new, snap_new_current, 1)
          restore_old = "qpages: t.qpages,\\n                    variant_policy: t.variant_policy,\\n                },\\n            );\\n'''"
          restore_old_current = "qpages: t.qpages,\\n                    active_model,\\n                    variant_policy: t.variant_policy,\\n                },\\n            );\\n'''"
          restore_new = "qpages: t.qpages,\\n                    variant_policy: t.variant_policy,\\n                    variant_approvals: t.variant_approvals,\\n                },\\n            );\\n'''"
          restore_new_current = "qpages: t.qpages,\\n                    active_model,\\n                    variant_policy: t.variant_policy,\\n                    variant_approvals: t.variant_approvals,\\n                },\\n            );\\n'''"
          if s.count(restore_old) != 1 or s.count(restore_new) != 1:
              raise SystemExit('historical restore anchors missing')
          s = s.replace(restore_old, restore_old_current, 1).replace(restore_new, restore_new_current, 1)
          old_test_name = 'fn variant_policy_is_durable_and_governs_activation()'
          actual_test_name = 'fn variant_activation_goes_through_the_policy_gate()'
          if s.count(old_test_name) != 1:
              raise SystemExit('historical qpage test marker missing')
          s = s.replace(old_test_name, actual_test_name, 1)
          s = s.replace('let mut rules = self', 'let rules = self')
          old_clippy = 'cargo clippy -p ccos-enterprise-runtime --all-targets -- -D warnings'
          new_clippy = 'cargo clippy -p ccos-enterprise-runtime --all-targets --features test-fixtures -- -D warnings'
          if s.count(old_clippy) != 1:
              raise SystemExit('historical clippy command missing')
          s = s.replace(old_clippy, new_clippy, 1)
          old_test = 'cargo test -p ccos-enterprise-runtime'
          new_test = 'cargo test -p ccos-enterprise-runtime --features test-fixtures'
          if s.count(old_test) != 1:
              raise SystemExit('historical test command missing')
          s = s.replace(old_test, new_test, 1)
          marker = "git config user.name 'MEMOPERF'"
          if marker not in s:
              raise SystemExit('delivery marker missing')
          s = s.split(marker, 1)[0]
          if 'git push ' in s or 'git commit ' in s:
              raise SystemExit('delivery command remained in executable validator')
          p.write_text(s)
          PY
          chmod +x .ci/autonomous-patch.sh
          bash -x .ci/autonomous-patch.sh
          rm -f .ci/autonomous-patch.sh
          rmdir .ci 2>/dev/null || true
          echo '--- PRODUCT DIFF ---'
          git status --short
          git diff --binary > /tmp/qpage-result.patch
          if git status --short | grep -E '(^| )\.ci/|(^| )\.github/workflows/'; then
            echo 'temporary validator artifact leaked into product diff' >&2
            exit 1
          fi
      - name: Upload Q-Page probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qpage-probe-diagnostics
          path: |
            /tmp/qpage-probe.log
            /tmp/qpage-product.patch
            /tmp/qpage-result.patch
            /tmp/qpage-conflict-Cargo.toml
            /tmp/qpage-conflict-lib.rs
          if-no-files-found: ignore
      - name: Preserve probe failure
        if: steps.reconstruct.outcome == 'failure'
        run: exit 1
