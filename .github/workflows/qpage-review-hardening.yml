name: QPage review hardening validator

on:
  pull_request:
    branches: [fix/qpage-replacement]
    paths:
      - '.github/workflows/qpage-review-hardening.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/qpage-replacement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply and validate remaining Q-Page P1/P2 runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ca2ac87d018a00eb1d293425f8bcc7234199bef9"
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('crates/ccos-enterprise-runtime/src/lib.rs')
          s = runtime.read_text()

          old = '''    pub fn evaluate(\n        &self,\n        query: &ccos_enterprise_approval::ApprovalQuery<'_>,\n    ) -> ccos_enterprise_approval::GateOutcome {\n        self.registry.evaluate(query)\n    }\n'''
          new = '''    pub fn evaluate(\n        &self,\n        query: &ccos_enterprise_approval::ApprovalQuery<'_>,\n    ) -> ccos_enterprise_approval::GateOutcome {\n        self.registry.evaluate(query)\n    }\n\n    /// Evaluate one exact persisted approval identity rather than accepting a\n    /// different live approval for the same tenant/action/artifact.\n    pub fn evaluate_id(\n        &self,\n        id: &str,\n        query: &ccos_enterprise_approval::ApprovalQuery<'_>,\n    ) -> ccos_enterprise_approval::GateOutcome {\n        use ccos_enterprise_approval::{ApprovalDecision, GateOutcome};\n        let Some(record) = self.registry.snapshot().approvals.get(id) else {\n            return GateOutcome::Denied;\n        };\n        if record.tenant != query.tenant.0 || record.action != query.action {\n            return GateOutcome::Denied;\n        }\n        if record.artifact_hash != query.artifact_hash {\n            return GateOutcome::ArtifactMismatch {\n                found: record.artifact_hash.clone(),\n            };\n        }\n        if !record.id.starts_with("approval-v2-") || record.decision != ApprovalDecision::Approved {\n            return GateOutcome::Denied;\n        }\n        if self.registry.is_revoked(id) {\n            return GateOutcome::Revoked;\n        }\n        if record.expires_at.is_some_and(|expiry| expiry <= query.now) {\n            return GateOutcome::Expired;\n        }\n        GateOutcome::Approved\n    }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'approval ledger anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''                if self.approvals.evaluate(&query)\n                    != ccos_enterprise_approval::GateOutcome::Approved\n                {\n'''
          new = '''                if self.approvals.evaluate_id(id, &query)\n                    != ccos_enterprise_approval::GateOutcome::Approved\n                {\n'''
          if s.count(old) != 1:
              raise SystemExit(f'activation exact-id anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''                        || self\n                            .approvals\n                            .evaluate(&ccos_enterprise_approval::ApprovalQuery {\n                                tenant: &tenant_id,\n                                action: "qpage.activate",\n                                artifact_hash: &artifact,\n                                now: now_unix(),\n                            })\n                            != ccos_enterprise_approval::GateOutcome::Approved\n'''
          new = '''                        || self\n                            .approvals\n                            .evaluate_id(\n                                id,\n                                &ccos_enterprise_approval::ApprovalQuery {\n                                    tenant: &tenant_id,\n                                    action: "qpage.activate",\n                                    artifact_hash: &artifact,\n                                    now: now_unix(),\n                                },\n                            )\n                            != ccos_enterprise_approval::GateOutcome::Approved\n'''
          if s.count(old) != 1:
              raise SystemExit(f'admission exact-id anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''    /// The variant activation policy. Empty by default so older snapshots\n    /// load; a policy with an unsupported schema is refused on restore.\n    #[serde(default)]\n    pub variant_policy: ccos_enterprise_qpages::policy::VariantPolicy,\n'''
          new = '''    /// The variant activation policy. Missing legacy v1 fields deserialize\n    /// to schema 0 as a migration sentinel; explicit current policies remain\n    /// schema-validated and fail closed.\n    #[serde(default = "legacy_variant_policy")]\n    pub variant_policy: ccos_enterprise_qpages::policy::VariantPolicy,\n'''
          if s.count(old) != 1:
              raise SystemExit(f'snapshot field anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          snapshot_anchor = '''pub struct TenantSnapshot {\n'''
          helper = '''fn legacy_variant_policy() -> ccos_enterprise_qpages::policy::VariantPolicy {\n    ccos_enterprise_qpages::policy::VariantPolicy {\n        schema_version: 0,\n        ..Default::default()\n    }\n}\n\n'''
          if s.count(snapshot_anchor) != 1:
              raise SystemExit(f'snapshot struct anchor count={s.count(snapshot_anchor)}')
          s = s.replace(snapshot_anchor, helper + snapshot_anchor, 1)

          old = '''            // The variant policy must be schema-valid, or the restore is\n            // refused: a policy with an unsupported schema is corrupt state.\n            t.variant_policy\n                .validate()\n                .map_err(|detail| RestoreError::VariantPolicyCorrupt {\n                    tenant: id.0.clone(),\n                    detail,\n                })?;\n            for variant in t.qpages.active() {\n                match t.variant_policy.evaluate(variant) {\n'''
          new = '''            // Older v1 snapshots had no variant_policy field. Serde marks\n            // only that absence with schema 0; migrate their already-active\n            // non-approval variants into an equivalent explicit policy. The\n            // experimental bridge remains fail-closed because legacy state\n            // cannot carry the exact approval identity now required.\n            let mut variant_policy = t.variant_policy.clone();\n            if variant_policy.schema_version == 0 {\n                for variant in t.qpages.active() {\n                    if variant == AdvancedQPageVariant::ExperimentalBridge {\n                        return Err(RestoreError::VariantPolicyCorrupt {\n                            tenant: id.0.clone(),\n                            detail: "legacy ExperimentalBridge activation has no exact approval evidence"\n                                .into(),\n                        });\n                    }\n                    variant_policy.permit(variant);\n                }\n                variant_policy.schema_version =\n                    ccos_enterprise_qpages::policy::VARIANT_POLICY_SCHEMA;\n            }\n            variant_policy\n                .validate()\n                .map_err(|detail| RestoreError::VariantPolicyCorrupt {\n                    tenant: id.0.clone(),\n                    detail,\n                })?;\n            for variant in t.qpages.active() {\n                match variant_policy.evaluate(variant) {\n'''
          if s.count(old) != 1:
              raise SystemExit(f'restore migration anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''                    variant_policy: t.variant_policy,\n                    variant_approvals: t.variant_approvals,\n'''
          new = '''                    variant_policy,\n                    variant_approvals: t.variant_approvals,\n'''
          if s.count(old) != 1:
              raise SystemExit(f'restore insertion anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          test_anchor = '''    #[test]\n    fn qpage_policy_changes_are_governance_visible_after_serving() {\n'''
          tests = r'''    #[test]
    fn legacy_snapshot_migrates_active_non_bridge_variant_policy() {
        let mut d = two_tenant_deployment();
        let tenant = TenantId("acme".into());
        d.tenants
            .get_mut(&tenant)
            .unwrap()
            .activate_raw(AdvancedQPageVariant::CausalChain);
        let mut value = serde_json::to_value(d.snapshot()).unwrap();
        value["tenants"]["acme"]
            .as_object_mut()
            .unwrap()
            .remove("variant_policy");
        let legacy: DeploymentSnapshot = serde_json::from_value(value).unwrap();
        let restored = Deployment::restore(legacy, &[], &[]).unwrap();
        assert!(restored.tenants[&tenant]
            .qpages
            .is_active(AdvancedQPageVariant::CausalChain));
        assert_eq!(
            restored.tenants[&tenant]
                .variant_policy
                .evaluate(AdvancedQPageVariant::CausalChain),
            ccos_enterprise_qpages::policy::ActivationDecision::Allowed
        );
    }

    #[test]
    fn legacy_snapshot_refuses_active_experimental_bridge_without_exact_approval() {
        let mut d = two_tenant_deployment();
        let tenant = TenantId("acme".into());
        d.tenants
            .get_mut(&tenant)
            .unwrap()
            .activate_raw(AdvancedQPageVariant::ExperimentalBridge);
        let mut value = serde_json::to_value(d.snapshot()).unwrap();
        value["tenants"]["acme"]
            .as_object_mut()
            .unwrap()
            .remove("variant_policy");
        let legacy: DeploymentSnapshot = serde_json::from_value(value).unwrap();
        assert!(matches!(
            Deployment::restore(legacy, &[], &[]),
            Err(RestoreError::VariantPolicyCorrupt { .. })
        ));
    }

    #[test]
    fn exact_persisted_bridge_approval_id_cannot_be_replaced_by_another_live_id() {
        let mut d = two_tenant_deployment();
        let tenant = TenantId("acme".into());
        d.tenant_mut("acme").unwrap().opt_in_experimental_bridge();
        let artifact = Deployment::qpage_activation_artifact_hash(
            &tenant,
            AdvancedQPageVariant::ExperimentalBridge,
        );
        let stale = ccos_enterprise_approval::ApprovalRequest::new(
            tenant.clone(),
            "qpage.activate",
            &artifact,
            "operator-one",
            ccos_enterprise_approval::ApprovalDecision::Approved,
            10,
            Some(20),
            "short lived bridge approval",
        )
        .unwrap();
        let stale_id = d.record_approval(stale).unwrap();
        let replacement = ccos_enterprise_approval::ApprovalRequest::new(
            tenant.clone(),
            "qpage.activate",
            &artifact,
            "operator-two",
            ccos_enterprise_approval::ApprovalDecision::Approved,
            11,
            None,
            "replacement bridge approval",
        )
        .unwrap();
        let _replacement_id = d.record_approval(replacement).unwrap();
        assert!(d
            .activate_variant_governed(
                &tenant,
                AdvancedQPageVariant::ExperimentalBridge,
                Some(&stale_id),
                30,
            )
            .is_err());
    }

'''
          if s.count(test_anchor) != 1:
              raise SystemExit(f'runtime test anchor count={s.count(test_anchor)}')
          s = s.replace(test_anchor, tests + test_anchor, 1)
          runtime.write_text(s)
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features
          cargo clippy --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features -- -D warnings
          cargo test -p ccos-enterprise-runtime --features test-fixtures
          cargo test --workspace --exclude ccos-core --exclude ccos-memory-runtime --all-features --release

          git status --short
          test "$(git status --porcelain=v1 | wc -l)" -eq 1
          git add crates/ccos-enterprise-runtime/src/lib.rs
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git commit -m 'fix(qpages): resolve approval and legacy policy findings'
          git push origin HEAD:fix/qpage-replacement
