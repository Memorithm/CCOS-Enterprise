name: Qualify accepted governed evidence once

on:
  push:
    branches: [feat/governed-evidence-write]
    paths: [.github/workflows/qualify-accepted-evidence-once.yml]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Ensure recovery rows are retained for generation advancement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/ccos-enterprise-octasoma/src/lib.rs')
          text = p.read_text()
          if 'pub mod accepted_write;\n' not in text:
              anchor = 'pub mod recovery;\n'
              if text.count(anchor) != 1:
                  raise SystemExit('octasoma module anchor changed')
              text = text.replace(anchor, anchor + 'pub mod accepted_write;\n', 1)
          p.write_text(text)

          p = Path('crates/ccos-enterprise-octasoma/src/recovery.rs')
          text = p.read_text()
          if '    records: Vec<RecoveryRecord>,\n' not in text:
              old = 'pub struct RecoveredGovernedMemory {\n    provider: EnterpriseOctaSoma,\n    authority: GovernedMemoryProjection,\n    canonical_governance: Vec<u8>,\n    digest: [u8; 32],\n}'
              new = 'pub struct RecoveredGovernedMemory {\n    provider: EnterpriseOctaSoma,\n    authority: GovernedMemoryProjection,\n    canonical_governance: Vec<u8>,\n    digest: [u8; 32],\n    records: Vec<RecoveryRecord>,\n}'
              if text.count(old) != 1:
                  raise SystemExit('recovered memory struct anchor changed')
              text = text.replace(old, new, 1)
          if 'pub(crate) fn source_records' not in text:
              anchor = '    pub fn stored_records(&self) -> usize {\n        self.provider.tenant_len(&self.authority.tenant)\n    }\n'
              addition = '\n    /// Exact validated source rows reconstructed from the immutable recovery image.\n    /// Kept crate-private so generation publication can derive a complete next input\n    /// population without exposing an arbitrary live-index export API.\n    pub(crate) fn source_records(&self) -> &[RecoveryRecord] {\n        &self.records\n    }\n'
              if text.count(anchor) != 1:
                  raise SystemExit('stored_records anchor changed')
              text = text.replace(anchor, anchor + addition, 1)
          if '        records,\n    })' not in text:
              old = '    Ok(RecoveredGovernedMemory {\n        provider,\n        authority: authority.clone(),\n        canonical_governance,\n        digest,\n    })'
              new = '    Ok(RecoveredGovernedMemory {\n        provider,\n        authority: authority.clone(),\n        canonical_governance,\n        digest,\n        records,\n    })'
              if text.count(old) != 1:
                  raise SystemExit('recovered construction anchor changed')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Format and qualify adapter primitive
        run: |
          set -euo pipefail
          cargo +1.89.0 fmt --all
          cargo +1.89.0 test -p ccos-enterprise-octasoma --test accepted_evidence_write --locked
          cargo +1.89.0 test -p ccos-enterprise-octasoma --locked
          cargo +1.89.0 clippy -p ccos-enterprise-octasoma --all-targets --locked -- -D warnings
          git diff --exit-code -- Cargo.lock
      - name: Commit product formatting only
        run: |
          set -euo pipefail
          git config user.name 'ZEKRITI Tarek'
          git config user.email contact@checkupauto.fr
          git add crates/ccos-enterprise-octasoma/src/lib.rs \
            crates/ccos-enterprise-octasoma/src/recovery.rs \
            crates/ccos-enterprise-octasoma/src/accepted_write.rs \
            crates/ccos-enterprise-octasoma/tests/accepted_evidence_write.rs
          if ! git diff --cached --quiet; then
            git commit -m 'test(memory): qualify accepted governed evidence generations'
            git push origin HEAD:feat/governed-evidence-write
          fi
