name: Qualify accepted governed evidence once

on:
  push:
    branches: [feat/governed-evidence-write]
    paths: [.github/workflows/qualify-accepted-evidence-once.yml]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Retain validated recovery source rows for generation advancement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/ccos-enterprise-octasoma/src/lib.rs')
          text = p.read_text()
          anchor = 'pub mod recovery;\n'
          addition = 'pub mod accepted_write;\n'
          if addition not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('octasoma module anchor changed')
              text = text.replace(anchor, anchor + addition, 1)
          p.write_text(text)

          p = Path('crates/ccos-enterprise-octasoma/src/recovery.rs')
          text = p.read_text()
          old = '''pub struct RecoveredGovernedMemory {
              provider: EnterpriseOctaSoma,
              authority: GovernedMemoryProjection,
              canonical_governance: Vec<u8>,
              digest: [u8; 32],
          }'''
          new = '''pub struct RecoveredGovernedMemory {
              provider: EnterpriseOctaSoma,
              authority: GovernedMemoryProjection,
              canonical_governance: Vec<u8>,
              digest: [u8; 32],
              records: Vec<RecoveryRecord>,
          }'''
          if text.count(old) != 1:
              raise SystemExit('recovered memory struct anchor changed')
          text = text.replace(old, new, 1)

          anchor = '''    pub fn stored_records(&self) -> usize {
              self.provider.tenant_len(&self.authority.tenant)
          }
          '''
          addition = '''
              /// Exact validated source rows reconstructed from the immutable recovery image.
              /// Kept crate-private so generation publication can derive a complete next input
              /// population without exposing an arbitrary live-index export API.
              pub(crate) fn source_records(&self) -> &[RecoveryRecord] {
                  &self.records
              }
          '''
          if 'pub(crate) fn source_records' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('stored_records anchor changed')
              text = text.replace(anchor, anchor + addition, 1)

          old = '''    Ok(RecoveredGovernedMemory {
              provider,
              authority: authority.clone(),
              canonical_governance,
              digest,
          })'''
          new = '''    Ok(RecoveredGovernedMemory {
              provider,
              authority: authority.clone(),
              canonical_governance,
              digest,
              records,
          })'''
          if text.count(old) != 1:
              raise SystemExit('recovered construction anchor changed')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Format and qualify adapter primitive
        run: |
          set -euo pipefail
          cargo +1.89.0 fmt --all
          cargo +1.89.0 test -p ccos-enterprise-octasoma --locked
          cargo +1.89.0 clippy -p ccos-enterprise-octasoma --all-targets --locked -- -D warnings
          git diff --exit-code -- Cargo.lock
      - name: Commit product changes only
        run: |
          set -euo pipefail
          git config user.name 'ZEKRITI Tarek'
          git config user.email contact@checkupauto.fr
          git add crates/ccos-enterprise-octasoma/src/lib.rs \
            crates/ccos-enterprise-octasoma/src/recovery.rs \
            crates/ccos-enterprise-octasoma/src/accepted_write.rs
          git diff --cached --quiet && exit 1
          git commit -m 'feat(memory): stage accepted governed evidence generations'
          git push origin HEAD:feat/governed-evidence-write
