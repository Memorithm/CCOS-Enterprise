name: Qualify governed provider generation v2 once

on:
  push:
    branches: [feat/provider-generation-transaction-v2]
    paths: [.github/workflows/qualify-generation-v2-once.yml]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Repair legacy digest fixture and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ccos-enterprise-octasoma/tests/generation_selector.rs')
          text = p.read_text()
          old_helper = '''fn hex(bytes: &[u8]) -> String {
              let digest = Sha256::digest(bytes);
              digest.iter().map(|byte| format!("{byte:02x}")).collect()
          }'''
          new_helper = '''fn raw_hex(bytes: &[u8]) -> String {
              bytes.iter().map(|byte| format!("{byte:02x}")).collect()
          }

          fn sha256_hex(bytes: &[u8]) -> String {
              raw_hex(&Sha256::digest(bytes))
          }'''
          if old_helper not in text:
              raise SystemExit('legacy digest helper anchor changed')
          text = text.replace(old_helper, new_helper, 1)
          old_image = '"image_sha256": image.digest().iter().map(|byte| format!("{byte:02x}")).collect::<String>(),'
          if old_image not in text:
              raise SystemExit('legacy image digest fixture anchor changed')
          text = text.replace(old_image, '"image_sha256": raw_hex(&image.digest()),', 1)
          old_governance = '"governance_sha256": hex(&governance_bytes),'
          if old_governance not in text:
              raise SystemExit('legacy governance digest fixture anchor changed')
          text = text.replace(old_governance, '"governance_sha256": sha256_hex(&governance_bytes),', 1)
          p.write_text(text)
          PY
          cargo +1.89.0 fmt --all
      - name: Qualify memory projection codec
        run: |
          set -euo pipefail
          cargo +1.89.0 test -p ccos-enterprise-memory --locked
          cargo +1.89.0 clippy -p ccos-enterprise-memory --all-targets --locked -- -D warnings
      - name: Qualify provider generation and recovery
        run: |
          set -euo pipefail
          cargo +1.89.0 test -p ccos-enterprise-octasoma --test generation_selector --locked
          cargo +1.89.0 test -p ccos-enterprise-octasoma recovery --locked
          cargo +1.89.0 clippy -p ccos-enterprise-octasoma --all-targets --locked -- -D warnings
      - name: Qualify served stdio composition
        run: |
          set -euo pipefail
          cargo +1.89.0 test -p ccos-enterprise-mcp --test governed_context_stdio --locked
          cargo +1.89.0 clippy -p ccos-enterprise-mcp --all-targets --locked -- -D warnings
          git diff --exit-code -- Cargo.lock
      - name: Commit product formatting and fixture repair
        run: |
          set -euo pipefail
          git config user.name 'ZEKRITI Tarek'
          git config user.email contact@checkupauto.fr
          git add crates/ccos-enterprise-memory/src/lib.rs \
            crates/ccos-enterprise-memory/src/projection.rs \
            crates/ccos-enterprise-memory/src/projection_codec.rs \
            crates/ccos-enterprise-octasoma/src/generation.rs \
            crates/ccos-enterprise-octasoma/tests/generation_selector.rs
          if ! git diff --cached --quiet; then
            git commit -m 'test(memory): qualify atomic provider generation v2'
            git push origin HEAD:feat/provider-generation-transaction-v2
          fi
