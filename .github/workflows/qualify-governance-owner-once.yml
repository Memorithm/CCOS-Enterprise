name: Qualify governed projection owner

on:
  push:
    branches: [feat/governed-projection-owner]
    paths: [.github/workflows/qualify-governance-owner-once.yml]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire the owner into the existing projection and context modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one insertion anchor')
              p.write_text(text.replace(old, new, 1))

          replace('crates/ccos-enterprise-memory/src/projection.rs',
              'use std::collections::{BTreeMap, BTreeSet};',
              '#[path = "projection_store.rs"]\nmod store;\npub use store::{GovernedMemoryStore, GovernedMemoryStoreError};\n\nuse std::collections::{BTreeMap, BTreeSet};')
          replace('crates/ccos-enterprise-memory/src/lib.rs',
              '    GovernedMemoryProjectionError, GOVERNED_MEMORY_PROJECTION_FILE,',
              '    GovernedMemoryProjectionError, GovernedMemoryStore, GovernedMemoryStoreError, GOVERNED_MEMORY_PROJECTION_FILE,')
          path = 'crates/ccos-enterprise-mcp/src/served_context.rs'
          replace(path,
              '    BudgetedMemoryRecall, GovernedMemoryContextAssembly, GovernedMemoryProjection,',
              '    BudgetedMemoryRecall, GovernedMemoryContextAssembly, GovernedMemoryProjection, GovernedMemoryStore, GovernedMemoryStoreError,')
          replace(path, '    Attestation(MemoryError),', '    Attestation(MemoryError),\n    Store(GovernedMemoryStoreError),')
          replace(path,
              '            Self::Loadout(error) => write!(f, "invalid governed memory loadout: {error}"),',
              '            Self::Store(error) => write!(f, "governed memory owner unavailable: {error}"),\n            Self::Loadout(error) => write!(f, "invalid governed memory loadout: {error}"),')
          function = '''impl From<GovernedMemoryStoreError> for ServedContextError {
              fn from(value: GovernedMemoryStoreError) -> Self {
                  Self::Store(value)
              }
          }

          /// Assemble from the acknowledged state of an exclusively owned projection.
          ///
          /// Check the admitted request tenant and owner health before any provider
          /// call. Borrowing the store also prevents replacement while this synchronous
          /// context assembly is in progress. This function does not authenticate,
          /// reserve quota or settle the request; the real handler must still enter
          /// through `Deployment::admit`. It does not reconstruct provider indexes.
          ///
          /// ```no_run
          /// # use ccos_enterprise_mcp::{assemble_stored_governed_context, ServedContextError};
          /// # use ccos_enterprise_memory::{GovernedMemoryStore, GovernedSemanticMemoryProvider,
          /// # GovernedRecallTrustPolicy, MemoryRecallBudget, MemoryContextBudget};
          /// # use ccos_enterprise_tenancy::TenantId;
          /// # fn example<P: GovernedSemanticMemoryProvider>(provider: &P, store: &GovernedMemoryStore, admitted_tenant: &TenantId) -> Result<(), ServedContextError> {
          /// let (context, evidence) = assemble_stored_governed_context(
          ///     provider, store, admitted_tenant, GovernedRecallTrustPolicy::VerifiedOnly,
          ///     &[1.0, 0.0], MemoryRecallBudget::new(8, 16, 4096).unwrap(),
          ///     MemoryContextBudget::new(4, 2048).unwrap(),
          /// )?;
          /// assert_eq!(context.len(), evidence.len());
          /// # Ok(()) }
          /// ```
          pub fn assemble_stored_governed_context<P: GovernedSemanticMemoryProvider + ?Sized>(
              provider: &P,
              store: &GovernedMemoryStore,
              expected_tenant: &TenantId,
              policy: GovernedRecallTrustPolicy,
              embedding: &[f32],
              recall_budget: MemoryRecallBudget,
              context_budget: MemoryContextBudget,
          ) -> Result<(GovernedMemoryContextAssembly, Vec<MemoryContextAttestation>), ServedContextError> {
              let projection = store.projection_for(expected_tenant)?;
              assemble_attested_served_context(provider, projection, policy, embedding, recall_budget, context_budget)
          }

          '''
          replace(path, '#[cfg(test)]\nmod tests {', function + '#[cfg(test)]\nmod tests {')
          replace('crates/ccos-enterprise-mcp/src/lib.rs',
              '    assemble_attested_served_context, assemble_served_governed_context, ServedContextError,',
              '    assemble_attested_served_context, assemble_served_governed_context, assemble_stored_governed_context, ServedContextError,')
          regression = '''    #[test]
              fn dropping_owner_releases_duplicated_lock_description() {
                  let dir = Directory::new();
                  let store = GovernedMemoryStore::initialize(&dir.0, fixture()).unwrap();
                  // A descriptor inherited during a concurrent fork shares this
                  // open-file description, even before the child closes it at exec.
                  let inherited = store._lock.try_clone().unwrap();
                  drop(store);
                  let reopened = GovernedMemoryStore::open(&dir.0, tenant()).unwrap();
                  drop(inherited);
                  assert!(matches!(GovernedMemoryStore::open(&dir.0, tenant()),
                      Err(GovernedMemoryStoreError::AlreadyOpen { .. })));
                  drop(reopened);
              }

          '''
          replace('crates/ccos-enterprise-memory/src/projection_store.rs',
              '    #[test]\n    fn second_owner_is_refused_across_replacements_and_released_on_drop()',
              regression + '    #[test]\n    fn second_owner_is_refused_across_replacements_and_released_on_drop()')
          PY
      - name: Prove duplicated descriptor delays the original implicit release
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.89.0 metadata --locked --format-version 1 >/dev/null
          if cargo +1.89.0 test -p ccos-enterprise-memory --locked --lib \
            projection::store::tests::dropping_owner_releases_duplicated_lock_description \
            -- --exact > "$RUNNER_TEMP/lock-lifetime-before.log" 2>&1; then
            cat "$RUNNER_TEMP/lock-lifetime-before.log"
            echo 'regression did not reproduce on the uncorrected owner' >&2
            exit 1
          else
            status=$?
            cat "$RUNNER_TEMP/lock-lifetime-before.log"
            test "$status" -eq 101
            grep -q 'AlreadyOpen' "$RUNNER_TEMP/lock-lifetime-before.log"
          fi
      - name: Explicitly release ownership before closing the lock descriptor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ccos-enterprise-memory/src/projection_store.rs')
          text = p.read_text()
          anchor = 'impl GovernedMemoryStore {'
          drop = '''impl Drop for GovernedMemoryStore {
              fn drop(&mut self) {
                  // Closing only this descriptor can leave the lock held by an
                  // inherited descriptor during another thread's fork/exec. The
                  // owner exposes no clones; release its lock explicitly first.
                  // Drop cannot report errors; descriptor closure is the fallback.
                  let _ = self._lock.unlock();
              }
          }

          '''
          assert text.count(anchor) == 1
          p.write_text(text.replace(anchor, drop + anchor, 1))
          PY
      - name: Format and qualify source plus process-level regressions
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +1.89.0 --edition 2021 crates/ccos-enterprise-memory/src/lib.rs \
            crates/ccos-enterprise-memory/src/projection.rs \
            crates/ccos-enterprise-memory/src/projection_store.rs \
            crates/ccos-enterprise-mcp/src/served_context.rs \
            crates/ccos-enterprise-mcp/src/lib.rs \
            crates/ccos-enterprise-mcp/tests/stored_context_lifecycle.rs
          cargo +1.89.0 test -p ccos-enterprise-memory --locked
          for attempt in $(seq 1 10); do
            cargo +1.89.0 test -p ccos-enterprise-memory --locked --lib projection::store::tests
          done
          cargo +1.89.0 test -p ccos-enterprise-mcp --test stored_context_lifecycle --locked
          cargo +1.89.0 test -p ccos-enterprise-mcp --doc --locked
          cargo +1.89.0 clippy -p ccos-enterprise-memory -p ccos-enterprise-mcp --all-targets --locked -- -D warnings
          git diff --exit-code -- Cargo.lock
      - name: Commit only the qualified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZEKRITI Tarek'
          git config user.email contact@checkupauto.fr
          git add crates/ccos-enterprise-memory/src/lib.rs \
            crates/ccos-enterprise-memory/src/projection.rs \
            crates/ccos-enterprise-memory/src/projection_store.rs \
            crates/ccos-enterprise-mcp/src/served_context.rs \
            crates/ccos-enterprise-mcp/src/lib.rs \
            crates/ccos-enterprise-mcp/tests/stored_context_lifecycle.rs
          git commit -m 'feat(memory): qualify exclusive projection ownership and explicit lock release'
          git push origin HEAD:feat/governed-projection-owner
