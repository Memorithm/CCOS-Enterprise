name: Qualify governed evidence write E2E once

on:
  push:
    branches: [feat/governed-evidence-write]
    paths: [.github/workflows/qualify-governed-evidence-e2e-once.yml]

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Format and run real stdio crash/restart scenarios
        run: |
          set -euo pipefail
          cargo +1.89.0 fmt --all
          cargo +1.89.0 test -p ccos-enterprise-mcp --test governed_evidence_stdio --locked -- --nocapture
          cargo +1.89.0 test -p ccos-enterprise-mcp --test governed_context_stdio --locked
          cargo +1.89.0 test -p ccos-enterprise-octasoma --test accepted_evidence_write --locked
          cargo +1.89.0 clippy -p ccos-enterprise-mcp -p ccos-enterprise-octasoma --all-targets --locked -- -D warnings
          git diff --exit-code -- Cargo.lock
      - name: Commit formatting only
        run: |
          set -euo pipefail
          git config user.name 'ZEKRITI Tarek'
          git config user.email contact@checkupauto.fr
          git add crates/ccos-enterprise-mcp/tests/governed_evidence_stdio.rs \
            crates/ccos-enterprise-mcp/src/governed_evidence_tool.rs \
            crates/ccos-enterprise-mcp/src/served_governed_write.rs \
            crates/ccos-enterprise-mcp/src/bin/ccos-enterprise-mcp-server.rs \
            crates/ccos-enterprise-mcp/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m 'test(mcp): format governed evidence crash lifecycle'
            git push origin HEAD:feat/governed-evidence-write
          fi
