name: Qualify governed provider reconstruction

on:
  push:
    branches: [feat/governed-provider-recovery]
    paths: [.github/workflows/qualify-provider-recovery-once.yml]

permissions:
  contents: write

concurrency:
  group: provider-recovery-qualification
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire recovery through existing projection and adapter boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one exact source anchor')
              p.write_text(text.replace(old, new, 1))
          path = 'crates/ccos-enterprise-memory/src/projection.rs'
          replace(path, 'use std::collections::{BTreeMap, BTreeSet};',
              '#[path = "projection_codec.rs"]\nmod codec;\npub use codec::encode_governed_memory_projection;\n\nuse std::collections::{BTreeMap, BTreeSet};')
          p = Path(path)
          text = p.read_text()
          start = text.index('    // Public projection fields can be changed after `new`; validate again before')
          end = text.index('    let root = if root.as_os_str().is_empty()', start)
          text = text[:start] + '    let bytes = encode_governed_memory_projection(projection)?;\n' + text[end:]
          p.write_text(text)
          replace('crates/ccos-enterprise-memory/src/lib.rs',
              '    load_governed_memory_projection, save_governed_memory_projection, GovernedMemoryProjection,',
              '    encode_governed_memory_projection, load_governed_memory_projection, save_governed_memory_projection, GovernedMemoryProjection,')
          replace('crates/ccos-enterprise-octasoma/src/lib.rs',
              '#![forbid(unsafe_code)]', '#![forbid(unsafe_code)]\n\npub mod recovery;')
          p = Path('crates/ccos-enterprise-octasoma/Cargo.toml')
          text = p.read_text()
          if 'serde.workspace' in text or 'sha2.workspace' in text:
              raise SystemExit('adapter dependency anchor changed')
          p.write_text(text.rstrip() + '\nserde.workspace = true\nserde_json.workspace = true\nsha2.workspace = true\n')
          PY
      - name: Resolve only the newly declared local dependency edges
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/recovery-lock-before.toml
          cargo +1.89.0 metadata --format-version 1 > /tmp/recovery-metadata.json
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          def packages(path):
              return {(p['name'], p['version'], p.get('source'), p.get('checksum')): p for p in tomllib.loads(Path(path).read_text())['package']}
          before = packages('/tmp/recovery-lock-before.toml')
          after = packages('Cargo.lock')
          assert before.keys() == after.keys(), 'external package identities changed'
          changed = [k for k in before if before[k] != after[k]]
          assert len(changed) == 1 and changed[0][0] == 'ccos-enterprise-octasoma' and changed[0][2] is None, changed
          old_deps = set(before[changed[0]]['dependencies'])
          new_deps = set(after[changed[0]]['dependencies'])
          assert new_deps - old_deps == {'serde', 'serde_json', 'sha2'}
          assert old_deps <= new_deps
          print('Only three adapter-local dependency edges added; no version/source/checksum change')
          PY
          cargo +1.89.0 metadata --locked --format-version 1 > /dev/null
      - name: Format and test actual provider replay plus filesystem recovery
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +1.89.0 --edition 2021 crates/ccos-enterprise-memory/src/lib.rs \
            crates/ccos-enterprise-memory/src/projection.rs \
            crates/ccos-enterprise-memory/src/projection_codec.rs \
            crates/ccos-enterprise-octasoma/src/lib.rs \
            crates/ccos-enterprise-octasoma/src/recovery.rs \
            crates/ccos-enterprise-octasoma/src/recovery_tests.rs
          cargo +1.89.0 test -p ccos-enterprise-memory --locked
          cargo +1.89.0 test -p ccos-enterprise-octasoma --locked
          cargo +1.89.0 test -p ccos-enterprise-mcp --test stored_context_lifecycle --locked
          cargo +1.89.0 clippy -p ccos-enterprise-memory -p ccos-enterprise-octasoma --all-targets --locked -- -D warnings
          cargo +1.89.0 fmt --all -- --check
          for run in 1 2 3; do
            cargo +1.89.0 test -p ccos-enterprise-octasoma --lib recovery::tests::fresh_process_reconstructs_actual_provider_from_the_durable_image --locked
          done
      - name: Commit only validated product sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZEKRITI Tarek'
          git config user.email contact@checkupauto.fr
          git add Cargo.lock crates/ccos-enterprise-memory/src/lib.rs \
            crates/ccos-enterprise-memory/src/projection.rs crates/ccos-enterprise-memory/src/projection_codec.rs \
            crates/ccos-enterprise-octasoma/Cargo.toml crates/ccos-enterprise-octasoma/src/lib.rs \
            crates/ccos-enterprise-octasoma/src/recovery.rs crates/ccos-enterprise-octasoma/src/recovery_tests.rs
          git diff --cached --quiet && exit 1
          git commit -m 'feat(memory): qualify bounded provider reconstruction against exact governance'
          git push origin HEAD:feat/governed-provider-recovery
