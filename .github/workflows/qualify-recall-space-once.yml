name: Qualify canonical-space correction

on:
  push:
    branches: [fix/canonical-recall-space]
    paths: [.github/workflows/qualify-recall-space-once.yml]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Qualify the two Rust files without changing other sources
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +1.89.0 --edition 2021 crates/ccos-enterprise-memory/src/governed_recall.rs crates/ccos-enterprise-mcp/tests/governed_space_boundary.rs
          cargo +1.89.0 test -p ccos-enterprise-mcp --test governed_space_boundary --locked
          cargo +1.89.0 test -p ccos-enterprise-memory --locked
          cargo +1.89.0 clippy -p ccos-enterprise-mcp --test governed_space_boundary --locked -- -D warnings
          git diff --check
      - name: Publish formatting after successful tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add crates/ccos-enterprise-memory/src/governed_recall.rs crates/ccos-enterprise-mcp/tests/governed_space_boundary.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(memory): format qualified canonical-space tests'
          git push origin HEAD:fix/canonical-recall-space
