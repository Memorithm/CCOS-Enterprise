name: Qualify served governed context

on:
  push:
    branches: [feat/served-governed-context]
    paths: [.github/workflows/qualify-served-context-once.yml]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire generation selection and Enterprise-local context tool
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != count:
                  raise SystemExit(f'{path}: expected {count} exact anchors for {old[:80]!r}, found {text.count(old)}')
              p.write_text(text.replace(old, new, count))

          # OctaSoma exposes the independently locked generation selector.
          replace(
              'crates/ccos-enterprise-octasoma/src/lib.rs',
              'pub mod recovery;\n',
              'pub mod generation;\npub mod recovery;\n',
          )

          # The MCP crate depends only on the governed Enterprise adapter, never raw OctaSoma.
          replace(
              'crates/ccos-enterprise-mcp/Cargo.toml',
              'ccos-enterprise-memory = { path = "../ccos-enterprise-memory" }\n',
              'ccos-enterprise-memory = { path = "../ccos-enterprise-memory" }\nccos-enterprise-octasoma = { path = "../ccos-enterprise-octasoma" }\n',
          )

          replace(
              'crates/ccos-enterprise-mcp/src/lib.rs',
              'pub mod decision;\npub mod served_context;\n',
              'pub mod decision;\npub mod governed_context_tool;\npub mod served_context;\n',
          )
          replace(
              'crates/ccos-enterprise-mcp/src/lib.rs',
              'pub use served_context::{\n',
              'pub use governed_context_tool::{\n    govern_governed_context, governed_context_tool_spec, GOVERNED_CONTEXT_PERMISSION,\n    GOVERNED_CONTEXT_TOOL,\n};\npub use served_context::{\n',
          )

          path = Path('crates/ccos-enterprise-mcp/src/bin/ccos-enterprise-mcp-server.rs')
          text = path.read_text()
          old = '''use ccos_enterprise_mcp::{
              active_skill_tool_result_with_observational, govern_catalogue, govern_skill_audit,
              govern_skill_catalogue, permission_for, skill_audit_result, skill_tool_spec, to_enterprise,
              Backend, GovernedMcp, McpOutcome, SKILL_AUDIT_TOOL, SKILL_READ_TOOL,
          };
          '''
          new = '''use ccos_enterprise_mcp::{
              active_skill_tool_result_with_observational, govern_catalogue, govern_governed_context,
              govern_skill_audit, govern_skill_catalogue, governed_context_tool_spec, permission_for,
              skill_audit_result, skill_tool_spec, to_enterprise, Backend, GovernedMcp, McpOutcome,
              GOVERNED_CONTEXT_TOOL, SKILL_AUDIT_TOOL, SKILL_READ_TOOL,
          };
          use ccos_enterprise_memory::{
              assemble_governed_bootstrap_context, attest_governed_context, BudgetedMemoryRecall,
              GovernedRecallTrustPolicy, MemoryContextBudget, MemoryRecallBudget, MemorySpace,
              MemoryValidationState,
          };
          use ccos_enterprise_octasoma::generation::ProviderGenerationStore;
          use ccos_enterprise_tenancy::{TenantId, TenantScope};
          '''
          if text.count(old) != 1:
              raise SystemExit('binary import anchor changed')
          text = text.replace(old, new, 1)

          text = text.replace(
              '    state_dir: PathBuf,\n}',
              '    state_dir: PathBuf,\n    governed_memory_root: Option<PathBuf>,\n}',
              1,
          )
          model_anchor = '''        if model.len() > 256 {
              return Err("CCOS_ENTERPRISE_MODEL is too long".into());
          }
          Ok(Self {
          '''
          model_replacement = '''        if model.len() > 256 {
              return Err("CCOS_ENTERPRISE_MODEL is too long".into());
          }
          let governed_memory_root = match std::env::var_os("CCOS_ENTERPRISE_GOVERNED_MEMORY_ROOT") {
              None => None,
              Some(value) if value.is_empty() => {
                  return Err("CCOS_ENTERPRISE_GOVERNED_MEMORY_ROOT is empty".into())
              }
              Some(value) => Some(PathBuf::from(value)),
          };
          Ok(Self {
          '''
          if text.count(model_anchor) != 1:
              raise SystemExit('config model anchor changed')
          text = text.replace(model_anchor, model_replacement, 1)
          text = text.replace(
              '            state_dir: PathBuf::from(required_env("CCOS_ENTERPRISE_STATE_DIR")?),\n',
              '            state_dir: PathBuf::from(required_env("CCOS_ENTERPRISE_STATE_DIR")?),\n            governed_memory_root,\n',
              1,
          )

          text = text.replace(
              '    front_door: GovernedMcp<JournaledBackend>,\n    poisoned: Option<String>,\n',
              '    front_door: GovernedMcp<JournaledBackend>,\n    governed_memory: Option<ProviderGenerationStore>,\n    poisoned: Option<String>,\n',
              1,
          )
          text = text.replace(
              '        govern_skill_catalogue(&mut deployment);\n        let mut tenant = TenantState::new(config.token_budget);\n',
              '        govern_skill_catalogue(&mut deployment);\n        if config.governed_memory_root.is_some() {\n            govern_governed_context(&mut deployment);\n        }\n        let mut tenant = TenantState::new(config.token_budget);\n',
              1,
          )
          text = text.replace(
              '        govern_skill_catalogue(&mut deployment);\n        govern_skill_audit(&mut deployment);\n\n        let skills_root',
              '        govern_skill_catalogue(&mut deployment);\n        govern_skill_audit(&mut deployment);\n        if config.governed_memory_root.is_some() {\n            govern_governed_context(&mut deployment);\n        }\n\n        let skills_root',
              1,
          )

          correlation_anchor = '''        let correlation = execution::ExecutionJournal::open(
              correlation_path(&config.state_dir, &config.tenant),
              format!("tenant/{}/host-correlation", config.tenant),
          )
          .map_err(|error| format!("cannot open Enterprise host-correlation journal: {error}"))?
          .journal;

          Ok(Self {
          '''
          correlation_replacement = '''        let correlation = execution::ExecutionJournal::open(
              correlation_path(&config.state_dir, &config.tenant),
              format!("tenant/{}/host-correlation", config.tenant),
          )
          .map_err(|error| format!("cannot open Enterprise host-correlation journal: {error}"))?
          .journal;

          let governed_memory = match &config.governed_memory_root {
              Some(root) => Some(
                  ProviderGenerationStore::open(
                      root,
                      TenantId::validated(&config.tenant)
                          .ok_or_else(|| "configured tenant cannot select governed memory".to_string())?,
                  )
                  .map_err(|error| format!("cannot open governed provider generation: {error}"))?,
              ),
              None => None,
          };

          Ok(Self {
          '''
          if text.count(correlation_anchor) != 1:
              raise SystemExit('server construction anchor changed')
          text = text.replace(correlation_anchor, correlation_replacement, 1)
          text = text.replace(
              '            correlation,\n            front_door,\n            poisoned: None,\n',
              '            correlation,\n            front_door,\n            governed_memory,\n            poisoned: None,\n',
              1,
          )

          text = text.replace(
              '            "tools/list" => enterprise_specs().map(|tools| json!({ "tools": tools })),\n',
              '            "tools/list" => enterprise_specs(self.governed_memory.is_some())\n                .map(|tools| json!({ "tools": tools })),\n',
              1,
          )

          skill_dispatch = '''        if request.tool == SKILL_READ_TOOL {
              return self.call_skill_tool(&identity, &request, &meta, &arguments);
          }
          '''
          local_dispatch = '''        if request.tool == GOVERNED_CONTEXT_TOOL && self.governed_memory.is_some() {
              return self.call_governed_context(&identity, &request, &meta, &arguments);
          }
          if request.tool == SKILL_READ_TOOL {
              return self.call_skill_tool(&identity, &request, &meta, &arguments);
          }
          '''
          if text.count(skill_dispatch) != 1:
              raise SystemExit('call_tool local-dispatch anchor changed')
          text = text.replace(skill_dispatch, local_dispatch, 1)

          method_anchor = '    fn call_skill_tool(\n'
          if text.count(method_anchor) != 1:
              raise SystemExit('call_skill_tool anchor changed')
          method = r'''    fn call_governed_context(
              &mut self,
              identity: &ccos_enterprise_auth::AuthenticatedActor,
              request: &GatewayRequest,
              meta: &Meta,
              arguments: &Value,
          ) -> Result<Value, (i64, String)> {
              let parsed = parse_governed_context_arguments(arguments)
                  .map_err(|error| (-32602, error))?;
              let checkpoint = DeploymentCheckpoint::capture(self.front_door.deployment());
              let execution = DispatchExecution::new(
                  meta.turn_id.clone(),
                  meta.step_id.clone(),
                  meta.execution_attempt_id.clone(),
              );
              let mut forwarded = false;

              let response = match self.front_door.deployment_mut().admit(Call {
                  actor: identity,
                  request,
                  model: &meta.model,
                  cost_tokens: self.config.call_cost_tokens,
                  variant: None,
                  justification: None,
              }) {
                  Outcome::Forwarded => {
                      forwarded = true;
                      let input_sha256 = successful_output_sha256(arguments).map_err(|error| {
                          let reason = format!("cannot hash governed-context input: {error}");
                          self.poisoned = Some(reason);
                          (-32000, "Enterprise governed-context input is not durable".to_string())
                      })?;
                      self.append_skill_execution_event(
                          &request.tenant,
                          execution::ExecutionEvent::ToolRequested {
                              turn_id: execution.turn_id.clone(),
                              step_id: execution.step_id.clone(),
                              call_id: execution.call_id.clone(),
                              tool: GOVERNED_CONTEXT_TOOL.to_string(),
                              input_sha256,
                          },
                      )?;
                      self.append_skill_execution_event(
                          &request.tenant,
                          execution::ExecutionEvent::ToolStarted {
                              call_id: execution.call_id.clone(),
                          },
                      )?;

                      let mut effect = EffectRecord::from_request(
                          request,
                          meta,
                          self.config.call_cost_tokens,
                          arguments,
                      );
                      if let Err(error) = write_effect(&effect_path(&self.config.state_dir), &effect) {
                          self.poisoned = Some(error.clone());
                          return Err((
                              -32000,
                              "Enterprise governed-context settlement state is not durable".to_string(),
                          ));
                      }

                      let result = (|| -> Result<Value, String> {
                          let store = self
                              .governed_memory
                              .as_ref()
                              .ok_or_else(|| "governed provider generation is unavailable".to_string())?;
                          if store.tenant().as_str() != request.tenant {
                              return Err("governed provider tenant differs from admitted request".into());
                          }
                          if parsed.embedding.len() != store.config().dimension {
                              return Err(format!(
                                  "embedding dimension mismatch: expected {}, found {}",
                                  store.config().dimension,
                                  parsed.embedding.len()
                              ));
                          }
                          let authority = store.governance();
                          let loadout = authority
                              .loadout
                              .bootstrap_loadout()
                              .map_err(|error| error.to_string())?
                              .ok_or_else(|| "governed memory has no bootstrap-enabled loadout".to_string())?;
                          let tenant = TenantId::validated(&request.tenant)
                              .ok_or_else(|| "admitted tenant is not canonical".to_string())?;
                          let observations = store
                              .recovered()
                              .recall(
                                  authority,
                                  TenantScope::new(
                                      tenant,
                                      BudgetedMemoryRecall {
                                          embedding: &parsed.embedding,
                                          loadout: &loadout,
                                          budget: parsed.recall_budget,
                                      },
                                  ),
                                  GovernedRecallTrustPolicy::VerifiedOnly,
                              )
                              .map_err(|error| error.to_string())?;
                          let assembly = assemble_governed_bootstrap_context(
                              &authority.loadout,
                              observations,
                              parsed.context_budget,
                          )
                          .map_err(|error| error.to_string())?;
                          let attestations = attest_governed_context(
                              &assembly,
                              &authority.graph,
                              &authority.trust,
                          )
                          .map_err(|error| error.to_string())?;
                          let items: Vec<Value> = assembly
                              .chunks()
                              .iter()
                              .zip(attestations.iter())
                              .map(|(chunk, attestation)| {
                                  json!({
                                      "asset_id": chunk.asset_id.as_str(),
                                      "space": memory_space_label(&chunk.space),
                                      "similarity": chunk.similarity,
                                      "payload_bytes": chunk.payload,
                                      "asset_state": "active",
                                      "trust_state": validation_state_label(attestation.trust_state),
                                      "parents": attestation.parents.iter().map(|id| id.as_str()).collect::<Vec<_>>(),
                                      "evidence": attestation.evidence.iter().map(|evidence| evidence.as_str()).collect::<Vec<_>>()
                                  })
                              })
                              .collect();
                          Ok(json!({
                              "content": [{
                                  "type": "text",
                                  "text": format!("CCOS Enterprise supplied {} verified governed context item(s)", items.len())
                              }],
                              "structuredContent": {
                                  "tool": GOVERNED_CONTEXT_TOOL,
                                  "generation": store.generation(),
                                  "trust_policy": "verified_only",
                                  "payload_bytes": assembly.payload_bytes(),
                                  "items": items
                              }
                          }))
                      })();

                      let (success, output_sha256) = match &result {
                          Ok(value) => (
                              true,
                              successful_output_sha256(value).map_err(|error| {
                                  let reason = format!("cannot hash governed-context output: {error}");
                                  self.poisoned = Some(reason);
                                  (-32000, "Enterprise governed-context output is not durable".to_string())
                              })?,
                          ),
                          Err(error) => (false, failed_output_sha256(error)),
                      };
                      effect.state = if success {
                          EffectState::Succeeded
                      } else {
                          EffectState::Failed
                      };
                      effect.output_sha256 = Some(output_sha256.clone());
                      if let Err(error) = write_effect(&effect_path(&self.config.state_dir), &effect) {
                          self.poisoned = Some(error.clone());
                          return Err((
                              -32000,
                              "Enterprise governed-context outcome is not durable".to_string(),
                          ));
                      }
                      self.append_skill_execution_event(
                          &request.tenant,
                          execution::ExecutionEvent::ToolFinished {
                              call_id: execution.call_id.clone(),
                              success,
                              output_sha256,
                          },
                      )?;

                      match result {
                          Ok(value) => value,
                          Err(error) => {
                              let restored = checkpoint.restore().map_err(|restore_error| {
                                  self.poisoned = Some(restore_error.clone());
                                  (-32000, "Enterprise admission rollback failed".to_string())
                              })?;
                              *self.front_door.deployment_mut() = restored;
                              if let Err(settle_error) = self
                                  .front_door
                                  .backend_mut()
                                  .inner_mut()
                                  .settle_marker(&request.request_id)
                              {
                                  self.poisoned = Some(settle_error.clone());
                                  return Err((
                                      -32000,
                                      "Enterprise failed governed-context outcome could not be settled".to_string(),
                                  ));
                              }
                              eprintln!("ccos-enterprise-mcp: admitted governed context failed without external side effect: {error}");
                              return Ok(tool_error("CCOS Enterprise governed context failed"));
                          }
                      }
                  }
                  Outcome::Replayed => json!({
                      "content": [{ "type": "text", "text": "CCOS Enterprise replay suppressed" }],
                      "structuredContent": { "replayed": true }
                  }),
                  Outcome::Refused(refusal) => {
                      eprintln!("ccos-enterprise-mcp: governed context refused: {refusal:?}");
                      tool_error("CCOS Enterprise request refused")
                  }
              };

              if let Err(error) = persist_deployment(&mut self.store, self.front_door.deployment()) {
                  self.poisoned = Some(error.clone());
                  eprintln!("ccos-enterprise-mcp: durable governed-context governance commit failed: {error}");
                  return Err((-32000, "Enterprise governance state is not durable".to_string()));
              }
              if forwarded {
                  if let Err(error) = self
                      .front_door
                      .backend_mut()
                      .inner_mut()
                      .settle_marker(&request.request_id)
                  {
                      self.poisoned = Some(error.clone());
                      eprintln!("ccos-enterprise-mcp: governed-context settlement marker failed: {error}");
                      return Err((-32000, "Enterprise governed-context settlement is not durable".to_string()));
                  }
              }
              Ok(response)
          }

          '''
          text = text.replace(method_anchor, method + method_anchor, 1)

          text = text.replace(
              'fn enterprise_specs() -> Result<Vec<Value>, (i64, String)> {',
              'fn enterprise_specs(include_governed_context: bool) -> Result<Vec<Value>, (i64, String)> {',
              1,
          )
          specs_anchor = '''    governed.push(skill_tool_spec());
              governed.sort_by(|left, right| {
          '''
          specs_replacement = '''    governed.push(skill_tool_spec());
              if include_governed_context {
                  if governed.iter().any(|tool| {
                      tool.get("name").and_then(Value::as_str) == Some(GOVERNED_CONTEXT_TOOL)
                  }) {
                      return Err((-32000, "Enterprise governed-context capability collides with catalogue".to_string()));
                  }
                  governed.push(governed_context_tool_spec());
              }
              governed.sort_by(|left, right| {
          '''
          if text.count(specs_anchor) != 1:
              raise SystemExit('enterprise_specs insertion anchor changed')
          text = text.replace(specs_anchor, specs_replacement, 1)

          helpers_anchor = 'fn tool_error(message: &str) -> Value {\n'
          if text.count(helpers_anchor) != 1:
              raise SystemExit('tool_error anchor changed')
          helpers = r'''struct GovernedContextArguments {
              embedding: Vec<f32>,
              recall_budget: MemoryRecallBudget,
              context_budget: MemoryContextBudget,
          }

          fn parse_governed_context_arguments(arguments: &Value) -> Result<GovernedContextArguments, String> {
              let object = arguments
                  .as_object()
                  .ok_or_else(|| "memory.context arguments must be an object".to_string())?;
              const ALLOWED: &[&str] = &[
                  "embedding",
                  "recall_max_items",
                  "recall_max_shortlist",
                  "recall_max_payload_bytes",
                  "context_max_items",
                  "context_max_payload_bytes",
              ];
              if object.keys().any(|key| !ALLOWED.contains(&key.as_str())) {
                  return Err("memory.context contains an unknown argument".into());
              }
              let values = object
                  .get("embedding")
                  .and_then(Value::as_array)
                  .ok_or_else(|| "memory.context embedding must be an array".to_string())?;
              if values.is_empty() || values.len() > 8192 {
                  return Err("memory.context embedding length is outside 1..=8192".into());
              }
              let mut embedding = Vec::with_capacity(values.len());
              for value in values {
                  let numeric = value
                      .as_f64()
                      .ok_or_else(|| "memory.context embedding contains a non-number".to_string())?;
                  let narrowed = numeric as f32;
                  if !numeric.is_finite() || !narrowed.is_finite() {
                      return Err("memory.context embedding contains a non-finite f32".into());
                  }
                  embedding.push(narrowed);
              }
              let get = |name: &str, default: usize| -> Result<usize, String> {
                  match object.get(name) {
                      None => Ok(default),
                      Some(value) => value
                          .as_u64()
                          .and_then(|value| usize::try_from(value).ok())
                          .ok_or_else(|| format!("memory.context {name} must be a non-negative integer")),
                  }
              };
              let recall_items = get("recall_max_items", 32)?;
              let recall_shortlist = get("recall_max_shortlist", recall_items.max(128))?;
              let recall_payload = get("recall_max_payload_bytes", 1024 * 1024)?;
              let context_items = get("context_max_items", 16)?;
              let context_payload = get("context_max_payload_bytes", 512 * 1024)?;
              Ok(GovernedContextArguments {
                  embedding,
                  recall_budget: MemoryRecallBudget::new(
                      recall_items,
                      recall_shortlist,
                      recall_payload,
                  )
                  .map_err(|error| error.to_string())?,
                  context_budget: MemoryContextBudget::new(context_items, context_payload)
                      .map_err(|error| error.to_string())?,
              })
          }

          fn memory_space_label(space: &MemorySpace) -> String {
              match space {
                  MemorySpace::Tenant => "tenant".into(),
                  MemorySpace::Project(id) => format!("project:{id}"),
                  MemorySpace::Team(id) => format!("team:{id}"),
                  MemorySpace::Agent(id) => format!("agent:{id}"),
              }
          }

          fn validation_state_label(state: MemoryValidationState) -> &'static str {
              match state {
                  MemoryValidationState::Unverified => "unverified",
                  MemoryValidationState::Corroborated => "corroborated",
                  MemoryValidationState::Verified => "verified",
                  MemoryValidationState::Disputed => "disputed",
                  MemoryValidationState::Quarantined => "quarantined",
              }
          }

          '''
          text = text.replace(helpers_anchor, helpers + helpers_anchor, 1)

          test_config_anchor = '''            state_dir: std::env::temp_dir().join(format!(
                  "ccos-enterprise-mcp-{label}-{}",
                  std::process::id()
              )),
          '''
          if text.count(test_config_anchor) != 1:
              raise SystemExit('test Config literal anchor changed')
          text = text.replace(
              test_config_anchor,
              test_config_anchor + '            governed_memory_root: None,\n',
              1,
          )

          path.write_text(text)
          PY
      - name: Reconcile only local dependency edges
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/served-context-lock-before.toml
          cargo +1.89.0 metadata --format-version 1 > /tmp/served-context-metadata.json
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          def packages(path):
              return {(p['name'], p['version'], p.get('source'), p.get('checksum')): p for p in tomllib.loads(Path(path).read_text())['package']}
          before = packages('/tmp/served-context-lock-before.toml')
          after = packages('Cargo.lock')
          assert before.keys() == after.keys(), 'package identity/version/source/checksum changed'
          changed = [key for key in before if before[key] != after[key]]
          assert len(changed) == 1 and changed[0][0] == 'ccos-enterprise-mcp' and changed[0][2] is None, changed
          old = set(before[changed[0]].get('dependencies', []))
          new = set(after[changed[0]].get('dependencies', []))
          assert new - old == {'ccos-enterprise-octasoma'}, new - old
          assert old <= new
          print('Only the Enterprise OctaSoma adapter edge was added to MCP')
          PY
          cargo +1.89.0 metadata --locked --format-version 1 >/dev/null
      - name: Format and qualify library plus real stdio restart
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.89.0 fmt --all
          cargo +1.89.0 test -p ccos-enterprise-octasoma --test generation_selector --locked
          cargo +1.89.0 test -p ccos-enterprise-octasoma --lib recovery::tests --locked
          cargo +1.89.0 test -p ccos-enterprise-mcp --lib governed_context_tool::tests --locked
          cargo +1.89.0 test -p ccos-enterprise-mcp --test governed_context_stdio --locked
          cargo +1.89.0 test -p ccos-enterprise-mcp --test stored_context_lifecycle --locked
          cargo +1.89.0 clippy -p ccos-enterprise-octasoma -p ccos-enterprise-mcp --all-targets --locked -- -D warnings
          git diff --exit-code -- Cargo.lock
      - name: Commit qualified product changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZEKRITI Tarek'
          git config user.email contact@checkupauto.fr
          git add Cargo.lock \
            crates/ccos-enterprise-octasoma/src/lib.rs \
            crates/ccos-enterprise-octasoma/src/generation.rs \
            crates/ccos-enterprise-octasoma/tests/generation_selector.rs \
            crates/ccos-enterprise-mcp/Cargo.toml \
            crates/ccos-enterprise-mcp/src/lib.rs \
            crates/ccos-enterprise-mcp/src/governed_context_tool.rs \
            crates/ccos-enterprise-mcp/src/bin/ccos-enterprise-mcp-server.rs \
            crates/ccos-enterprise-mcp/tests/governed_context_stdio.rs
          git diff --cached --quiet && exit 1
          git commit -m 'feat(mcp): qualify governed context through real stdio restart'
          git push origin HEAD:feat/served-governed-context
