name: Qualify served governed context v3

on:
  push:
    branches: [feat/served-governed-context]
    paths: [.github/workflows/qualify-served-context-v3-once.yml]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire the read-only generation and Enterprise-local context capability
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} anchor(s), found {found}: {old!r}')
              p.write_text(text.replace(old, new, count))

          replace('crates/ccos-enterprise-octasoma/src/lib.rs', 'pub mod recovery;\n', 'pub mod generation;\npub mod recovery;\n')
          replace('crates/ccos-enterprise-octasoma/src/generation.rs', '    let mut file = match File::open(path) {', '    let file = match File::open(path) {')
          replace('crates/ccos-enterprise-mcp/Cargo.toml', 'ccos-enterprise-memory = { path = "../ccos-enterprise-memory" }\n', 'ccos-enterprise-memory = { path = "../ccos-enterprise-memory" }\nccos-enterprise-octasoma = { path = "../ccos-enterprise-octasoma" }\n')
          replace('crates/ccos-enterprise-mcp/src/lib.rs', 'pub mod decision;\npub mod served_context;\n', 'pub mod decision;\npub mod governed_context_tool;\npub mod served_context;\n')
          replace('crates/ccos-enterprise-mcp/src/lib.rs', 'pub use served_context::{\n', 'pub use governed_context_tool::{\n    govern_governed_context, governed_context_tool_spec, GOVERNED_CONTEXT_PERMISSION,\n    GOVERNED_CONTEXT_TOOL,\n};\npub use served_context::{\n')

          path = 'crates/ccos-enterprise-mcp/src/bin/ccos-enterprise-mcp-server.rs'
          replace(path, '#[path = "../skill_projection.rs"]\nmod skill_projection;\n', '#[path = "../skill_projection.rs"]\nmod skill_projection;\n#[path = "../served_governed_stdio.rs"]\nmod served_governed_stdio;\n')
          replace(path, '    state_dir: PathBuf,\n}', '    state_dir: PathBuf,\n    governed_memory_root: Option<PathBuf>,\n}')
          replace(path, '        Ok(Self {\n            audience:', '        let governed_memory_root = match std::env::var_os("CCOS_ENTERPRISE_GOVERNED_MEMORY_ROOT") {\n            None => None,\n            Some(value) if value.is_empty() => {\n                return Err("CCOS_ENTERPRISE_GOVERNED_MEMORY_ROOT is empty".into());\n            }\n            Some(value) => Some(PathBuf::from(value)),\n        };\n        Ok(Self {\n            audience:')
          replace(path, '            state_dir: PathBuf::from(required_env("CCOS_ENTERPRISE_STATE_DIR")?),\n', '            state_dir: PathBuf::from(required_env("CCOS_ENTERPRISE_STATE_DIR")?),\n            governed_memory_root,\n')
          replace(path, '    front_door: GovernedMcp<JournaledBackend>,\n    poisoned: Option<String>,\n', '    front_door: GovernedMcp<JournaledBackend>,\n    governed_memory: Option<ccos_enterprise_octasoma::generation::ProviderGenerationStore>,\n    poisoned: Option<String>,\n')
          replace(path, '        govern_skill_catalogue(&mut deployment);\n        let mut tenant = TenantState::new(config.token_budget);\n', '        govern_skill_catalogue(&mut deployment);\n        if config.governed_memory_root.is_some() {\n            ccos_enterprise_mcp::govern_governed_context(&mut deployment);\n        }\n        let mut tenant = TenantState::new(config.token_budget);\n')
          replace(path, '        govern_skill_catalogue(&mut deployment);\n        govern_skill_audit(&mut deployment);\n\n        let skills_root', '        govern_skill_catalogue(&mut deployment);\n        govern_skill_audit(&mut deployment);\n        if config.governed_memory_root.is_some() {\n            ccos_enterprise_mcp::govern_governed_context(&mut deployment);\n        }\n\n        let skills_root')
          replace(path, '        Ok(Self {\n            config,\n            authenticator,', '        let governed_memory = match &config.governed_memory_root {\n            Some(root) => Some(\n                ccos_enterprise_octasoma::generation::ProviderGenerationStore::open(\n                    root,\n                    ccos_enterprise_tenancy::TenantId::validated(&config.tenant)\n                        .ok_or_else(|| "configured tenant cannot select governed memory".to_string())?,\n                )\n                .map_err(|error| format!("cannot open governed provider generation: {error}"))?,\n            ),\n            None => None,\n        };\n\n        Ok(Self {\n            config,\n            authenticator:')
          replace(path, '            correlation,\n            front_door,\n            poisoned: None,\n', '            correlation,\n            front_door,\n            governed_memory,\n            poisoned: None,\n')
          replace(path, '            "tools/list" => enterprise_specs().map(|tools| json!({ "tools": tools })),\n', '            "tools/list" => enterprise_specs(self.governed_memory.is_some())\n                .map(|tools| json!({ "tools": tools })),\n')
          replace(path, '        if request.tool == SKILL_READ_TOOL {\n            return self.call_skill_tool(&identity, &request, &meta, &arguments);\n        }\n', '        if request.tool == ccos_enterprise_mcp::GOVERNED_CONTEXT_TOOL\n            && self.governed_memory.is_some()\n        {\n            return self.call_governed_context(&identity, &request, &meta, &arguments);\n        }\n        if request.tool == SKILL_READ_TOOL {\n            return self.call_skill_tool(&identity, &request, &meta, &arguments);\n        }\n')
          replace(path, 'fn enterprise_specs() -> Result<Vec<Value>, (i64, String)> {', 'fn enterprise_specs(include_governed_context: bool) -> Result<Vec<Value>, (i64, String)> {')
          replace(path, '    governed.push(skill_tool_spec());\n    governed.sort_by(|left, right| {\n', '    governed.push(skill_tool_spec());\n    if include_governed_context {\n        if governed.iter().any(|tool| {\n            tool.get("name").and_then(Value::as_str)\n                == Some(ccos_enterprise_mcp::GOVERNED_CONTEXT_TOOL)\n        }) {\n            return Err((-32000, "Enterprise governed-context capability collides with catalogue".to_string()));\n        }\n        governed.push(ccos_enterprise_mcp::governed_context_tool_spec());\n    }\n    governed.sort_by(|left, right| {\n')
          replace(path, 'enterprise_specs().unwrap()', 'enterprise_specs(false).unwrap()', count=2)
          replace(path, '            state_dir: std::env::temp_dir().join(format!(\n                "ccos-enterprise-mcp-{label}-{}",\n                std::process::id()\n            )),\n        }', '            state_dir: std::env::temp_dir().join(format!(\n                "ccos-enterprise-mcp-{label}-{}",\n                std::process::id()\n            )),\n            governed_memory_root: None,\n        }')
          PY
      - name: Reconcile only the local MCP adapter dependency edge
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/served-context-lock-before.toml
          cargo +1.89.0 metadata --format-version 1 > /tmp/served-context-metadata.json
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          def packages(path):
              return {(p['name'], p['version'], p.get('source'), p.get('checksum')): p for p in tomllib.loads(Path(path).read_text())['package']}
          before = packages('/tmp/served-context-lock-before.toml')
          after = packages('Cargo.lock')
          assert before.keys() == after.keys(), 'package identity/version/source/checksum changed'
          changed = [key for key in before if before[key] != after[key]]
          assert len(changed) == 1 and changed[0][0] == 'ccos-enterprise-mcp' and changed[0][2] is None, changed
          old = set(before[changed[0]].get('dependencies', []))
          new = set(after[changed[0]].get('dependencies', []))
          assert new - old == {'ccos-enterprise-octasoma'}, new - old
          assert old <= new
          print('Only the Enterprise OctaSoma adapter edge was added to MCP')
          PY
          cargo +1.89.0 metadata --locked --format-version 1 >/dev/null
      - name: Format and qualify the real stdio restart path
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.89.0 fmt --all
          cargo +1.89.0 test -p ccos-enterprise-octasoma --test generation_selector --locked
          cargo +1.89.0 test -p ccos-enterprise-octasoma --lib recovery::tests --locked
          cargo +1.89.0 test -p ccos-enterprise-mcp --lib governed_context_tool::tests --locked
          cargo +1.89.0 test -p ccos-enterprise-mcp --test governed_context_stdio --locked
          cargo +1.89.0 test -p ccos-enterprise-mcp --test stored_context_lifecycle --locked
          cargo +1.89.0 clippy -p ccos-enterprise-octasoma -p ccos-enterprise-mcp --all-targets --locked -- -D warnings
          git diff --exit-code -- Cargo.lock
      - name: Commit qualified product changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZEKRITI Tarek'
          git config user.email contact@checkupauto.fr
          git add Cargo.lock \
            crates/ccos-enterprise-octasoma/src/lib.rs \
            crates/ccos-enterprise-octasoma/src/generation.rs \
            crates/ccos-enterprise-octasoma/tests/generation_selector.rs \
            crates/ccos-enterprise-mcp/Cargo.toml \
            crates/ccos-enterprise-mcp/src/lib.rs \
            crates/ccos-enterprise-mcp/src/governed_context_tool.rs \
            crates/ccos-enterprise-mcp/src/bin/ccos-enterprise-mcp-server.rs \
            crates/ccos-enterprise-mcp/src/served_governed_stdio.rs \
            crates/ccos-enterprise-mcp/tests/governed_context_stdio.rs
          git diff --cached --quiet && exit 1
          git commit -m 'feat(mcp): qualify governed context through real stdio restart'
          git push origin HEAD:feat/served-governed-context
