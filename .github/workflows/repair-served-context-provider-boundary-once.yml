name: Repair served-context provider boundary once

on:
  push:
    branches: [feat/served-governed-context]
    paths: [.github/workflows/repair-served-context-provider-boundary-once.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Replace concrete adapter naming with workspace composition alias
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('Cargo.toml')
          text = root.read_text()
          anchor = 'ccos-core = { path = "core", default-features = false }\n'
          alias = 'ccos-enterprise-provider-adapter = { package = "ccos-enterprise-octasoma", path = "crates/ccos-enterprise-octasoma" }\n'
          if alias not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('workspace dependency anchor changed')
              text = text.replace(anchor, anchor + alias, 1)
          root.write_text(text)

          manifest = Path('crates/ccos-enterprise-mcp/Cargo.toml')
          text = manifest.read_text()
          old = 'ccos-enterprise-octasoma = { path = "../ccos-enterprise-octasoma" }\n'
          new = 'ccos-enterprise-provider-adapter.workspace = true\n'
          if text.count(old) != 1:
              raise SystemExit(f'MCP concrete adapter dependency anchor count={text.count(old)}')
          manifest.write_text(text.replace(old, new, 1))

          replacements = {
              'crates/ccos-enterprise-mcp/src/bin/ccos-enterprise-mcp-server.rs': (
                  'ccos_enterprise_octasoma::generation::ProviderGenerationStore',
                  'ccos_enterprise_provider_adapter::generation::ProviderGenerationStore',
              ),
              'crates/ccos-enterprise-mcp/tests/governed_context_stdio.rs': (
                  'ccos_enterprise_octasoma::',
                  'ccos_enterprise_provider_adapter::',
              ),
          }
          for path, (old, new) in replacements.items():
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'{path}: expected adapter reference, found none')
              p.write_text(text.replace(old, new))
          PY

      - name: Prove architecture boundary and lockfile integrity
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-guards.sh
          manifest_list="$RUNNER_TEMP/ccos-octasoma-manifests"
          grep -Rli 'octasoma' --include='Cargo.toml' crates tools Cargo.toml > "$manifest_list"
          sort -o "$manifest_list" "$manifest_list"
          cat "$manifest_list"
          mapfile -t OCTA_MANIFESTS < "$manifest_list"
          printf '%s\n' "${OCTA_MANIFESTS[@]}" | grep -qx 'Cargo.toml'
          printf '%s\n' "${OCTA_MANIFESTS[@]}" | grep -qx 'crates/ccos-enterprise-octasoma/Cargo.toml'
          test "${#OCTA_MANIFESTS[@]}" -eq 2
          cargo +1.89.0 metadata --locked --format-version 1 >/dev/null
          git diff --exit-code -- Cargo.lock

      - name: Qualify affected path
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.89.0 fmt --all
          cargo +1.89.0 test -p ccos-enterprise-mcp --test governed_context_stdio --locked
          cargo +1.89.0 test -p ccos-enterprise-mcp --lib governed_context_tool::tests --locked
          cargo +1.89.0 test -p ccos-enterprise-octasoma --test generation_selector --locked
          cargo +1.89.0 clippy -p ccos-enterprise-mcp -p ccos-enterprise-octasoma --all-targets --locked -- -D warnings
          git diff --exit-code -- Cargo.lock

      - name: Commit product changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZEKRITI Tarek'
          git config user.email contact@checkupauto.fr
          git add Cargo.toml \
            crates/ccos-enterprise-mcp/Cargo.toml \
            crates/ccos-enterprise-mcp/src/bin/ccos-enterprise-mcp-server.rs \
            crates/ccos-enterprise-mcp/tests/governed_context_stdio.rs
          git diff --cached --quiet && exit 1
          git commit -m 'fix(architecture): compose governed provider through workspace alias'
          git push origin HEAD:feat/served-governed-context
