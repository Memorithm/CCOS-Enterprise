name: Requalify accepted governed evidence once

on:
  push:
    branches: [feat/governed-evidence-write]
    paths: [.github/workflows/requalify-accepted-evidence-once.yml]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Qualify accepted evidence semantics
        run: |
          set -euo pipefail
          cargo +1.89.0 fmt --all -- --check
          cargo +1.89.0 test -p ccos-enterprise-octasoma --test accepted_evidence_write --locked
          cargo +1.89.0 test -p ccos-enterprise-octasoma --locked
          cargo +1.89.0 clippy -p ccos-enterprise-octasoma --all-targets --locked -- -D warnings
          git diff --exit-code -- Cargo.lock
