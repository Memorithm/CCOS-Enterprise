name: shared OctaSoma projector integration

on:
  push:
    branches: [ feat/shared-octasoma-projector ]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-octasoma-projector
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Apply focused integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          old = 'octasoma = { git = "https://github.com/Memorithm/octasoma", rev = "145761aeb52ef8ded85dcf2b8c97690005284926", default-features = false }'
          new = 'octasoma = { git = "https://github.com/Memorithm/octasoma", rev = "2e2e0f1ed88d81675f301819529aeb3aa6053c72", default-features = false }'
          assert old in text
          cargo.write_text(text.replace(old, new, 1))

          path = Path('crates/ccos-enterprise-octasoma/src/lib.rs')
          text = path.read_text()
          text = text.replace('use octasoma::HybridMemory;', 'use octasoma::{HybridMemory, HybridMemoryFactory};', 1)
          text = text.replace('    seed: u64,\n    bits: usize,\n    per_tenant_capacity: usize,', '    factory: HybridMemoryFactory,\n    per_tenant_capacity: usize,', 1)
          text = text.replace('            dim,\n            seed,\n            bits,\n            per_tenant_capacity,', '            dim,\n            factory: HybridMemoryFactory::new(dim, seed, bits),\n            per_tenant_capacity,', 1)
          old_block = '''        let dim = self.dim;\n        let seed = self.seed;\n        let bits = self.bits;\n        let tenant_memory = self.tenants.entry(tenant).or_default();\n        let memory = tenant_memory\n            .spaces\n            .entry(space.clone())\n            .or_insert_with(|| HybridMemory::new(dim, seed, bits));'''
          new_block = '''        let factory = self.factory.clone();\n        let tenant_memory = self.tenants.entry(tenant).or_default();\n        let memory = tenant_memory\n            .spaces\n            .entry(space.clone())\n            .or_insert_with(|| factory.create());'''
          assert old_block in text
          text = text.replace(old_block, new_block, 1)
          marker = '''    /// Configured hard item limit for each tenant across all memory spaces.\n    pub fn per_tenant_capacity(&self) -> usize {\n        self.per_tenant_capacity\n    }\n'''
          replacement = marker + '''\n    /// Bytes occupied by the one immutable SimHash projector shared by every\n    /// tenant/space index created by this adapter.\n    pub fn shared_projector_bytes(&self) -> usize {\n        self.factory.projector_bytes()\n    }\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          cargo update -p 'git+https://github.com/Memorithm/octasoma?rev=145761aeb52ef8ded85dcf2b8c97690005284926#0.4.0' --precise 2e2e0f1ed88d81675f301819529aeb3aa6053c72
      - name: Validate focused integration
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          cargo check -p ccos-enterprise-octasoma --all-features
          cargo clippy -p ccos-enterprise-octasoma --all-features -- -D warnings
          cargo test -p ccos-enterprise-octasoma --all-features
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name MEMOPERF
          git config user.email memoperf@users.noreply.github.com
          git add Cargo.toml Cargo.lock crates/ccos-enterprise-octasoma/src/lib.rs
          git commit -m 'perf(memory): share OctaSoma projector across spaces'
          git fetch origin feat/shared-octasoma-projector
          git rebase origin/feat/shared-octasoma-projector
          git push origin HEAD:feat/shared-octasoma-projector
