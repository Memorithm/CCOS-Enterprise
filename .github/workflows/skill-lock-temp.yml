name: TEMP generate skill lockfile

on:
  push:
    branches:
      - feat/enterprise-skill-crystallization

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/enterprise-skill-crystallization
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Generate canonical Cargo state
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test -p ccos-enterprise-skills
          cargo clippy -p ccos-enterprise-skills -- -D warnings
          cargo metadata --format-version 1 >/dev/null
      - name: Push generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add Cargo.lock crates/ccos-enterprise-skills
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(skills): apply cargo lock and formatting'
          git push origin HEAD:feat/enterprise-skill-crystallization
