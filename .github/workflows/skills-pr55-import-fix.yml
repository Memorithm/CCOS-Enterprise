name: TEMP skills PR55 import fix

on:
  push:
    branches: [ci/skills-pr55-import-fix]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/skills-pr55-import-fix
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - name: Apply exact fix and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ccos-enterprise-skills/src/registry.rs')
          s = p.read_text()
          old = 'use crate::{skill_fingerprint, EpisodeObservation, SkillError, ToolOutcome};'
          new = 'use crate::{skill_fingerprint, EpisodeObservation, SkillError};'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          rm .github/workflows/skills-pr55-import-fix.yml
          cargo fmt --all
          cargo check -p ccos-enterprise-skills
      - name: Commit clean tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add -A
          git commit -m 'fix(skills): satisfy workspace warnings'
          git push origin HEAD:ci/skills-pr55-import-fix
