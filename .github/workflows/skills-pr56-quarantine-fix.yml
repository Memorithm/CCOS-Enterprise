name: TEMP skills PR56 quarantine fix

on:
  push:
    branches: [feat/skills-ingest-wiring]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/skills-ingest-wiring
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Distinguish permanent source errors from durable store errors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ccos-enterprise-mcp/src/bin/ccos-enterprise-mcp-server.rs')
          s = p.read_text()
          def once(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected one occurrence, got {n}: {old[:120]!r}')
              s = s.replace(old, new)

          once(
              'use ccos_enterprise_skills::{SkillConfig, SkillStore};\n',
              'use ccos_enterprise_skills::{parse_capture, SkillConfig, SkillStore};\n',
          )
          once(
              '''    fn finish_skill_projection(&mut self, request_id: &str, source: &str) -> Result<(), String> {\n        let source_hash = source_sha256(source);\n        self.skill_projection\n            .require_match(request_id, &source_hash)?;\n        self.skill_store\n            .observe_capture(SkillConfig::default(), source)\n            .map_err(|error| format!("cannot project DSH L1 skill evidence: {error}"))?;\n        self.skill_projection.clear(request_id, &source_hash)\n    }\n''',
              '''    /// Returns true when the current source was permanently rejected as malformed\n    /// L1 evidence. Durable store/snapshot failures remain pending and retryable.\n    fn finish_skill_projection(&mut self, request_id: &str, source: &str) -> Result<bool, String> {\n        let source_hash = source_sha256(source);\n        self.skill_projection\n            .require_match(request_id, &source_hash)?;\n\n        if let Err(error) = parse_capture(source) {\n            eprintln!(\n                "ccos-enterprise-mcp: quarantining malformed DSH L1 evidence for request {request_id:?}: {error}"\n            );\n            self.skill_projection.clear(request_id, &source_hash)?;\n            return Ok(true);\n        }\n\n        self.skill_store\n            .observe_capture(SkillConfig::default(), source)\n            .map_err(|error| format!("cannot project DSH L1 skill evidence: {error}"))?;\n        self.skill_projection.clear(request_id, &source_hash)?;\n        Ok(false)\n    }\n''',
          )
          once(
              '''        self.finish_skill_projection(request_id, source)\n            .map_err(|error| {\n                eprintln!("ccos-enterprise-mcp: skill projection remains pending: {error}");\n                (\n                    -32000,\n                    "Enterprise skill projection remains pending".to_string(),\n                )\n            })?;\n''',
              '''        let quarantined = self\n            .finish_skill_projection(request_id, source)\n            .map_err(|error| {\n                eprintln!("ccos-enterprise-mcp: skill projection remains pending: {error}");\n                (\n                    -32000,\n                    "Enterprise skill projection remains pending".to_string(),\n                )\n            })?;\n''',
          )
          once(
              '''            "structuredContent": { "replayed": true, "skill_projection_recovered": true }\n''',
              '''            "structuredContent": {\n                "replayed": true,\n                "skill_projection_recovered": true,\n                "skill_projection_quarantined": quarantined\n            }\n''',
          )
          p.write_text(s)
          PY
          rm .github/workflows/skills-pr56-quarantine-fix.yml
          cargo fmt --all
          cargo check -p ccos-enterprise-mcp --all-targets
          cargo clippy -p ccos-enterprise-mcp --all-targets -- -D warnings
          cargo test -p ccos-enterprise-mcp --all-targets
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add -A
          git commit -m 'fix(skills): quarantine irrecoverable L1 projections'
          git push origin HEAD:feat/skills-ingest-wiring
