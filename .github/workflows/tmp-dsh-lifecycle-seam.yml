name: Temporary DSH lifecycle seam validator

on:
  push:
    branches: [feat/dsh-explicit-execution-lifecycle]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  validate:
    if: github.event.head_commit.message == 'ci: validate DSH lifecycle seam'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dsh-explicit-execution-lifecycle
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply focused lifecycle seam patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          p = Path('crates/ccos-enterprise-mcp/src/execution_backend.rs')
          text = p.read_text()
          text = once(
              text,
              '''    pub fn append_event(\n        &mut self,\n        tenant: &str,\n        event: ExecutionEvent,\n    ) -> Result<(), ExecutionBackendError> {\n        validate_tenant(tenant)?;\n        self.journal_for(tenant)?.append(event)?;\n        Ok(())\n    }\n''',
              '''    pub fn append_lifecycle_event(\n        &mut self,\n        tenant: &str,\n        event: ExecutionEvent,\n    ) -> Result<bool, ExecutionBackendError> {\n        validate_tenant(tenant)?;\n        let journal = self.journal_for(tenant)?;\n        let prior = journal.records().iter().find_map(|record| {\n            lifecycle_identity_matches(&record.event, &event).then(|| record.event == event)\n        });\n        match prior {\n            Some(true) => return Ok(false),\n            Some(false) => {\n                return Err(ExecutionBackendError::RecoveryMismatch(\n                    "conflicting durable lifecycle event for the same host identity".into(),\n                ))\n            }\n            None => {}\n        }\n        journal.append(event)?;\n        Ok(true)\n    }\n''',
              'idempotent lifecycle append',
          )
          text = once(
              text,
              '''    if let Err(error) = server\n        .front_door\n        .backend_mut()\n        .execution\n        .append_event(&meta.tenant, event)\n    {\n        let reason = error.to_string();\n        server.poisoned = Some(reason.clone());\n        eprintln!("ccos-enterprise-mcp: lifecycle journal append failed: {reason}");\n        return Err((-32000, "Enterprise execution state is not durable".into()));\n    }\n    Ok(json!({ "recorded": true }))\n}\n''',
              '''    let recorded = match server\n        .front_door\n        .backend_mut()\n        .execution\n        .append_lifecycle_event(&meta.tenant, event)\n    {\n        Ok(recorded) => recorded,\n        Err(ExecutionBackendError::RecoveryMismatch(detail)) => {\n            eprintln!("ccos-enterprise-mcp: lifecycle conflict refused: {detail}");\n            return Err((-32002, "Enterprise lifecycle conflict".into()));\n        }\n        Err(error) => {\n            let reason = error.to_string();\n            server.poisoned = Some(reason.clone());\n            eprintln!("ccos-enterprise-mcp: lifecycle journal append failed: {reason}");\n            return Err((-32000, "Enterprise execution state is not durable".into()));\n        }\n    };\n    Ok(json!({ "recorded": recorded, "replayed": !recorded }))\n}\n''',
              'lifecycle handler result',
          )
          marker = '''pub fn successful_output_sha256(value: &Value) -> Result<String, serde_json::Error> {\n'''
          helper = '''fn lifecycle_identity_matches(left: &ExecutionEvent, right: &ExecutionEvent) -> bool {\n    match (left, right) {\n        (ExecutionEvent::TurnStarted { turn_id: left }, ExecutionEvent::TurnStarted { turn_id: right }) => left == right,\n        (\n            ExecutionEvent::StepStarted { turn_id: lt, step_id: ls },\n            ExecutionEvent::StepStarted { turn_id: rt, step_id: rs },\n        ) => lt == rt && ls == rs,\n        (\n            ExecutionEvent::UserMessage { turn_id: lt, message_id: lm, .. },\n            ExecutionEvent::UserMessage { turn_id: rt, message_id: rm, .. },\n        ) => lt == rt && lm == rm,\n        (\n            ExecutionEvent::AssistantMessage { turn_id: lt, step_id: ls, message_id: lm, .. },\n            ExecutionEvent::AssistantMessage { turn_id: rt, step_id: rs, message_id: rm, .. },\n        ) => lt == rt && ls == rs && lm == rm,\n        (\n            ExecutionEvent::StepFinished { turn_id: lt, step_id: ls, .. },\n            ExecutionEvent::StepFinished { turn_id: rt, step_id: rs, .. },\n        ) => lt == rt && ls == rs,\n        (ExecutionEvent::TurnFinished { turn_id: left, .. }, ExecutionEvent::TurnFinished { turn_id: right, .. }) => left == right,\n        _ => false,\n    }\n}\n\n'''
          text = once(text, marker, helper + marker, 'lifecycle identity helper')
          text = once(
              text,
              '''        backend\n            .append_event(\n                "acme",\n                ExecutionEvent::TurnStarted {\n                    turn_id: "dsh-session-1:turn:1".into(),\n                },\n            )\n            .unwrap();\n''',
              '''        let event = ExecutionEvent::TurnStarted {\n            turn_id: "dsh-session-1:turn:1".into(),\n        };\n        assert!(backend\n            .append_lifecycle_event("acme", event.clone())\n            .unwrap());\n        assert!(!backend.append_lifecycle_event("acme", event).unwrap());\n''',
              'same-journal lifecycle test',
          )
          insert_before = '''        let _ = std::fs::remove_dir_all(root);\n    }\n}\n'''
          extra_test = '''        let _ = std::fs::remove_dir_all(root);\n    }\n\n    #[test]\n    fn conflicting_lifecycle_retry_is_refused_without_append() {\n        let root = std::env::temp_dir().join(format!(\n            "ccos-mcp-exec-lifecycle-conflict-{}",\n            std::process::id()\n        ));\n        let _ = std::fs::remove_dir_all(&root);\n        let mut backend = ExecutionBackend::new(BackendOk, &root);\n        assert!(backend\n            .append_lifecycle_event(\n                "acme",\n                ExecutionEvent::TurnFinished {\n                    turn_id: "dsh-session-1:turn:1".into(),\n                    success: true,\n                },\n            )\n            .unwrap());\n        let error = backend\n            .append_lifecycle_event(\n                "acme",\n                ExecutionEvent::TurnFinished {\n                    turn_id: "dsh-session-1:turn:1".into(),\n                    success: false,\n                },\n            )\n            .unwrap_err();\n        assert!(matches!(error, ExecutionBackendError::RecoveryMismatch(_)));\n        let path = backend.journal_path_for("acme").unwrap();\n        let reopened = ExecutionJournal::open(path, "tenant/acme/mcp").unwrap();\n        assert_eq!(reopened.journal.len(), 1);\n        let _ = std::fs::remove_dir_all(root);\n    }\n}\n'''
          text = once(text, insert_before, extra_test, 'conflict lifecycle test')
          p.write_text(text)

          p = Path('crates/ccos-enterprise-mcp/src/bin/ccos-enterprise-mcp-server.rs')
          text = p.read_text()
          text = once(
              text,
              '''            "tools/list" => enterprise_specs().map(|tools| json!({ "tools": tools })),\n            "tools/call" => self.call_tool(message.get("params").unwrap_or(&Value::Null)),\n            _ => Err((-32601, "method not found".to_string())),\n''',
              '''            "tools/list" => enterprise_specs().map(|tools| json!({ "tools": tools })),\n            "tools/call" => self.call_tool(message.get("params").unwrap_or(&Value::Null)),\n            "ccos/execution/event" => execution_backend::handle_lifecycle_event(\n                self,\n                message.get("params").unwrap_or(&Value::Null),\n            ),\n            _ => Err((-32601, "method not found".to_string())),\n''',
              'server lifecycle route',
          )
          text = once(
              text,
              '''    fn cleanup(root: &Path) {\n''',
              '''    fn lifecycle(id: u64, actor: &str, event: Value) -> Value {\n        json!({\n            "jsonrpc": "2.0",\n            "id": id,\n            "method": "ccos/execution/event",\n            "params": {\n                "event": event,\n                "_meta": { "ccos": {\n                    "tenant_id": "acme",\n                    "actor_id": actor,\n                    "host": HOST_KIND,\n                    "model": "deepseek-harness"\n                }}\n            }\n        })\n    }\n\n    fn cleanup(root: &Path) {\n''',
              'lifecycle test helper',
          )
          text = once(
              text,
              '''    #[test]\n    fn actor_claim_cannot_override_the_verified_token() {\n''',
              '''    #[test]\n    fn lifecycle_rpc_is_authenticated_idempotent_and_not_a_tool() {\n        let config = test_config("lifecycle-rpc");\n        let root = config.state_dir.clone();\n        cleanup(&root);\n        let mut server = Server::new(config).unwrap();\n        let event = json!({\n            "type": "turn_started",\n            "turn_id": "dsh-session-1:turn:1"\n        });\n        let first = server.handle(&lifecycle(90, "alice", event.clone())).unwrap();\n        assert_eq!(first["result"]["recorded"], true);\n        assert_eq!(first["result"]["replayed"], false);\n        let replay = server.handle(&lifecycle(91, "alice", event)).unwrap();\n        assert_eq!(replay["result"]["recorded"], false);\n        assert_eq!(replay["result"]["replayed"], true);\n        let forged = server\n            .handle(&lifecycle(92, "mallory", json!({\n                "type": "turn_finished",\n                "turn_id": "dsh-session-1:turn:1",\n                "success": true\n            })))\n            .unwrap();\n        assert_eq!(forged["error"]["code"], -32001);\n        let tools = enterprise_specs().unwrap();\n        assert!(!tools.iter().any(|tool| tool["name"] == "ccos/execution/event"));\n        let path = execution_root(&root).join("acme").join("execution.jsonl");\n        let reopened = execution::ExecutionJournal::open(&path, "tenant/acme/mcp")\n            .unwrap()\n            .journal;\n        assert_eq!(reopened.len(), 1);\n        assert!(matches!(\n            &reopened.records()[0].event,\n            execution::ExecutionEvent::TurnStarted { turn_id }\n                if turn_id == "dsh-session-1:turn:1"\n        ));\n        drop(server);\n        cleanup(&root);\n    }\n\n    #[test]\n    fn actor_claim_cannot_override_the_verified_token() {\n''',
              'server lifecycle test',
          )
          p.write_text(text)
          PY
      - name: Format and validate seam
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo metadata --locked --format-version 1 >/dev/null
          cargo check -p ccos-enterprise-mcp --all-features
          cargo clippy -p ccos-enterprise-mcp --all-targets --all-features -- -D warnings
          cargo test -p ccos-enterprise-mcp --all-targets --all-features
      - name: Commit validated seam
        run: |
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add crates/ccos-enterprise-mcp/src/execution_backend.rs \
                  crates/ccos-enterprise-mcp/src/bin/ccos-enterprise-mcp-server.rs
          git commit -m 'feat(dsh): expose durable internal lifecycle RPC'
          git push origin HEAD:feat/dsh-explicit-execution-lifecycle
