name: governed bootstrap context validation

on:
  push:
    branches: [feat/memory-governed-bootstrap-context]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-governed-bootstrap-context
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire and validate
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('crates/ccos-enterprise-memory/src/lib.rs'); t=p.read_text(); m='mod governed_provider;\\n'; a='mod governed_context;\\npub use governed_context::{assemble_governed_bootstrap_context, GovernedMemoryContextAssembly};\\n\\n'+m; assert m in t and 'mod governed_context;' not in t; p.write_text(t.replace(m,a,1))"
          cargo fmt --all
          cargo check -p ccos-enterprise-memory
          cargo clippy -p ccos-enterprise-memory -- -D warnings
          cargo test -p ccos-enterprise-memory
          git config user.name MEMOPERF
          git config user.email memoperf@users.noreply.github.com
          git add crates/ccos-enterprise-memory/src/lib.rs crates/ccos-enterprise-memory/src/governed_context.rs
          git commit -m 'feat(memory): preserve identity in bootstrap context'
          git fetch origin feat/memory-governed-bootstrap-context
          git rebase origin/feat/memory-governed-bootstrap-context
          git push origin HEAD:feat/memory-governed-bootstrap-context
