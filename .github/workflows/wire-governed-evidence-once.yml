name: Wire governed evidence write once

on:
  push:
    branches: [feat/governed-evidence-write]
    paths: [.github/workflows/wire-governed-evidence-once.yml]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire write capability into existing server lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/ccos-enterprise-mcp/src/bin/ccos-enterprise-mcp-server.rs')
          text = p.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              text = text.replace(old, new, 1)

          old = '#[path = "../served_governed_stdio.rs"]\nmod served_governed_stdio;\n'
          new = old + '#[path = "../served_governed_write.rs"]\nmod served_governed_write;\n'
          replace_once(old, new, 'served write module')

          old = '    #[serde(default, skip_serializing_if = "Option::is_none")]\n    output_sha256: Option<String>,\n}'
          new = '\n'.join([
              '    #[serde(default, skip_serializing_if = "Option::is_none")]',
              '    output_sha256: Option<String>,',
              '    #[serde(default, skip_serializing_if = "Option::is_none")]',
              '    governed_generation: Option<u64>,',
              '    #[serde(default, skip_serializing_if = "Option::is_none")]',
              '    governed_asset_id: Option<String>,',
              '    #[serde(default, skip_serializing_if = "Option::is_none")]',
              '    governed_image_sha256: Option<String>,',
              '}',
          ])
          replace_once(old, new, 'effect receipt fields')

          old = '            output_sha256: None,\n        }'
          new = '\n'.join([
              '            output_sha256: None,',
              '            governed_generation: None,',
              '            governed_asset_id: None,',
              '            governed_image_sha256: None,',
              '        }',
          ])
          replace_once(old, new, 'effect receipt defaults')

          old = '                skill_source_sha256: None,\n                output_sha256: Some("skill-output".into()),\n            };'
          new = '                skill_source_sha256: None,\n                output_sha256: Some("skill-output".into()),\n                governed_generation: None,\n                governed_asset_id: None,\n                governed_image_sha256: None,\n            };'
          replace_once(old, new, 'skill crash fixture')

          old = '                skill_source_sha256: None,\n                output_sha256: Some("known-output".into()),\n            };'
          new = '                skill_source_sha256: None,\n                output_sha256: Some("known-output".into()),\n                governed_generation: None,\n                governed_asset_id: None,\n                governed_image_sha256: None,\n            };'
          replace_once(old, new, 'recovered success fixture')

          old = '        if config.governed_memory_root.is_some() {\n            ccos_enterprise_mcp::govern_governed_context(&mut deployment);\n        }\n'
          new = '        if config.governed_memory_root.is_some() {\n            ccos_enterprise_mcp::govern_governed_context(&mut deployment);\n            ccos_enterprise_mcp::govern_governed_evidence_write(&mut deployment);\n        }\n'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'governed-memory governance anchors: expected 2, found {count}')
          text = text.replace(old, new)

          old = '                EffectState::Succeeded => {\n                    if effect.execution_attempt_id.is_some() {\n'
          new = '                EffectState::Succeeded => {\n                    served_governed_write::validate_recovered_evidence_effect(&config, &effect)?;\n                    if effect.execution_attempt_id.is_some() {\n'
          replace_once(old, new, 'startup succeeded receipt validation')

          old = '        if request.tool == ccos_enterprise_mcp::GOVERNED_CONTEXT_TOOL\n            && self.governed_memory.is_some()\n        {\n            return self.call_governed_context(&identity, &request, &meta, &arguments);\n        }\n'
          new = '        if request.tool == ccos_enterprise_mcp::GOVERNED_EVIDENCE_WRITE_TOOL\n            && self.governed_memory.is_some()\n        {\n            return self.call_governed_evidence_write(&identity, &request, &meta, &arguments);\n        }\n        if request.tool == ccos_enterprise_mcp::GOVERNED_CONTEXT_TOOL\n            && self.governed_memory.is_some()\n        {\n            return self.call_governed_context(&identity, &request, &meta, &arguments);\n        }\n'
          replace_once(old, new, 'custom tool routing')

          old = '        governed.push(ccos_enterprise_mcp::governed_context_tool_spec());\n    }\n    governed.sort_by'
          new = '\n'.join([
              '        governed.push(ccos_enterprise_mcp::governed_context_tool_spec());',
              '        if governed.iter().any(|tool| {',
              '            tool.get("name").and_then(Value::as_str)',
              '                == Some(ccos_enterprise_mcp::GOVERNED_EVIDENCE_WRITE_TOOL)',
              '        }) {',
              '            return Err((',
              '                -32000,',
              '                "Enterprise governed-evidence capability collides with catalogue".to_string(),',
              '            ));',
              '        }',
              '        governed.push(ccos_enterprise_mcp::governed_evidence_write_tool_spec());',
              '    }',
              '    governed.sort_by',
          ])
          replace_once(old, new, 'tools list write spec')

          p.write_text(text)
          PY
      - name: Format, compile and test affected path
        run: |
          set -euo pipefail
          cargo +1.89.0 fmt --all
          cargo +1.89.0 test -p ccos-enterprise-octasoma --test accepted_evidence_write --locked
          cargo +1.89.0 test -p ccos-enterprise-mcp --lib governed_evidence_tool::tests --locked
          cargo +1.89.0 test -p ccos-enterprise-mcp --bin ccos-enterprise-mcp-server --locked
          cargo +1.89.0 clippy -p ccos-enterprise-mcp -p ccos-enterprise-octasoma --all-targets --locked -- -D warnings
          git diff --exit-code -- Cargo.lock
      - name: Commit product changes only
        run: |
          set -euo pipefail
          git config user.name 'ZEKRITI Tarek'
          git config user.email contact@checkupauto.fr
          git add crates/ccos-enterprise-mcp/src/bin/ccos-enterprise-mcp-server.rs \
            crates/ccos-enterprise-mcp/src/governed_evidence_tool.rs \
            crates/ccos-enterprise-mcp/src/served_governed_write.rs \
            crates/ccos-enterprise-mcp/src/lib.rs \
            crates/ccos-enterprise-octasoma/src/accepted_write.rs \
            crates/ccos-enterprise-octasoma/tests/accepted_evidence_write.rs
          if ! git diff --cached --quiet; then
            git commit -m 'feat(mcp): execute governed evidence writes with durable receipts'
            git push origin HEAD:feat/governed-evidence-write
          fi
