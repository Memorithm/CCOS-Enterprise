name: governed recall policy validation

on:
  push:
    branches: [ feat/memory-governed-recall-policy-v2 ]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-governed-recall-policy-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ccos-enterprise-memory/src/lib.rs')
          text = p.read_text()
          marker = 'mod governed_provider;\n'
          addition = '''mod governed_recall;
pub use governed_recall::{
    admit_governed_recall, GovernedRecallGate, GovernedRecallGateError,
    GovernedRecallTrustPolicy,
};

''' + marker
          assert marker in text
          assert 'mod governed_recall;' not in text
          p.write_text(text.replace(marker, addition, 1))
          PY
          cargo fmt --all
      - name: Validate
        run: |
          cargo check -p ccos-enterprise-memory
          cargo clippy -p ccos-enterprise-memory -- -D warnings
          cargo test -p ccos-enterprise-memory
      - name: Commit product
        shell: bash
        run: |
          git config user.name MEMOPERF
          git config user.email memoperf@users.noreply.github.com
          git add crates/ccos-enterprise-memory/src/lib.rs crates/ccos-enterprise-memory/src/governed_recall.rs
          git commit -m 'feat(memory): gate governed recall on lineage and trust'
          git fetch origin feat/memory-governed-recall-policy-v2
          git rebase origin/feat/memory-governed-recall-policy-v2
          git push origin HEAD:feat/memory-governed-recall-policy-v2
