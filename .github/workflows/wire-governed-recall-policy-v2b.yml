name: governed recall policy validation v2

on:
  push:
    branches: [feat/memory-governed-recall-policy-v2]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-governed-recall-policy-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire and validate
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('crates/ccos-enterprise-memory/src/lib.rs'); t=p.read_text(); m='mod governed_provider;\\n'; a='mod governed_recall;\\npub use governed_recall::{\\n    admit_governed_recall, GovernedRecallGate, GovernedRecallGateError,\\n    GovernedRecallTrustPolicy,\\n};\\n\\n'+m; assert m in t and 'mod governed_recall;' not in t; p.write_text(t.replace(m,a,1))"
          cargo fmt --all
          cargo check -p ccos-enterprise-memory
          cargo clippy -p ccos-enterprise-memory -- -D warnings
          cargo test -p ccos-enterprise-memory
          git config user.name MEMOPERF
          git config user.email memoperf@users.noreply.github.com
          git add crates/ccos-enterprise-memory/src/lib.rs crates/ccos-enterprise-memory/src/governed_recall.rs
          git commit -m 'feat(memory): gate governed recall on lineage and trust'
          git fetch origin feat/memory-governed-recall-policy-v2
          git rebase origin/feat/memory-governed-recall-policy-v2
          git push origin HEAD:feat/memory-governed-recall-policy-v2
