name: memory bootstrap context validation

on:
  push:
    branches: [ feat/memory-bootstrap-context ]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-bootstrap-context
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ccos-enterprise-memory/src/lib.rs')
          text = p.read_text()
          marker = 'mod lineage_graph;\n'
          addition = 'mod context_budget;\npub use context_budget::{\n    assemble_bootstrap_context, MemoryContextAssembly, MemoryContextBudget, MemoryContextError,\n    MAX_MEMORY_CONTEXT_ITEMS, MAX_MEMORY_CONTEXT_PAYLOAD_BYTES,\n};\n\n' + marker
          assert marker in text
          assert 'mod context_budget;' not in text
          p.write_text(text.replace(marker, addition, 1))
          PY
          cargo fmt --all
      - name: Validate
        run: |
          cargo check -p ccos-enterprise-memory
          cargo clippy -p ccos-enterprise-memory -- -D warnings
          cargo test -p ccos-enterprise-memory
      - name: Commit
        shell: bash
        run: |
          git config user.name MEMOPERF
          git config user.email memoperf@users.noreply.github.com
          git add crates/ccos-enterprise-memory/src/lib.rs crates/ccos-enterprise-memory/src/context_budget.rs
          git commit -m 'feat(memory): bound bootstrap context assembly'
          git fetch origin feat/memory-bootstrap-context
          git rebase origin/feat/memory-bootstrap-context
          git push origin HEAD:feat/memory-bootstrap-context
