name: memory bundle manifest v1 validation

on:
  push:
    branches: [feat/memory-bundle-manifest-v1]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-bundle-manifest-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire and validate
        shell: bash
        run: |
          python3 tools/tmp_wire_memory_bundle.py
          cargo fmt --all
          cargo check -p ccos-enterprise-memory
          cargo clippy -p ccos-enterprise-memory -- -D warnings
          cargo test -p ccos-enterprise-memory
          git config user.name MEMOPERF
          git config user.email memoperf@users.noreply.github.com
          git add crates/ccos-enterprise-memory/src/lib.rs crates/ccos-enterprise-memory/src/bundle.rs
          git commit -m 'feat(memory): wire governed bundle manifest v1'
          git fetch origin feat/memory-bundle-manifest-v1
          git rebase origin/feat/memory-bundle-manifest-v1
          git push origin HEAD:feat/memory-bundle-manifest-v1
