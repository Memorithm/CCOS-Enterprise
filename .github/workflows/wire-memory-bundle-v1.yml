name: memory bundle v1 validation

on:
  push:
    branches: [feat/memory-bundle-v1]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-bundle-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ccos-enterprise-memory/src/lib.rs')
          t = p.read_text()
          marker = 'mod context_budget;\n'
          addition = '''mod bundle;
pub use bundle::{
    MemoryBundleEntry, MemoryBundleError, MemoryBundleManifest, MemoryBundleVersion,
    MemoryContentDigest, MemoryProviderReference,
};

''' + marker
          assert marker in t
          assert 'mod bundle;' not in t
          p.write_text(t.replace(marker, addition, 1))
          PY
          cargo fmt --all
          cargo check -p ccos-enterprise-memory
          cargo clippy -p ccos-enterprise-memory -- -D warnings
          cargo test -p ccos-enterprise-memory
          git config user.name MEMOPERF
          git config user.email memoperf@users.noreply.github.com
          git add crates/ccos-enterprise-memory/src/lib.rs crates/ccos-enterprise-memory/src/bundle.rs
          git commit -m 'feat(memory): wire versioned bundle manifest'
          git fetch origin feat/memory-bundle-v1
          git rebase origin/feat/memory-bundle-v1
          git push origin HEAD:feat/memory-bundle-v1
