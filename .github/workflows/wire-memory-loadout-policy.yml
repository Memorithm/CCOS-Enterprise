name: memory loadout policy validation

on:
  push:
    branches: [ feat/memory-loadout-policy ]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-loadout-policy
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ccos-enterprise-memory/src/lib.rs')
          text = path.read_text()
          needle = '''pub use lineage_graph::{
              MemoryAssetState, MemoryGraphError, MemoryInvalidationReport, MemoryLineageGraph,
          };
          '''
          addition = needle + '''
          mod loadout_policy;
          pub use loadout_policy::{
              MAX_MEMORY_LOADOUT_BINDINGS, MemoryLoadoutBinding, MemoryLoadoutPlan,
              MemoryLoadoutPlanError, MemoryUsageMode,
          };
          '''
          assert needle in text
          assert 'mod loadout_policy;' not in text
          path.write_text(text.replace(needle, addition, 1))
          PY
          cargo fmt --all
      - name: Validate
        run: |
          cargo check -p ccos-enterprise-memory
          cargo clippy -p ccos-enterprise-memory -- -D warnings
          cargo test -p ccos-enterprise-memory
      - name: Commit
        shell: bash
        run: |
          git config user.name MEMOPERF
          git config user.email memoperf@users.noreply.github.com
          git add crates/ccos-enterprise-memory/src/lib.rs crates/ccos-enterprise-memory/src/loadout_policy.rs
          git commit -m 'feat(memory): govern agent memory loadouts'
          git fetch origin feat/memory-loadout-policy
          git rebase origin/feat/memory-loadout-policy
          git push origin HEAD:feat/memory-loadout-policy
