name: memory recall budget validation

on:
  push:
    branches: [ feat/memory-recall-budget ]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-recall-budget
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire and normalize API use
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          module = Path('crates/ccos-enterprise-memory/src/recall_budget.rs')
          text = module.read_text()
          text = text.replace('use ccos_enterprise_tenancy::TenantScope;', 'use ccos_enterprise_tenancy::{TenantId, TenantScope};')
          text = text.replace('let TenantScope { tenant, value } = scoped;', 'let TenantScope { tenant, inner } = scoped;')
          text = text.replace('value.', 'inner.')
          text = text.replace('TenantScope::new("acme".into(), value)', 'TenantScope::new(TenantId("acme".into()), value)')
          module.write_text(text)

          lib = Path('crates/ccos-enterprise-memory/src/lib.rs')
          text = lib.read_text()
          needle = '''pub use loadout_policy::{
              MemoryLoadoutBinding, MemoryLoadoutPlan, MemoryLoadoutPlanError, MemoryUsageMode,
              MAX_MEMORY_LOADOUT_BINDINGS,
          };
          '''
          addition = needle + '''
          mod recall_budget;
          pub use recall_budget::{
              BudgetedMemoryRecall, MemoryRecallBudget, MemoryRecallBudgetError,
              SemanticMemoryProviderExt, MAX_MEMORY_RECALL_ITEMS, MAX_MEMORY_RECALL_PAYLOAD_BYTES,
              MAX_MEMORY_RECALL_SHORTLIST,
          };
          '''
          assert needle in text
          assert 'mod recall_budget;' not in text
          lib.write_text(text.replace(needle, addition, 1))
          PY
          cargo fmt --all
      - name: Validate
        run: |
          cargo check -p ccos-enterprise-memory
          cargo clippy -p ccos-enterprise-memory -- -D warnings
          cargo test -p ccos-enterprise-memory
      - name: Commit
        shell: bash
        run: |
          git config user.name MEMOPERF
          git config user.email memoperf@users.noreply.github.com
          git add crates/ccos-enterprise-memory/src/lib.rs crates/ccos-enterprise-memory/src/recall_budget.rs
          git commit -m 'feat(memory): enforce bounded recalls'
          git fetch origin feat/memory-recall-budget
          git rebase origin/feat/memory-recall-budget
          git push origin HEAD:feat/memory-recall-budget
