name: memory retention validation

on:
  push:
    branches: [ feat/memory-retention ]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-retention
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ccos-enterprise-memory/src/lib.rs')
          text = p.read_text()
          marker = 'mod trust;\n'
          addition = 'mod retention;\npub use retention::{apply_memory_retention, MemoryRetentionError, MemoryRetentionOutcome, MemoryRetentionPolicy};\n\n' + marker
          assert marker in text
          assert 'mod retention;' not in text
          p.write_text(text.replace(marker, addition, 1))
          PY
          cargo fmt --all
      - name: Validate
        run: |
          cargo check -p ccos-enterprise-memory
          cargo clippy -p ccos-enterprise-memory -- -D warnings
          cargo test -p ccos-enterprise-memory
      - name: Commit
        shell: bash
        run: |
          git config user.name MEMOPERF
          git config user.email memoperf@users.noreply.github.com
          git add crates/ccos-enterprise-memory/src/lib.rs crates/ccos-enterprise-memory/src/retention.rs
          git commit -m 'feat(memory): propagate deterministic retention expiry'
          git fetch origin feat/memory-retention
          git rebase origin/feat/memory-retention
          git push origin HEAD:feat/memory-retention
