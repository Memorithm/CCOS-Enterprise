name: lineage graph validation

on:
  push:
    branches: [ feat/memory-staleness ]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-staleness
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ccos-enterprise-memory/src/lib.rs')
          text = path.read_text()
          needle = 'use ccos_enterprise_tenancy::TenantScope;\n'
          addition = '''use ccos_enterprise_tenancy::TenantScope;\n\nmod lineage_graph;\npub use lineage_graph::{\n    MemoryAssetState, MemoryGraphError, MemoryInvalidationReport, MemoryLineageGraph,\n};\n'''
          assert needle in text
          assert 'mod lineage_graph;' not in text
          path.write_text(text.replace(needle, addition, 1))
          PY
          cargo fmt --all
      - name: Validate
        run: |
          cargo check -p ccos-enterprise-memory
          cargo clippy -p ccos-enterprise-memory -- -D warnings
          cargo test -p ccos-enterprise-memory
      - name: Commit
        shell: bash
        run: |
          git config user.name MEMOPERF
          git config user.email memoperf@users.noreply.github.com
          git add crates/ccos-enterprise-memory/src/lib.rs crates/ccos-enterprise-memory/src/lineage_graph.rs
          git commit -m 'feat(memory): enforce lineage invalidation closure'
          git fetch origin feat/memory-staleness
          git rebase origin/feat/memory-staleness
          git push origin HEAD:feat/memory-staleness
