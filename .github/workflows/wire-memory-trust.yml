name: memory trust validation

on:
  push:
    branches: [ feat/memory-trust-metadata ]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-trust-metadata
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ccos-enterprise-memory/src/lib.rs')
          text = path.read_text()
          needle = '''pub use recall_budget::{
              BudgetedMemoryRecall, MemoryRecallBudget, MemoryRecallBudgetError, SemanticMemoryProviderExt,
              MAX_MEMORY_RECALL_ITEMS, MAX_MEMORY_RECALL_PAYLOAD_BYTES, MAX_MEMORY_RECALL_SHORTLIST,
          };
          '''
          addition = needle + '''
          mod trust;
          pub use trust::{MemoryTrustError, MemoryTrustMetadata, MemoryValidationState};
          '''
          assert needle in text
          assert 'mod trust;' not in text
          path.write_text(text.replace(needle, addition, 1))
          PY
          cargo fmt --all
      - name: Validate
        run: |
          cargo check -p ccos-enterprise-memory
          cargo clippy -p ccos-enterprise-memory -- -D warnings
          cargo test -p ccos-enterprise-memory
      - name: Commit
        shell: bash
        run: |
          git config user.name MEMOPERF
          git config user.email memoperf@users.noreply.github.com
          git add crates/ccos-enterprise-memory/src/lib.rs crates/ccos-enterprise-memory/src/trust.rs
          git commit -m 'feat(memory): model evidence-based trust state'
          git fetch origin feat/memory-trust-metadata
          git rebase origin/feat/memory-trust-metadata
          git push origin HEAD:feat/memory-trust-metadata
