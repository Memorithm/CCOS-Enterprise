name: governed OctaSoma forget validation

on:
  push:
    branches: [feat/octasoma-governed-forget]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/octasoma-governed-forget
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Wire and validate
        shell: bash
        run: |
          python3 tools/tmp_wire_governed_forget.py
          cargo fmt --all
          cargo check -p ccos-enterprise-octasoma
          cargo clippy -p ccos-enterprise-octasoma -- -D warnings
          cargo test -p ccos-enterprise-octasoma
          git config user.name MEMOPERF
          git config user.email memoperf@users.noreply.github.com
          git add crates/ccos-enterprise-octasoma/src/lib.rs
          git commit -m 'feat(memory): add governed logical forget'
          git fetch origin feat/octasoma-governed-forget
          git rebase origin/feat/octasoma-governed-forget
          git push origin HEAD:feat/octasoma-governed-forget
