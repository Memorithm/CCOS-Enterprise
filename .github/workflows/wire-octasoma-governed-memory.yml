name: governed OctaSoma memory validation

on:
  push:
    branches: [ feat/octasoma-governed-memory ]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/octasoma-governed-memory
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Apply patch
        run: |
          python3 tools/patch_octasoma_governed_memory.py
          cargo fmt --all
      - name: Validate
        run: |
          cargo check -p ccos-enterprise-octasoma --all-features
          cargo clippy -p ccos-enterprise-octasoma --all-features -- -D warnings
          cargo test -p ccos-enterprise-octasoma --all-features
      - name: Commit
        run: |
          git config user.name MEMOPERF
          git config user.email memoperf@users.noreply.github.com
          git add crates/ccos-enterprise-octasoma/src/lib.rs
          git commit -m 'feat(memory): preserve governed ids in OctaSoma adapter'
          git fetch origin feat/octasoma-governed-memory
          git rebase origin/feat/octasoma-governed-memory
          git push origin HEAD:feat/octasoma-governed-memory
