name: Temporary approval hardening

on:
  push:
    branches: [fix/approval-postmerge-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply reviewed hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              if text.count(old) != 1:
                  raise SystemExit(f"non-unique patch anchor: {label} ({text.count(old)})")
              return text.replace(old, new, 1)

          p = Path('crates/ccos-enterprise-approval/src/lib.rs')
          s = p.read_text()

          s = replace_once(s, '''pub struct ApprovalSnapshot {
              pub schema_version: u32,
              pub approvals: BTreeMap<String, ApprovalRecord>,
          }

          impl Default for ApprovalSnapshot {
              fn default() -> Self {
                  Self {
                      schema_version: APPROVAL_SCHEMA,
                      approvals: BTreeMap::new(),
                  }
              }
          }
          ''', '''pub struct ApprovalSnapshot {
              pub schema_version: u32,
              pub approvals: BTreeMap<String, ApprovalRecord>,
              /// Revocations are part of the authoritative snapshot as well as the
              /// append-only sidecar. Older snapshots omit this field and therefore
              /// restore with no revocations; new snapshots can never resurrect a
              /// revoked approval after checkpoint/restore.
              #[serde(default)]
              pub revocations: BTreeMap<String, RevocationRecord>,
          }

          impl Default for ApprovalSnapshot {
              fn default() -> Self {
                  Self {
                      schema_version: APPROVAL_SCHEMA,
                      approvals: BTreeMap::new(),
                      revocations: BTreeMap::new(),
                  }
              }
          }
          ''', 'snapshot revocations')

          s = replace_once(s, '''    /// The canonical approval id: a domain-separated hash binding tenant,
              /// action, artifact hash and approver. Re-deriving it for a different
              /// artifact yields a different id, so an approval can never be replayed
              /// onto another artifact.
              pub fn id(&self) -> String {
                  let mut hasher = Sha256::new();
                  for part in [
                      b"ccos-enterprise-approval-v1".as_slice(),
                      self.tenant.0.as_bytes(),
                      self.action.as_bytes(),
                      self.artifact_hash.as_bytes(),
                      self.approver.as_bytes(),
                  ] {
                      hasher.update((part.len() as u64).to_be_bytes());
                      hasher.update(part);
                  }
                  format!("approval-v1-{}", hex(hasher.finalize()))
              }
          }
          ''', '''    /// Canonical approval id. Version 2 binds every field that can change
              /// authorization semantics, so a persisted decision, expiry, timestamp or
              /// justification cannot be edited while retaining a valid id. The framed
              /// encoding also permits a later decision by the same approver for the same
              /// artifact to receive a distinct id.
              pub fn id(&self) -> String {
                  let decision = match self.decision {
                      ApprovalDecision::Approved => b"approved".as_slice(),
                      ApprovalDecision::Denied => b"denied".as_slice(),
                  };
                  let recorded_at = self.recorded_at.to_be_bytes();
                  let expiry_tag = [u8::from(self.expires_at.is_some())];
                  let expiry = self.expires_at.unwrap_or_default().to_be_bytes();
                  let mut hasher = Sha256::new();
                  for part in [
                      b"ccos-enterprise-approval-v2".as_slice(),
                      self.tenant.0.as_bytes(),
                      self.action.as_bytes(),
                      self.artifact_hash.as_bytes(),
                      self.approver.as_bytes(),
                      decision,
                      recorded_at.as_slice(),
                      expiry_tag.as_slice(),
                      expiry.as_slice(),
                      self.justification.as_bytes(),
                  ] {
                      hasher.update((part.len() as u64).to_be_bytes());
                      hasher.update(part);
                  }
                  format!("approval-v2-{}", hex(hasher.finalize()))
              }

              /// Legacy v1 id used only to validate old snapshots. A v1 record may
              /// remain auditable after upgrade, but it is deliberately never accepted
              /// by the authorization gate because its id did not bind all
              /// authorization-bearing fields.
              fn legacy_id(&self) -> String {
                  let mut hasher = Sha256::new();
                  for part in [
                      b"ccos-enterprise-approval-v1".as_slice(),
                      self.tenant.0.as_bytes(),
                      self.action.as_bytes(),
                      self.artifact_hash.as_bytes(),
                      self.approver.as_bytes(),
                  ] {
                      hasher.update((part.len() as u64).to_be_bytes());
                      hasher.update(part);
                  }
                  format!("approval-v1-{}", hex(hasher.finalize()))
              }
          }
          ''', 'approval id v2')

          s = replace_once(s, '''    if request.id() != record.id {
                  return Err(ApprovalError::Invalid {
                      detail: "approval id does not match its fields".into(),
                  });
              }
              Ok(())
          }
          ''', '''    let id_matches = if record.id.starts_with("approval-v2-") {
                  request.id() == record.id
              } else if record.id.starts_with("approval-v1-") {
                  request.legacy_id() == record.id
              } else {
                  false
              };
              if !id_matches {
                  return Err(ApprovalError::Invalid {
                      detail: "approval id does not match its fields".into(),
                  });
              }
              Ok(())
          }

          fn validate_revocation(
              snapshot: &ApprovalSnapshot,
              key: &str,
              record: &RevocationRecord,
          ) -> Result<(), ApprovalError> {
              if key != record.approval_id {
                  return Err(ApprovalError::Invalid {
                      detail: "revocation key does not match approval id".into(),
                  });
              }
              let approval = snapshot
                  .approvals
                  .get(&record.approval_id)
                  .ok_or_else(|| ApprovalError::Unknown {
                      id: record.approval_id.clone(),
                  })?;
              if approval.decision != ApprovalDecision::Approved {
                  return Err(ApprovalError::Invalid {
                      detail: "only an approved record can be revoked".into(),
                  });
              }
              if record.revoked_by.is_empty()
                  || record.revoked_by.len() > MAX_APPROVER_BYTES
                  || renders_blank(&record.revoked_by)
              {
                  return Err(ApprovalError::Invalid {
                      detail: "revoked_by must be a legible, bounded identity".into(),
                  });
              }
              if record.justification.len() > MAX_JUSTIFICATION_BYTES
                  || renders_blank(&record.justification)
              {
                  return Err(ApprovalError::Invalid {
                      detail: "revocation requires a legible, bounded justification".into(),
                  });
              }
              Ok(())
          }
          ''', 'record validation')

          s = replace_once(s, '''#[derive(Debug)]
          pub struct ApprovalRegistry {
              snapshot: ApprovalSnapshot,
              revocations: BTreeMap<String, RevocationRecord>,
          }
          ''', '''#[derive(Debug, Clone)]
          pub struct ApprovalRegistry {
              snapshot: ApprovalSnapshot,
          }
          ''', 'registry shape')

          s = replace_once(s, '''    pub fn new() -> Self {
                  Self {
                      snapshot: ApprovalSnapshot::default(),
                      revocations: BTreeMap::new(),
                  }
              }

              pub fn from_snapshot(snapshot: ApprovalSnapshot) -> Result<Self, ApprovalError> {
                  if snapshot.schema_version != APPROVAL_SCHEMA {
                      return Err(ApprovalError::UnsupportedSchema {
                          found: snapshot.schema_version,
                      });
                  }
                  for record in snapshot.approvals.values() {
                      validate_record(record)?;
                  }
                  Ok(Self {
                      snapshot,
                      revocations: BTreeMap::new(),
                  })
              }
          ''', '''    pub fn new() -> Self {
                  Self {
                      snapshot: ApprovalSnapshot::default(),
                  }
              }

              pub fn from_snapshot(snapshot: ApprovalSnapshot) -> Result<Self, ApprovalError> {
                  if snapshot.schema_version != APPROVAL_SCHEMA {
                      return Err(ApprovalError::UnsupportedSchema {
                          found: snapshot.schema_version,
                      });
                  }
                  for record in snapshot.approvals.values() {
                      validate_record(record)?;
                  }
                  for (key, record) in &snapshot.revocations {
                      validate_revocation(&snapshot, key, record)?;
                  }
                  Ok(Self { snapshot })
              }
          ''', 'registry constructor')

          s = s.replace('self.revocations.contains_key(id)', 'self.snapshot.revocations.contains_key(id)')
          s = s.replace('self.revocations.contains_key(&record.id)', 'self.snapshot.revocations.contains_key(&record.id)')
          s = s.replace('if self.revocations.contains_key(approval_id) {', 'if self.snapshot.revocations.contains_key(approval_id) {')
          s = s.replace('        self.revocations.insert(\n', '        self.snapshot.revocations.insert(\n')

          s = replace_once(s, '''            if record.tenant != query.tenant.0
                          || record.action != query.action
                          || record.artifact_hash != query.artifact_hash
                          || record.decision != ApprovalDecision::Approved
                      {
                          continue;
                      }
          ''', '''            if record.tenant != query.tenant.0
                          || record.action != query.action
                          || record.artifact_hash != query.artifact_hash
                          || record.decision != ApprovalDecision::Approved
                          || !record.id.starts_with("approval-v2-")
                      {
                          continue;
                      }
          ''', 'legacy approvals fail closed')

          s = replace_once(s, '''        file.write_all(&line).map_err(io(&self.revocation_path))?;
                  file.sync_data().map_err(io(&self.revocation_path))?;
                  Ok(())
              }
          ''', '''        file.write_all(&line).map_err(io(&self.revocation_path))?;
                  file.sync_data().map_err(io(&self.revocation_path))?;
                  // The first append may have created the directory entry. Syncing the
                  // file alone does not make that entry durable across a crash.
                  File::open(&self.root)
                      .and_then(|directory| directory.sync_all())
                      .map_err(io(&self.root))?;
                  Ok(())
              }
          ''', 'revocation directory fsync')

          s = replace_once(s, '''            if approval.decision == ApprovalDecision::Approved
                          && !registry.revocations.contains_key(&revocation.approval_id)
                      {
                          registry.revocations.insert(
                              revocation.approval_id.clone(),
                              RevocationRecord {
                                  approval_id: revocation.approval_id.clone(),
                                  revoked_by: revocation.revoked_by.clone(),
                                  revoked_at: revocation.revoked_at,
                                  justification: revocation.justification.clone(),
                              },
                          );
                      }
          ''', '''            if approval.decision != ApprovalDecision::Approved {
                          return Err(ApprovalError::Invalid {
                              detail: "revocation points to a denied approval".into(),
                          });
                      }
                      validate_revocation(&registry.snapshot, &revocation.approval_id, &revocation)?;
                      match registry.snapshot.revocations.get(&revocation.approval_id) {
                          Some(existing) if existing == &revocation => {}
                          Some(_) => {
                              return Err(ApprovalError::Invalid {
                                  detail: "snapshot and sidecar disagree on revocation".into(),
                              })
                          }
                          None => {
                              registry
                                  .snapshot
                                  .revocations
                                  .insert(revocation.approval_id.clone(), revocation);
                          }
                      }
          ''', 'load revocations')

          # Validate revocations even when loading only the snapshot.
          s = replace_once(s, '''        for record in snapshot.approvals.values() {
                  validate_record(record)?;
              }
              Ok(Some(snapshot))
          ''', '''        for record in snapshot.approvals.values() {
                  validate_record(record)?;
              }
              for (key, record) in &snapshot.revocations {
                  validate_revocation(&snapshot, key, record)?;
              }
              Ok(Some(snapshot))
          ''', 'load snapshot revocations')

          # AuditUnavailable lets runtime refuse rather than create a usable
          # approval with no governance evidence when its audit buffer is disabled.
          s = replace_once(s, '''    AlreadyRevoked {
                  id: String,
              },
          }
          ''', '''    AlreadyRevoked {
                  id: String,
              },
              AuditUnavailable,
          }
          ''', 'approval error variant')
          s = replace_once(s, '''            (Self::AlreadyRevoked { id: l }, Self::AlreadyRevoked { id: r }) => l == r,
                  _ => false,
          ''', '''            (Self::AlreadyRevoked { id: l }, Self::AlreadyRevoked { id: r }) => l == r,
                  (Self::AuditUnavailable, Self::AuditUnavailable) => true,
                  _ => false,
          ''', 'approval error equality')
          s = replace_once(s, '''            Self::AlreadyRevoked { id } => write!(f, "approval {id} is already revoked"),
              }
          ''', '''            Self::AlreadyRevoked { id } => write!(f, "approval {id} is already revoked"),
                  Self::AuditUnavailable => write!(f, "approval audit trail is unavailable"),
              }
          ''', 'approval error display')

          # Add regression tests before the test module closes.
          marker = '\n}\n'
          idx = s.rfind(marker)
          if idx < 0:
              raise SystemExit('cannot find approval test module end')
          tests = r'''

              #[test]
              fn v2_identity_binds_decision_expiry_timestamp_and_justification() {
                  let base = request(
                      "acme",
                      "tenant.delete",
                      &artifact(7),
                      "operator",
                      100,
                      Some(200),
                  );
                  let id = base.id();
                  let mut changed = base.clone();
                  changed.decision = ApprovalDecision::Denied;
                  assert_ne!(id, changed.id());
                  let mut changed = base.clone();
                  changed.expires_at = Some(201);
                  assert_ne!(id, changed.id());
                  let mut changed = base.clone();
                  changed.recorded_at = 101;
                  assert_ne!(id, changed.id());
                  let mut changed = base.clone();
                  changed.justification = "different justification".into();
                  assert_ne!(id, changed.id());
              }

              #[test]
              fn revocation_survives_snapshot_restore() {
                  let mut registry = ApprovalRegistry::new();
                  let id = registry
                      .record(request(
                          "acme",
                          "policy.disable",
                          &artifact(8),
                          "operator",
                          100,
                          None,
                      ))
                      .unwrap();
                  registry
                      .revoke(&id, "operator", 110, "superseded")
                      .unwrap();
                  let snapshot = registry.snapshot().clone();
                  let restored = ApprovalRegistry::from_snapshot(snapshot).unwrap();
                  let tenant = TenantId("acme".into());
                  assert_eq!(
                      restored.evaluate(&ApprovalQuery {
                          tenant: &tenant,
                          action: "policy.disable",
                          artifact_hash: &artifact(8),
                          now: 120,
                      }),
                      GateOutcome::Revoked
                  );
              }
          '''
          s = s[:idx] + tests + s[idx:]
          p.write_text(s)

          p = Path('crates/ccos-enterprise-runtime/src/lib.rs')
          s = p.read_text()

          s = replace_once(s, '''pub const DEFAULT_REPLAY_MEMORY: usize = 65_536;
          ''', '''pub const DEFAULT_REPLAY_MEMORY: usize = 65_536;

          /// Sensitive actions that are approval-gated on every deployment, including
          /// restored snapshots that predate the approval engine. Callers may add more
          /// gates, but they cannot accidentally provision these seven fail-open.
          pub const DEFAULT_APPROVAL_REQUIRED_ACTIONS: &[&str] = &[
              "tenant.delete",
              "tenant.suspend",
              "quota.override",
              "policy.disable",
              "license.revoke",
              "model.allowlist.change",
              "schema.migrate",
          ];

          fn default_approval_required_actions() -> BTreeSet<String> {
              DEFAULT_APPROVAL_REQUIRED_ACTIONS
                  .iter()
                  .map(|action| (*action).to_string())
                  .collect()
          }
          ''', 'default approval actions')

          s = replace_once(s, '''            approval_required: BTreeSet::new(),
                  approvals: ApprovalLedger::default(),
          ''', '''            approval_required: default_approval_required_actions(),
                  approvals: ApprovalLedger::default(),
          ''', 'deployment defaults')

          s = replace_once(s, '''    #[serde(default)]
              pub approval_required: BTreeSet<String>,
          ''', '''    #[serde(default = "default_approval_required_actions")]
              pub approval_required: BTreeSet<String>,
          ''', 'snapshot approval default')

          s = replace_once(s, '''        d.approval_required = snapshot.approval_required;
              d.approvals = ApprovalLedger::from_snapshot(snapshot.approvals).map_err(|error| {
          ''', '''        d.approval_required = snapshot.approval_required;
              d.approval_required
                  .extend(default_approval_required_actions());
              d.approvals = ApprovalLedger::from_snapshot(snapshot.approvals).map_err(|error| {
          ''', 'restore approval defaults')

          s = replace_once(s, '''#[derive(Debug, Default)]
          pub struct ApprovalLedger {
          ''', '''#[derive(Debug, Clone, Default)]
          pub struct ApprovalLedger {
          ''', 'clone approval ledger')

          # Mandatory security governance records must not disappear merely because
          # the deployment is still in provisioning mode. Capacity zero is refused.
          anchor = '''    /// Make rule changes under a recorded identity and reason.
          '''
          helper = '''    fn record_mandatory_governance(
                  &mut self,
                  change: GovernanceChange,
                  actor: Option<&str>,
                  justification: Option<&str>,
              ) -> Result<(), ccos_enterprise_approval::ApprovalError> {
                  if self.audit_capacity == 0 {
                      return Err(ccos_enterprise_approval::ApprovalError::AuditUnavailable);
                  }
                  let ordinal = self.next_governance_ordinal;
                  self.next_governance_ordinal = self.next_governance_ordinal.saturating_add(1);
                  while self.governance.len() >= self.audit_capacity {
                      self.governance.pop_front();
                      self.governance_dropped = self.governance_dropped.saturating_add(1);
                      self.metrics.inc("governance.dropped", 1);
                  }
                  self.governance.push_back(GovernanceRecord {
                      at_sequence: self.next_sequence,
                      ordinal,
                      actor: actor.map(clamp),
                      justification: justification
                          .filter(|j| ccos_enterprise_admin::is_written_justification(Some(j)))
                          .map(clamp),
                      change,
                  });
                  Ok(())
              }

          '''
          if anchor not in s:
              raise SystemExit('missing mandatory governance insertion anchor')
          s = s.replace(anchor, helper + anchor, 1)

          old = '''    pub fn record_approval(
                  &mut self,
                  request: ccos_enterprise_approval::ApprovalRequest,
              ) -> Result<String, ccos_enterprise_approval::ApprovalError> {
                  let id = self.approvals.record(request)?;
                  self.record(
                      GovernanceChange::ApprovalRecorded {
                          approval_id: id.clone(),
                      },
                      None,
                      None,
                  );
                  Ok(id)
              }
          '''
          new = '''    pub fn record_approval(
                  &mut self,
                  request: ccos_enterprise_approval::ApprovalRequest,
              ) -> Result<String, ccos_enterprise_approval::ApprovalError> {
                  let actor = request.approver.clone();
                  let why = request.justification.clone();
                  let before = self.approvals.clone();
                  let id = self.approvals.record(request)?;
                  if let Err(error) = self.record_mandatory_governance(
                      GovernanceChange::ApprovalRecorded {
                          approval_id: id.clone(),
                      },
                      Some(&actor),
                      Some(&why),
                  ) {
                      self.approvals = before;
                      return Err(error);
                  }
                  Ok(id)
              }
          '''
          s = replace_once(s, old, new, 'mandatory approval audit')

          # Runtime regressions: default gates and revocation checkpoint behavior.
          idx = s.rfind('\n}\n')
          if idx < 0:
              raise SystemExit('cannot find runtime test module end')
          tests = r'''

              #[test]
              fn sensitive_actions_are_approval_gated_by_default_and_after_restore() {
                  let d = Deployment::new();
                  for action in DEFAULT_APPROVAL_REQUIRED_ACTIONS {
                      assert!(d.requires_approval(action), "{action} was not gated by default");
                  }
                  let snapshot = d.snapshot();
                  let restored = Deployment::restore(snapshot, &[], &[]).unwrap();
                  for action in DEFAULT_APPROVAL_REQUIRED_ACTIONS {
                      assert!(restored.requires_approval(action), "{action} lost its gate on restore");
                  }
              }

              #[test]
              fn approval_revocation_survives_runtime_snapshot_restore() {
                  let mut d = Deployment::new();
                  let req = ccos_enterprise_approval::ApprovalRequest::new(
                      TenantId("acme".into()),
                      "policy.disable",
                      &"ab".repeat(32),
                      "operator",
                      ccos_enterprise_approval::ApprovalDecision::Approved,
                      100,
                      None,
                      "test approval",
                  )
                  .unwrap();
                  let id = d.record_approval(req).unwrap();
                  d.approvals.registry.revoke(&id, "operator", 101, "revoked").unwrap();
                  let snapshot = d.snapshot();
                  let restored = Deployment::restore(snapshot, &[], d.governance().cloned().collect::<Vec<_>>().as_slice()).unwrap();
                  assert!(restored.approvals.registry.is_revoked(&id));
              }
          '''
          s = s[:idx] + tests + s[idx:]
          p.write_text(s)
          PY

          cargo fmt --all
          cargo check -p ccos-enterprise-approval -p ccos-enterprise-runtime
          cargo clippy -p ccos-enterprise-approval -p ccos-enterprise-runtime -- -D warnings
          cargo test -p ccos-enterprise-approval
          cargo test -p ccos-enterprise-runtime

          rm .github/workflows/zz-approval-hardening.yml
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add -A
          git commit -m 'fix(approval): close post-merge authorization gaps'
          git push origin HEAD:fix/approval-postmerge-hardening
