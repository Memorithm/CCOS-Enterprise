[workspace]
resolver = "2"
members = [
    # ── CCOS Core ────────────────────────────────────────────────────────
    "core",
    "core/crates/ccos-memory-runtime",

    # ── CCOS Enterprise ──────────────────────────────────────────────────
    "crates/ccos-enterprise-auth",
    "crates/ccos-enterprise-rbac",
    "crates/ccos-enterprise-tenancy",
    "crates/ccos-enterprise-knowledge-model",
    "crates/ccos-enterprise-knowledge",
    "crates/ccos-enterprise-knowledge-store",
    "crates/ccos-enterprise-ingest",
    "crates/ccos-enterprise-normalize",
    "crates/ccos-enterprise-parse",
    "crates/ccos-enterprise-extract",
    "crates/ccos-enterprise-resolution",
    "crates/ccos-enterprise-kg",
    "crates/ccos-enterprise-ontology",
    "crates/ccos-enterprise-promotion",
    "crates/ccos-enterprise-policy",
    "crates/ccos-enterprise-gateway",
    "crates/ccos-enterprise-observability",
    "crates/ccos-enterprise-backup",
    "crates/ccos-enterprise-governance",
    "crates/ccos-enterprise-qpages",
    "crates/ccos-enterprise-admin",
    "crates/ccos-enterprise-runtime",
    "crates/ccos-enterprise-store",
    "crates/ccos-enterprise-octasoma",
    "crates/ccos-enterprise-mcp",
    "crates/ccos-enterprise-sessions",
    "tools/ccos-license-server",
    "tests/ccos-enterprise-conformance",
    "tests/ccos-knowledge-conformance",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "LicenseRef-TarekZekriti-Dual"
repository = "https://github.com/Memorithm/CCOS-Enterprise"

[workspace.dependencies]
ccos-core = { path = "core", default-features = false }
octasoma = { git = "https://github.com/Memorithm/octasoma", rev = "145761aeb52ef8ded85dcf2b8c97690005284926", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
