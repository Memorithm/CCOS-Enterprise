<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1320" role="img" aria-labelledby="title desc">
  <title id="title">CCOS Enterprise — governed memory for AI systems</title>
  <desc id="desc">A large futuristic biomimetic brain, half organic neural tissue and half robotic crystalline circuitry, surrounded by holographic provenance, temporal memory, policy, tenant isolation, verified evidence and crash-recovery artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset=".36" stop-color="#edf5ff"/>
      <stop offset=".72" stop-color="#f4f0ff"/>
      <stop offset="1" stop-color="#edfdfa"/>
    </linearGradient>
    <radialGradient id="coreHalo">
      <stop offset="0" stop-color="#38d8ff" stop-opacity=".46"/>
      <stop offset=".34" stop-color="#6f6cff" stop-opacity=".25"/>
      <stop offset=".68" stop-color="#a66cff" stop-opacity=".11"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#6ce8ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#6ce8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="organic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".28" stop-color="#e3f7ff"/>
      <stop offset=".7" stop-color="#b4daf2"/>
      <stop offset="1" stop-color="#7ea8c8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f5ff"/>
      <stop offset=".22" stop-color="#9db7d2"/>
      <stop offset=".5" stop-color="#536e91"/>
      <stop offset=".78" stop-color="#243b61"/>
      <stop offset="1" stop-color="#101b38"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".88"/>
      <stop offset="1" stop-color="#dfeaff" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18c8ef"/>
      <stop offset=".45" stop-color="#5f79ff"/>
      <stop offset=".75" stop-color="#9c64ef"/>
      <stop offset="1" stop-color="#32d5aa"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c74ff"/>
      <stop offset="1" stop-color="#b568ec"/>
    </linearGradient>
    <pattern id="microgrid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#7590ae" stroke-width="1" opacity=".08"/>
      <circle cx="0" cy="0" r="1.6" fill="#6284a8" opacity=".11"/>
    </pattern>
    <pattern id="scan" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 8.5H9" stroke="#8aa1ba" stroke-width=".55" opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#173456" flood-opacity=".18"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="brainClip">
