[package]
name = "ccos-enterprise-docmemory"
version = "0.1.0-pre"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Tenant- and space-partitioned adapter that puts Core DocumentMemory (BM25/dense/fused) behind the governed recall path, with an optional ConformalGuard at ingest."

[dependencies]
ccos-core.workspace = true
ccos-enterprise-memory = { path = "../ccos-enterprise-memory" }
ccos-enterprise-tenancy = { path = "../ccos-enterprise-tenancy" }

[features]
# Forwards the exclusive-GPU encoder path to research examples (FPR-v12 requires it).
gpu-cuda = ["ccos-dense-encoder/gpu-cuda"]

[dev-dependencies]
ccos-dense-encoder = { path = "../ccos-dense-encoder" }
serde_json.workspace = true
sha2.workspace = true
