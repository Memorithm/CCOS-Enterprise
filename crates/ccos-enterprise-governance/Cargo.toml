[package]
name = "ccos-enterprise-governance"
version = "0.1.0-pre"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ccos-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ed25519-dalek = { version = "2", optional = true }

[features]
default = []
# Offline manifest/license verification (ed25519) — verify only, no executor.
license-verify = ["ccos-core/license", "dep:ed25519-dalek"]

[dev-dependencies]
ed25519-dalek = "2"
