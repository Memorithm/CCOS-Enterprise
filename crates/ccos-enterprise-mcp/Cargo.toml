[package]
name = "ccos-enterprise-mcp"
version = "0.1.0-pre"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The governed MCP front door for Core and explicitly enabled Enterprise-local capabilities."

[dependencies]
ccos-enterprise-execution = { path = "../ccos-enterprise-execution" }
ccos-enterprise-runtime = { path = "../ccos-enterprise-runtime" }
ccos-enterprise-gateway = { path = "../ccos-enterprise-gateway" }
ccos-enterprise-auth = { path = "../ccos-enterprise-auth", features = ["token-auth"] }
ccos-enterprise-decision-service = { path = "../ccos-enterprise-decision-service" }
ccos-enterprise-qpages = { path = "../ccos-enterprise-qpages" }
ccos-enterprise-store = { path = "../ccos-enterprise-store" }
ccos-core.workspace = true
ed25519-dalek = "2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
# The scenario constructors live behind `test-fixtures` because one of them
# asserts an identity nobody proved. Enabled here, in dev-dependencies only,
# so the tests can drive the gates while the shipped build cannot mint an
# actor.
ccos-enterprise-runtime = { path = "../ccos-enterprise-runtime", features = ["test-fixtures"] }
