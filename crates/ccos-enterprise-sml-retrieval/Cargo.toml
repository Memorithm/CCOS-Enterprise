[package]
name = "ccos-enterprise-sml-retrieval"
version = "0.1.0-pre"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Concurrent (alternative-arm) SML/GROK-ICM retrieval adapter contract behind the governed recall path. Never replaces the DocumentMemory lexical/fused default."

[features]
default = []
# Opt-in: exposes the concurrent-arm wrapper. Without it only the trait, types and the
# fail-closed `UnavailableSmlRetrieval` backend exist. No GPU / NVIDIA dependency either way.
concurrent-arm = []
# Opt-in: real SML-GENIUS backend (`sml_core::icm_rank::SignaturePageRanker`, sigpage-v0).
# Experimental, NOT BEIR-validated. Implies `concurrent-arm`. CPU-only, no NVIDIA.
sml-backend = ["concurrent-arm", "dep:sml-core"]

[dependencies]
ccos-enterprise-memory = { path = "../ccos-enterprise-memory" }
ccos-enterprise-tenancy = { path = "../ccos-enterprise-tenancy" }
# Pinned to SML-GENIUS main @ #762 (538d17da) (exact git-rev pin, as for other Memorithm git deps).
# License note: sml-core is PolyForm-Noncommercial-1.0.0; optional, never in default builds.
sml-core = { git = "https://github.com/Memorithm/SML-GENIUS", rev = "538d17da077391654fb2937520698e1a3205e371", default-features = false, features = ["icm-rank"], optional = true }

[dev-dependencies]
# Campaign harness only (SML-GENIUS prereg #761, PR3): BM25 + metrics reference of CCOS #217.
ccos-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[[example]]
name = "beir_sml_icm5"
required-features = ["sml-backend"]
