# cargo-deny configuration for the Enterprise workspace — the supply-chain
# gate ci-security.yml runs. Mirrors CCOS Core's posture, minus anything the
# Enterprise boundary forbids (no premium-crate git sources here, ever).

[graph]
# NOT `all-features`. Core carries opt-in Pro features of its own — `octasoma`
# pulls a premium engine over git — and Enterprise must never enable them
# (§4.2). Turning every feature on would resolve exactly the graph the product
# boundary forbids, and then ask this gate to bless it. The gate checks the
# graph Enterprise actually ships: Core at `default-features = false`, plus the
# one optional Enterprise feature (`license-verify`), whose `ed25519-dalek`
# arrives non-optionally through the license server regardless.
all-features = false
targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# `private.ignore` only reaches crates marked `publish = false`; neither Core
# package is, so both house licenses are allowed explicitly. Core is a
# workspace member now rather than an external path dependency, which changes
# nothing about the licences themselves — only about which check would
# otherwise have skipped them.
exceptions = [
    { name = "ccos-core", allow = ["LicenseRef-TarekZekriti-Dual"] },
    { name = "ccos-memory-runtime", allow = ["LicenseRef-CheckupAuto-Dual"] },
]

[licenses.private]
# Workspace crates carry the repository's source-available/custom commercial terms — reviewed in
# LICENSING.md rather than treated as third-party OSI dependencies.
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
