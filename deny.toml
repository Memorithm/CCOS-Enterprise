# cargo-deny configuration for the Enterprise workspace — the supply-chain
# gate ci-security.yml runs. Git sources remain denied by default; the only
# explicit Git exceptions are the reviewed canonical Memorithm memory/compute
# foundations used by the governed Enterprise OctaSoma adapter.

[graph]
# NOT `all-features`. Core carries opt-in features of its own and Enterprise
# must not sweep that matrix. The gate checks the graph Enterprise actually
# ships: Core at `default-features = false`, plus Enterprise's own dependencies.
all-features = false
targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# House/source-available licences are never promoted to the global allowlist.
# They are accepted only for the exact reviewed internal crates that require
# them. This keeps an unrelated dependency from silently inheriting the same
# licence exception.
exceptions = [
    { name = "ccos-core", allow = ["LicenseRef-TarekZekriti-Dual"] },
    { name = "ccos-memory-runtime", allow = ["LicenseRef-CheckupAuto-Dual"] },
    { name = "octasoma", allow = ["LicenseRef-CheckupAuto-Dual"] },
    { name = "scirust-license", allow = ["PolyForm-Noncommercial-1.0.0"] },
]

[licenses.private]
# Workspace crates carry the repository's source-available/custom commercial terms — reviewed in
# LICENSING.md rather than treated as third-party OSI dependencies.
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Exact canonical repositories only. Revisions remain pinned in Cargo.toml and
# Cargo.lock; no arbitrary third-party Git dependency is admitted here.
allow-git = [
    "https://github.com/Memorithm/octasoma",
    "https://github.com/Memorithm/scirust",
]
