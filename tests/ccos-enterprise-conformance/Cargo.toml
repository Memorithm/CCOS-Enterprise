[package]
name = "ccos-enterprise-conformance"
version = "0.1.0-pre"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The composed Enterprise product path, exercised end to end. The individual crates own their unit tests; this package owns the behaviour that only exists once they are wired together."

[dependencies]
ccos-enterprise-auth = { path = "../../crates/ccos-enterprise-auth" }
ccos-enterprise-rbac = { path = "../../crates/ccos-enterprise-rbac" }
ccos-enterprise-tenancy = { path = "../../crates/ccos-enterprise-tenancy" }
ccos-enterprise-policy = { path = "../../crates/ccos-enterprise-policy" }
ccos-enterprise-gateway = { path = "../../crates/ccos-enterprise-gateway" }
ccos-enterprise-observability = { path = "../../crates/ccos-enterprise-observability" }
ccos-enterprise-backup = { path = "../../crates/ccos-enterprise-backup" }
ccos-enterprise-qpages = { path = "../../crates/ccos-enterprise-qpages" }
ccos-enterprise-admin = { path = "../../crates/ccos-enterprise-admin" }
ccos-enterprise-runtime = { path = "../../crates/ccos-enterprise-runtime" }
# The stress suite drives the licensing stack too: claim-code parsing, the
# base64url wire codec, and the counter's vault + HTTP loop are as much a part
# of the product's blast radius as the governed request path.
ccos-enterprise-governance = { path = "../../crates/ccos-enterprise-governance", features = ["license-verify"] }
ccos-license-server = { path = "../../tools/ccos-license-server" }
serde_json = "1"

[dev-dependencies]
# The scenario constructors live behind `test-fixtures` because one of them
# asserts an identity nobody proved. Enabled here, in dev-dependencies only,
# so the tests can drive the gates while the shipped build cannot mint an
# actor.
ccos-enterprise-runtime = { path = "../../crates/ccos-enterprise-runtime", features = ["test-fixtures"] }
ed25519-dalek = "2"
